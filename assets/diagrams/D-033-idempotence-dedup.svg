<svg viewBox="0 0 720 456" role="img" class="kg-diagram"
     aria-labelledby="d033-title d033-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d033-title">멱등성 중복 판별 — PID 와 파티션별 시퀀스 번호로 브로커가 중복을 폐기</title>
  <desc id="d033-desc">프로듀서와 브로커 두 개의 생명선을 가진 시퀀스 그림입니다.
    프로듀서는 producer id 7391 과 epoch 0 을 부여받고, 파티션 orders-0 에 대해 시퀀스 번호 4 와 5 를 담은 배치를 보냅니다.
    브로커는 이를 로그에 append 하고 그 파티션의 마지막 시퀀스를 5 로 기록한 뒤 응답을 보냅니다.
    그 응답이 네트워크에서 유실되어 프로듀서는 실패로 판단하고 같은 producer id 와 같은 시퀀스 번호 4, 5 로 재전송합니다.
    브로커는 들어온 배치의 시작·끝 시퀀스가 이미 기록한 마지막 시퀀스와 일치하는 것을 보고 중복으로 판단해 로그에 쓰지 않고 성공 응답만 돌려줍니다.
    그래서 로그에는 오프셋 100 과 101 두 건만 남고 중복이 생기지 않습니다.
    중복 판별의 열쇠는 producer id, epoch, 파티션 세 값의 조합으로 관리되는 시퀀스 번호이며, 판정하는 주체는 프로듀서가 아니라 브로커입니다.</desc>

  <defs>
    <marker id="d033-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
    <marker id="d033-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker--accent" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
    <marker id="d033-ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker--ok" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
  </defs>

  <text x="8" y="20" class="dg-fs-md dg-bold">중복을 걸러내는 주체는 <tspan class="dg-bold">브로커</tspan> 입니다. 판단 근거는 PID + 파티션별 시퀀스 번호입니다.</text>

  <!-- 액터 -->
  <rect class="dg-node" x="8" y="32" width="200" height="46" rx="4"/>
  <text x="18" y="51" class="dg-fs-sm dg-bold">프로듀서</text>
  <text x="18" y="69" class="dg-fs-sm dg-mono">PID=7391 epoch=0</text>

  <rect class="dg-node dg-node--alt" x="256" y="32" width="200" height="46" rx="4"/>
  <text x="266" y="51" class="dg-fs-sm dg-bold">브로커 (리더)</text>
  <text x="266" y="69" class="dg-fs-sm">PID 별 마지막 seq 보관</text>

  <!-- 생명선 -->
  <line class="dg-edge dg-edge--muted dg-edge--dotted" x1="108" y1="78" x2="108" y2="322"/>
  <line class="dg-edge dg-edge--muted dg-edge--dotted" x1="356" y1="78" x2="356" y2="322"/>

  <!-- ① 최초 전송 -->
  <text x="8" y="100" class="dg-fs-sm dg-bold">① 최초 전송</text>
  <line class="dg-edge" x1="108" y1="112" x2="352" y2="112" marker-end="url(#d033-ah)"/>
  <text x="118" y="108" class="dg-fs-sm dg-mono">배치 [seq 4, 5]</text>

  <!-- ② append -->
  <rect class="dg-node dg-node--ok" x="256" y="120" width="200" height="40" rx="4"/>
  <text x="266" y="137" class="dg-fs-sm dg-bold">② 로그에 append</text>
  <text x="266" y="153" class="dg-fs-sm">이 PID 의 <tspan class="dg-mono">lastSeq = 5</tspan></text>

  <!-- ③ 응답 유실 -->
  <text x="8" y="182" class="dg-fs-sm dg-bold">③ 응답 유실</text>
  <line class="dg-edge dg-edge--danger dg-edge--dashed" x1="352" y1="194" x2="240" y2="194"/>
  <path class="dg-x" d="M222,188 L236,200 M236,188 L222,200"/>
  <text x="248" y="190" class="dg-fs-sm dg-muted">응답이 도중에 사라짐</text>
  <text x="118" y="212" class="dg-fs-sm dg-muted">프로듀서는 실패로 판단</text>

  <!-- ④ 재시도 -->
  <text x="8" y="240" class="dg-fs-sm dg-bold">④ 재시도</text>
  <line class="dg-edge dg-edge--accent" x1="108" y1="252" x2="352" y2="252" marker-end="url(#d033-ah-accent)"/>
  <text x="118" y="248" class="dg-fs-sm dg-bold dg-mono">같은 PID · 같은 seq 4, 5</text>

  <!-- ⑤ 중복 폐기 -->
  <rect class="dg-node dg-node--accent" x="256" y="260" width="200" height="44" rx="4"/>
  <text x="266" y="278" class="dg-fs-sm dg-bold">⑤ 중복으로 판정 → 폐기</text>
  <text x="266" y="296" class="dg-fs-sm">기록한 마지막 seq 와 일치</text>

  <!-- ⑥ 성공 응답 -->
  <line class="dg-edge dg-edge--ok" x1="352" y1="318" x2="112" y2="318" marker-end="url(#d033-ah-ok)"/>
  <text x="120" y="314" class="dg-fs-sm">⑥ 성공 응답 (로그는 그대로)</text>

  <!-- 로그 상태 -->
  <text x="480" y="100" class="dg-fs-sm dg-bold">파티션 <tspan class="dg-mono">orders-0</tspan> 로그</text>
  <rect class="dg-node dg-node--ok" x="480" y="112" width="112" height="34" rx="3"/>
  <text x="490" y="126" class="dg-fs-sm dg-num">offset 100</text>
  <text x="490" y="141" class="dg-fs-sm dg-mono">seq 4</text>
  <rect class="dg-node dg-node--ok" x="480" y="150" width="112" height="34" rx="3"/>
  <text x="490" y="164" class="dg-fs-sm dg-num">offset 101</text>
  <text x="490" y="179" class="dg-fs-sm dg-mono">seq 5</text>

  <rect class="dg-node--empty" x="480" y="196" width="112" height="34" rx="3"/>
  <text x="490" y="217" class="dg-fs-sm dg-muted">(비어 있음)</text>
  <path class="dg-x" d="M600,206 L614,220 M614,206 L600,220"/>
  <text x="622" y="217" class="dg-fs-sm dg-muted">중복</text>
  <text x="622" y="233" class="dg-fs-sm dg-muted">안 생김</text>

  <rect class="dg-node dg-node--accent" x="480" y="248" width="232" height="56" rx="4"/>
  <text x="490" y="268" class="dg-fs-sm dg-bold">재시도가 몇 번이든</text>
  <text x="490" y="288" class="dg-fs-sm">로그에는 2건만 남습니다</text>

  <!-- 정리 -->
  <line class="dg-grid" x1="8" y1="340" x2="712" y2="340"/>
  <text x="8" y="358" class="dg-fs-sm">시퀀스는 <tspan class="dg-bold">(PID, epoch, 파티션)</tspan> 조합별로 따로 관리됩니다. 파티션이 다르면 시퀀스도 따로 셉니다.</text>
  <text x="8" y="376" class="dg-fs-sm">기대보다 큰 seq 가 오면 브로커가 <tspan class="dg-mono">OUT_OF_ORDER_SEQUENCE_NUMBER</tspan> 로 거부합니다.</text>
  <text x="8" y="394" class="dg-fs-sm">기본값 <tspan class="dg-mono">enable.idempotence=true</tspan> 는 <tspan class="dg-mono">acks=all</tspan> · <tspan class="dg-mono">retries&gt;0</tspan> · <tspan class="dg-mono">max.in.flight≤5</tspan> 를 요구합니다.</text>
  <text x="8" y="412" class="dg-fs-sm">막아 주는 것은 <tspan class="dg-bold">재시도로 생기는 중복</tspan> 뿐입니다. <tspan class="dg-mono">send()</tspan> 를 두 번 부르면 2건이 남습니다.</text>
  <text x="8" y="430" class="dg-fs-sm dg-muted"><tspan class="dg-mono">max.in.flight…</tspan> 를 6 이상으로 <tspan class="dg-bold">명시</tspan> 하면 <tspan class="dg-mono">ConfigException</tspan>. 다른 설정 충돌은 <tspan class="dg-bold">조용히 비활성화</tspan> 됩니다.</text>
  <text x="8" y="448" class="dg-fs-sm dg-muted">상한이 5인 이유: 브로커가 파티션별로 최근 배치 5개의 시퀀스만 보관합니다.</text>
</svg>
