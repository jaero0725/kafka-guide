<svg viewBox="0 0 720 840" role="img" class="kg-diagram"
     aria-labelledby="d120-title d120-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d120-title">트러블슈팅 결정 트리 — 컨슈머가 메시지를 읽지 않을 때</title>
  <desc id="d120-desc">컨슈머가 읽지 않는 상황을 위에서 아래로 좁혀 가는 결정 트리입니다. 마름모는 판단, 사각형은 조치이며 각 판단에는 확인할 CLI 명령이 함께 적혀 있습니다. 첫째, 그룹에 멤버가 있는지 kafka-consumer-groups.sh --describe --members 로 확인합니다. 멤버가 없으면 프로세스 상태와 group.id, subscribe 대상을 봅니다. 둘째, LOG-END-OFFSET 이 멈춰 있으면 읽을 데이터가 없는 것이므로 프로듀서 쪽 문제입니다. 셋째, 그룹 상태가 PreparingRebalance 를 반복하면 리밸런스 루프이므로 max.poll.interval.ms 와 max.poll.records 를 조정합니다. 넷째, 컨슈머 수가 파티션 수보다 많으면 남는 컨슈머는 유휴 상태이므로 파티션을 늘립니다. 다섯째, LAG 이 0 인데 기대한 데이터가 없으면 새 group.id 와 auto.offset.reset=latest 조합으로 과거 데이터를 건너뛴 경우이므로 오프셋을 되돌립니다. 여섯째, isolation.level 이 read_committed 이면 진행 중인 트랜잭션이 LSO 를 막고 있을 수 있습니다. 마지막으로 권한 오류를 확인합니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--ok" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--warn" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<text class="dg-fs-md dg-bold" x="8" y="20">컨슈머가 메시지를 읽지 않는다</text>
<text class="dg-fs-sm dg-muted" x="8" y="40">마름모 = 판단 · 사각형 = 조치. 위에서 아래로 순서대로 좁혀 갑니다.</text>
<g>
<path class="dg-node dg-node--warn" d="M176,54 L344,96 L176,138 L8,96 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="92" text-anchor="middle">그룹에 멤버가 없다?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="110" text-anchor="middle">--describe --group G --members</text>
<rect class="dg-node dg-node--danger" x="392" y="66" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="85">컨슈머 자체가 붙지 못한 상태</text>
<text class="dg-fs-sm" x="404" y="103">프로세스 생존 · group.id 오타 · subscribe 대상 토픽 확인</text>
<text class="dg-fs-sm" x="404" y="121">bootstrap.servers 와 advertised.listeners 도 확인 (D-101)</text>
<path class="dg-edge dg-edge--danger" d="M346,96 L388,96" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="90">예</text>
<path class="dg-edge" d="M176,139 L176,158" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="154">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,160 L344,202 L176,244 L8,202 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="198" text-anchor="middle">LOG-END-OFFSET 이 안 늘어난다?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="216" text-anchor="middle">kafka-get-offsets.sh --topic T</text>
<rect class="dg-node dg-node--warn" x="392" y="172" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="191">읽을 데이터 자체가 없다</text>
<text class="dg-fs-sm" x="404" y="209">프로듀서 쪽 문제입니다 → D-121 결정 트리로 이동</text>
<text class="dg-fs-sm" x="404" y="227">토픽 이름·파티션을 잘못 보고 있는 것은 아닌지 확인</text>
<path class="dg-edge dg-edge--danger" d="M346,202 L388,202" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="196">예</text>
<path class="dg-edge" d="M176,245 L176,264" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="260">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,266 L344,308 L176,350 L8,308 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="304" text-anchor="middle">상태가 PreparingRebalance 반복?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="322" text-anchor="middle">--describe --group G --state</text>
<rect class="dg-node dg-node--danger" x="392" y="278" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="297">리밸런스 루프</text>
<text class="dg-fs-sm" x="404" y="315">max.poll.records 를 줄이고 max.poll.interval.ms 를 실측보다 크게</text>
<text class="dg-fs-sm" x="404" y="333">원인 분석은 D-111 (case02) 참고</text>
<path class="dg-edge dg-edge--danger" d="M346,308 L388,308" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="302">예</text>
<path class="dg-edge" d="M176,351 L176,370" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="366">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,372 L344,414 L176,456 L8,414 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="410" text-anchor="middle">컨슈머 수 > 파티션 수?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="428" text-anchor="middle">--describe --group G --members</text>
<rect class="dg-node dg-node--warn" x="392" y="384" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="403">남는 컨슈머는 유휴 상태</text>
<text class="dg-fs-sm" x="404" y="421">한 파티션은 한 컨슈머에게만 할당됩니다</text>
<text class="dg-fs-sm dg-mono dg-muted" x="404" y="439">kafka-topics.sh --alter --partitions N 으로 증설 (되돌릴 수 없음)</text>
<path class="dg-edge dg-edge--danger" d="M346,414 L388,414" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="408">예</text>
<path class="dg-edge" d="M176,457 L176,476" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="472">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,478 L344,520 L176,562 L8,520 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="516" text-anchor="middle">LAG 은 0 인데 데이터가 없다?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="534" text-anchor="middle">--describe --group G</text>
<rect class="dg-node dg-node--danger" x="392" y="490" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="509">과거 데이터를 건너뛴 상태</text>
<text class="dg-fs-sm" x="404" y="527">새 group.id + auto.offset.reset=latest 조합입니다 → D-110</text>
<text class="dg-fs-sm dg-mono dg-muted" x="404" y="545">kafka-consumer-groups.sh --reset-offsets --to-earliest --execute</text>
<path class="dg-edge dg-edge--danger" d="M346,520 L388,520" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="514">예</text>
<path class="dg-edge" d="M176,563 L176,582" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="578">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,584 L344,626 L176,668 L8,626 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="622" text-anchor="middle">isolation.level=read_committed?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="640" text-anchor="middle">컨슈머 설정 확인</text>
<rect class="dg-node dg-node--warn" x="392" y="596" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="615">진행 중 트랜잭션이 LSO 를 막는 중</text>
<text class="dg-fs-sm" x="404" y="633">커밋되지 않은 트랜잭션 뒤의 레코드는 보이지 않습니다</text>
<text class="dg-fs-sm" x="404" y="651">transaction.timeout.ms 만료 또는 커밋·중단을 기다립니다</text>
<path class="dg-edge dg-edge--danger" d="M346,626 L388,626" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="620">예</text>
<path class="dg-edge" d="M176,669 L176,688" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="684">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,690 L344,732 L176,774 L8,732 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="728" text-anchor="middle">여기까지 아니라면</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="746" text-anchor="middle">kafka-acls.sh --list</text>
<rect class="dg-node dg-node--danger" x="392" y="702" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="721">권한을 확인합니다</text>
<text class="dg-fs-sm" x="404" y="739">TOPIC_AUTHORIZATION_FAILED · GROUP_AUTHORIZATION_FAILED 로그 확인</text>
<text class="dg-fs-sm" x="404" y="757">토픽 Read 와 그룹 Read 권한이 모두 필요합니다</text>
<path class="dg-edge dg-edge--danger" d="M346,732 L388,732" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="726">예</text>
<line class="dg-grid" x1="8" y1="784" x2="712" y2="784"/>
<text class="dg-fs-sm" x="8" y="804">모든 kafka-consumer-groups.sh 명령에는 --bootstrap-server 가 필요합니다.</text>
<text class="dg-fs-sm" x="8" y="822">판단 순서를 지키면 "브로커 장애"부터 의심하는 실수를 피할 수 있습니다 — 대개 원인은 클라이언트 쪽입니다.</text>
</svg>
