<svg viewBox="0 0 720 840" role="img" class="kg-diagram"
     aria-labelledby="d120-title d120-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d120-title">트러블슈팅 결정 트리 — 컨슈머가 메시지를 읽지 않을 때</title>
  <desc id="d120-desc">컨슈머가 읽지 않는 상황을 위에서 아래로 좁혀 가는 결정 트리입니다. 마름모는 판단, 사각형은 조치이며 각 판단에는 확인할 CLI 명령이 함께 적혀 있습니다. 첫째, 그룹에 멤버가 있는지 kafka-consumer-groups.sh --describe --members 로 확인합니다. 멤버가 없으면 프로세스 상태와 group.id, subscribe 대상을 봅니다. 둘째, LOG-END-OFFSET 이 멈춰 있으면 읽을 데이터가 없는 것이므로 프로듀서 쪽 문제입니다. 셋째, 그룹 상태가 PreparingRebalance 를 반복하면 리밸런스 루프이므로 max.poll.interval.ms 와 max.poll.records 를 조정합니다. 넷째, 컨슈머 수가 파티션 수보다 많으면 남는 컨슈머는 유휴 상태이므로 파티션을 늘립니다. 다섯째, LAG 이 0 인데 기대한 데이터가 없으면 새 group.id 와 auto.offset.reset=latest 조합으로 과거 데이터를 건너뛴 경우이므로 오프셋을 되돌립니다. 여섯째, isolation.level 이 read_committed 이면 진행 중인 트랜잭션이 LSO 를 막고 있을 수 있습니다. 마지막으로 권한 오류를 확인합니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--ok" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--warn" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<text class="dg-fs-md dg-bold" x="8" y="20">컨슈머가 메시지를 읽지 않는다</text>
<text class="dg-fs-sm dg-muted" x="8" y="40">마름모 = 판단 · 사각형 = 조치. 위에서 아래로 순서대로 좁혀 갑니다.</text>
<g>
<path class="dg-node dg-node--warn" d="M158,54 L308,96 L158,138 L8,96 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="92" text-anchor="middle">그룹에 멤버가 없다?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="110" text-anchor="middle">--describe --members</text>
<rect class="dg-node dg-node--danger" x="352" y="57" width="360" height="78" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="76">컨슈머가 붙지 못한 상태</text>
<text class="dg-fs-sm" x="364" y="94">· 프로세스 생존 · group.id 오타 확인</text>
<text class="dg-fs-sm" x="364" y="112">· subscribe 대상 토픽 확인</text>
<text class="dg-fs-sm" x="364" y="130">· bootstrap.servers 확인 → D-101</text>
<path class="dg-edge dg-edge--danger" d="M310,96 L348,96" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="90">예</text>
<path class="dg-edge" d="M158,139 L158,158" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="168" y="154">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M158,160 L308,202 L158,244 L8,202 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="198" text-anchor="middle">LOG-END-OFFSET 이 안 늘어난다?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="216" text-anchor="middle">kafka-get-offsets.sh</text>
<rect class="dg-node dg-node--warn" x="352" y="172" width="360" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="191">읽을 데이터 자체가 없다</text>
<text class="dg-fs-sm" x="364" y="209">· 프로듀서 쪽 문제 → D-121</text>
<text class="dg-fs-sm" x="364" y="227">· 토픽·파티션을 잘못 보고 있는지 확인</text>
<path class="dg-edge dg-edge--danger" d="M310,202 L348,202" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="196">예</text>
<path class="dg-edge" d="M158,245 L158,264" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="168" y="260">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M158,266 L308,308 L158,350 L8,308 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="304" text-anchor="middle">PreparingRebalance 반복?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="322" text-anchor="middle">--describe --state</text>
<rect class="dg-node dg-node--danger" x="352" y="269" width="360" height="78" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="288">리밸런스 루프</text>
<text class="dg-fs-sm" x="364" y="306">· max.poll.records 를 줄인다</text>
<text class="dg-fs-sm" x="364" y="324">· max.poll.interval.ms 를 올린다</text>
<text class="dg-fs-sm" x="364" y="342">· 원인 분석은 D-111 (case02)</text>
<path class="dg-edge dg-edge--danger" d="M310,308 L348,308" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="302">예</text>
<path class="dg-edge" d="M158,351 L158,370" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="168" y="366">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M158,372 L308,414 L158,456 L8,414 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="410" text-anchor="middle">컨슈머 수 > 파티션 수?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="428" text-anchor="middle">--describe --members</text>
<rect class="dg-node dg-node--warn" x="352" y="375" width="360" height="78" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="394">남는 컨슈머는 유휴 상태</text>
<text class="dg-fs-sm" x="364" y="412">· 한 파티션 = 한 컨슈머</text>
<text class="dg-fs-sm" x="364" y="430">· kafka-topics.sh --alter --partitions N</text>
<text class="dg-fs-sm" x="364" y="448">· 파티션은 줄일 수 없다</text>
<path class="dg-edge dg-edge--danger" d="M310,414 L348,414" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="408">예</text>
<path class="dg-edge" d="M158,457 L158,476" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="168" y="472">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M158,478 L308,520 L158,562 L8,520 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="516" text-anchor="middle">LAG 0 인데 데이터가 없다?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="534" text-anchor="middle">--describe --group G</text>
<rect class="dg-node dg-node--danger" x="352" y="490" width="360" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="509">과거 데이터를 건너뛴 상태</text>
<text class="dg-fs-sm" x="364" y="527">· 새 group.id + latest 조합 → D-110</text>
<text class="dg-fs-sm" x="364" y="545">· --reset-offsets --to-earliest --execute</text>
<path class="dg-edge dg-edge--danger" d="M310,520 L348,520" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="514">예</text>
<path class="dg-edge" d="M158,563 L158,582" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="168" y="578">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M158,584 L308,626 L158,668 L8,626 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="622" text-anchor="middle">isolation.level=read_committed?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="640" text-anchor="middle">컨슈머 설정 확인</text>
<rect class="dg-node dg-node--warn" x="352" y="596" width="360" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="615">트랜잭션이 LSO 를 막는 중</text>
<text class="dg-fs-sm" x="364" y="633">· 커밋 안 된 트랜잭션 뒤는 안 보임</text>
<text class="dg-fs-sm" x="364" y="651">· 커밋·중단 또는 타임아웃을 기다림</text>
<path class="dg-edge dg-edge--danger" d="M310,626 L348,626" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="620">예</text>
<path class="dg-edge" d="M158,669 L158,688" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="168" y="684">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M158,690 L308,732 L158,774 L8,732 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="728" text-anchor="middle">여기까지 모두 아니라면</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="746" text-anchor="middle">kafka-acls.sh --list</text>
<rect class="dg-node dg-node--danger" x="352" y="702" width="360" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="721">권한을 확인한다</text>
<text class="dg-fs-sm" x="364" y="739">· TOPIC / GROUP_AUTHORIZATION_FAILED</text>
<text class="dg-fs-sm" x="364" y="757">· 토픽 Read + 그룹 Read 둘 다 필요</text>
<path class="dg-edge dg-edge--danger" d="M310,732 L348,732" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="726">예</text>
<line class="dg-grid" x1="8" y1="784" x2="712" y2="784"/>
<text class="dg-fs-sm" x="8" y="804">모든 kafka-consumer-groups.sh 명령에는 --bootstrap-server 가 필요합니다.</text>
<text class="dg-fs-sm" x="8" y="822">원인은 대개 클라이언트 쪽입니다 — 브로커 장애부터 의심하지 마세요.</text>
</svg>
