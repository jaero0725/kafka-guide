<svg viewBox="0 0 720 428" role="img" class="kg-diagram"
     aria-labelledby="d044-title d044-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d044-title">assign() vs subscribe() — 그룹 조정에 참여하는지가 갈림길</title>
  <desc id="d044-desc">왼쪽은 subscribe 로 토픽을 구독하는 경우입니다.
    컨슈머들이 그룹 코디네이터에 합류하고 코디네이터가 파티션을 나눠 주며, 멤버가 바뀌면 리밸런스가 일어납니다. group.id 가 반드시 필요합니다.
    오른쪽은 assign 으로 파티션을 직접 지정하는 경우입니다.
    그룹 코디네이터가 관여하지 않으므로 리밸런스가 없고, 다른 컨슈머가 죽어도 내 파티션은 그대로입니다.
    같은 group.id 를 공유해도 서로 조정하지 않고 각자 독립적으로 동작합니다.
    파티션 할당 자체에는 group.id 가 필요하지 않지만, 오프셋을 Kafka 에 커밋하려면 group.id 가 있어야 하며
    커밋 충돌을 피하려면 인스턴스마다 다른 group.id 를 쓰는 것이 좋습니다.
    아래 표는 파티션 결정 주체, 그룹 조정 참여, 리밸런스 유무, group.id 필요 여부, 다른 컨슈머 장애 시 동작,
    파티션 수가 늘었을 때의 동작을 비교합니다. 두 방식을 같은 컨슈머 인스턴스에서 섞어 쓸 수는 없습니다.</desc>

  <defs>
    <marker id="d044-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
    <marker id="d044-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker--accent" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
  </defs>

  <text x="8" y="20" class="dg-fs-md dg-bold">가운데에 코디네이터가 있는지 없는지 — 나머지 차이는 전부 여기서 나옵니다</text>

  <!-- ═══ subscribe ═══ -->
  <rect class="dg-panel" x="8" y="32" width="348" height="150" rx="4"/>
  <rect class="dg-node dg-node--accent" x="16" y="40" width="332" height="24" rx="3"/>
  <text x="24" y="57" class="dg-fs-sm dg-bold dg-mono">subscribe(topics)</text>

  <rect class="dg-node dg-node--accent" x="100" y="74" width="164" height="28" rx="4"/>
  <text x="110" y="93" class="dg-fs-sm dg-bold">그룹 코디네이터</text>

  <line class="dg-edge dg-edge--accent" x1="60" y1="126" x2="140" y2="104" marker-end="url(#d044-ah-accent)"/>
  <line class="dg-edge dg-edge--accent" x1="182" y1="126" x2="182" y2="104" marker-end="url(#d044-ah-accent)"/>
  <line class="dg-edge dg-edge--accent" x1="304" y1="126" x2="224" y2="104" marker-end="url(#d044-ah-accent)"/>

  <rect class="dg-node" x="20" y="128" width="100" height="28" rx="4"/>
  <text x="28" y="147" class="dg-fs-sm">C1</text>
  <rect class="dg-node" x="132" y="128" width="100" height="28" rx="4"/>
  <text x="140" y="147" class="dg-fs-sm">C2</text>
  <rect class="dg-node" x="244" y="128" width="100" height="28" rx="4"/>
  <text x="252" y="147" class="dg-fs-sm">C3</text>

  <text x="16" y="174" class="dg-fs-sm">코디네이터가 파티션을 나눠 줍니다 → 리밸런스 있음</text>

  <!-- ═══ assign ═══ -->
  <rect class="dg-panel" x="364" y="32" width="348" height="150" rx="4"/>
  <rect class="dg-node dg-node--warn" x="372" y="40" width="332" height="24" rx="3"/>
  <text x="380" y="57" class="dg-fs-sm dg-bold dg-mono">assign(partitions)</text>

  <rect class="dg-node--empty" x="456" y="74" width="164" height="28" rx="4"/>
  <text x="466" y="93" class="dg-fs-sm dg-muted">코디네이터 없음</text>

  <rect class="dg-node" x="376" y="128" width="100" height="28" rx="4"/>
  <text x="384" y="147" class="dg-fs-sm">C1 → p0</text>
  <rect class="dg-node" x="488" y="128" width="100" height="28" rx="4"/>
  <text x="496" y="147" class="dg-fs-sm">C2 → p1</text>
  <rect class="dg-node" x="600" y="128" width="100" height="28" rx="4"/>
  <text x="608" y="147" class="dg-fs-sm">C3 → p2</text>

  <line class="dg-edge dg-edge--dotted" x1="426" y1="128" x2="426" y2="104"/>
  <line class="dg-edge dg-edge--dotted" x1="538" y1="128" x2="538" y2="104"/>
  <line class="dg-edge dg-edge--dotted" x1="650" y1="128" x2="650" y2="104"/>

  <text x="372" y="174" class="dg-fs-sm">내가 파티션을 직접 지정합니다 → 리밸런스 없음</text>

  <!-- ═══ 비교표 ═══ -->
  <rect class="dg-node dg-node--alt" x="8" y="194" width="704" height="26" rx="3"/>
  <text x="18" y="212" class="dg-fs-sm dg-bold">항목</text>
  <text x="246" y="212" class="dg-fs-sm dg-bold dg-mono">subscribe()</text>
  <text x="480" y="212" class="dg-fs-sm dg-bold dg-mono">assign()</text>

  <line class="dg-grid" x1="238" y1="194" x2="238" y2="388"/>
  <line class="dg-grid" x1="472" y1="194" x2="472" y2="388"/>

  <text x="18" y="240" class="dg-fs-sm">파티션 결정 주체</text>
  <text x="246" y="240" class="dg-fs-sm">코디네이터</text>
  <text x="480" y="240" class="dg-fs-sm">애플리케이션</text>
  <line class="dg-grid" x1="8" y1="248" x2="712" y2="248"/>

  <text x="18" y="268" class="dg-fs-sm">그룹 조정 참여</text>
  <text x="246" y="268" class="dg-fs-sm">참여</text>
  <text x="480" y="268" class="dg-fs-sm dg-bold">참여하지 않음</text>
  <line class="dg-grid" x1="8" y1="276" x2="712" y2="276"/>

  <text x="18" y="296" class="dg-fs-sm">리밸런스</text>
  <text x="246" y="296" class="dg-fs-sm">있음</text>
  <text x="480" y="296" class="dg-fs-sm dg-bold">없음</text>
  <line class="dg-grid" x1="8" y1="304" x2="712" y2="304"/>

  <text x="18" y="324" class="dg-fs-sm dg-mono">group.id</text>
  <text x="246" y="324" class="dg-fs-sm">필수</text>
  <text x="480" y="324" class="dg-fs-sm dg-bold">불필요 (커밋할 때만 필요)</text>
  <line class="dg-grid" x1="8" y1="332" x2="712" y2="332"/>

  <text x="18" y="352" class="dg-fs-sm">다른 컨슈머가 죽으면</text>
  <text x="246" y="352" class="dg-fs-sm">파티션이 재할당됨</text>
  <text x="480" y="352" class="dg-fs-sm">아무 변화 없음</text>
  <line class="dg-grid" x1="8" y1="360" x2="712" y2="360"/>

  <text x="18" y="380" class="dg-fs-sm">파티션 수가 늘면</text>
  <text x="246" y="380" class="dg-fs-sm">자동으로 반영</text>
  <text x="480" y="380" class="dg-fs-sm dg-mono">assign() 을 다시 호출</text>
  <line class="dg-grid" x1="8" y1="388" x2="712" y2="388"/>

  <!-- 정리 -->
  <text x="8" y="408" class="dg-fs-sm">두 방식을 <tspan class="dg-bold">같은 컨슈머 인스턴스에서 섞어 쓸 수 없습니다.</tspan></text>
  <text x="8" y="424" class="dg-fs-sm dg-muted">같은 <tspan class="dg-mono">group.id</tspan> 로 <tspan class="dg-mono">assign()</tspan> 을 쓰면 커밋이 충돌합니다 — 인스턴스별로 다른 값을 권장합니다.</text>
</svg>
