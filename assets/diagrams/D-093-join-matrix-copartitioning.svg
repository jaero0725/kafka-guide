<svg viewBox="0 0 720 430" role="img" class="kg-diagram"
     aria-labelledby="d093-title d093-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d093-title">조인 매트릭스와 co-partitioning 요건</title>
  <desc id="d093-desc">Kafka Streams 의 조인 조합별로 윈도우 필요 여부, INNER · LEFT · OUTER 지원 여부,
    co-partitioning 필요 여부를 정리한 표입니다.
    KStream-KStream 조인은 윈도우가 필수이며 INNER, LEFT, OUTER 를 모두 지원하고 co-partitioning 이 필요합니다.
    KStream-KTable 조인은 윈도우가 없고 INNER 와 LEFT 만 지원하며 co-partitioning 이 필요합니다.
    KStream-GlobalKTable 조인은 윈도우가 없고 INNER 와 LEFT 만 지원하며 co-partitioning 이 필요하지 않습니다.
    KTable-KTable 조인은 윈도우가 없고 INNER, LEFT, OUTER 를 모두 지원하며 co-partitioning 이 필요합니다.
    KTable-KTable 외래키 조인은 윈도우가 없고 INNER 와 LEFT 만 지원하며 co-partitioning 이 필요하지 않습니다.
    co-partitioning 의 요건은 세 가지입니다.
    첫째 양쪽이 같은 키로 파티셔닝되어 있어야 합니다.
    둘째 양쪽 입력 토픽의 파티션 수가 같아야 합니다.
    셋째 그 토픽에 쓰는 모든 애플리케이션의 파티셔너가 같아야 합니다.
    Kafka Streams 는 이 중 파티션 수만 실행 중에 검증하며 다르면 예외를 던집니다.
    파티셔너가 같은지는 검증할 수 없으므로 사용자가 보장해야 합니다.
    GlobalKTable 조인은 모든 인스턴스가 전체 데이터를 가지고 있어서, 외래키 조인은 Streams 가 내부적으로
    co-partitioning 을 맞춰 주기 때문에 요건이 면제됩니다.</desc>

  <text x="12" y="18" class="dg-fs-md dg-bold">조인 매트릭스 — 윈도우가 필요한 조인은 하나뿐입니다</text>

  <!-- 헤더 -->
  <rect class="dg-node dg-node--alt" x="12" y="30" width="696" height="26" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="20" y="48">조인 조합</text>
  <text class="dg-fs-sm dg-bold" x="208" y="48">윈도우</text>
  <text class="dg-fs-sm dg-bold" x="336" y="48" text-anchor="middle">INNER</text>
  <text class="dg-fs-sm dg-bold" x="408" y="48" text-anchor="middle">LEFT</text>
  <text class="dg-fs-sm dg-bold" x="480" y="48" text-anchor="middle">OUTER</text>
  <text class="dg-fs-sm dg-bold" x="524" y="48">co-partitioning</text>

  <!-- 그리드 -->
  <line class="dg-grid" x1="12" y1="56" x2="708" y2="56"/>
  <line class="dg-grid" x1="12" y1="86" x2="708" y2="86"/>
  <line class="dg-grid" x1="12" y1="116" x2="708" y2="116"/>
  <line class="dg-grid" x1="12" y1="146" x2="708" y2="146"/>
  <line class="dg-grid" x1="12" y1="176" x2="708" y2="176"/>
  <line class="dg-grid" x1="12" y1="206" x2="708" y2="206"/>
  <line class="dg-grid" x1="200" y1="30" x2="200" y2="206"/>
  <line class="dg-grid" x1="300" y1="30" x2="300" y2="206"/>
  <line class="dg-grid" x1="372" y1="30" x2="372" y2="206"/>
  <line class="dg-grid" x1="444" y1="30" x2="444" y2="206"/>
  <line class="dg-grid" x1="516" y1="30" x2="516" y2="206"/>

  <!-- 1행: KStream-KStream (윈도우 필수 · 강조) -->
  <g data-dg="row-ks-ks">
    <text class="dg-fs-sm dg-bold" x="20" y="75">KStream - KStream</text>
    <rect class="dg-node dg-node--accent" x="206" y="61" width="88" height="20" rx="3"/>
    <text class="dg-fs-sm dg-bold" x="250" y="75" text-anchor="middle">필수</text>
    <text class="dg-fs-sm dg-bold" x="336" y="75" text-anchor="middle">지원</text>
    <text class="dg-fs-sm dg-bold" x="408" y="75" text-anchor="middle">지원</text>
    <text class="dg-fs-sm dg-bold" x="480" y="75" text-anchor="middle">지원</text>
    <rect class="dg-node dg-node--warn" x="522" y="61" width="72" height="20" rx="3"/>
    <text class="dg-fs-sm dg-bold" x="558" y="75" text-anchor="middle">필요</text>
  </g>

  <!-- 2행: KStream-KTable -->
  <g data-dg="row-ks-kt">
    <text class="dg-fs-sm dg-bold" x="20" y="105">KStream - KTable</text>
    <text class="dg-fs-sm" x="250" y="105" text-anchor="middle">없음</text>
    <text class="dg-fs-sm dg-bold" x="336" y="105" text-anchor="middle">지원</text>
    <text class="dg-fs-sm dg-bold" x="408" y="105" text-anchor="middle">지원</text>
    <text class="dg-fs-sm dg-muted" x="480" y="105" text-anchor="middle">불가</text>
    <rect class="dg-node dg-node--warn" x="522" y="91" width="72" height="20" rx="3"/>
    <text class="dg-fs-sm dg-bold" x="558" y="105" text-anchor="middle">필요</text>
  </g>

  <!-- 3행: KStream-GlobalKTable -->
  <g data-dg="row-ks-gkt">
    <text class="dg-fs-sm dg-bold" x="20" y="135">KStream - GlobalKTable</text>
    <text class="dg-fs-sm" x="250" y="135" text-anchor="middle">없음</text>
    <text class="dg-fs-sm dg-bold" x="336" y="135" text-anchor="middle">지원</text>
    <text class="dg-fs-sm dg-bold" x="408" y="135" text-anchor="middle">지원</text>
    <text class="dg-fs-sm dg-muted" x="480" y="135" text-anchor="middle">불가</text>
    <rect class="dg-node dg-node--ok" x="522" y="121" width="72" height="20" rx="3"/>
    <text class="dg-fs-sm dg-bold" x="558" y="135" text-anchor="middle">불필요</text>
  </g>

  <!-- 4행: KTable-KTable -->
  <g data-dg="row-kt-kt">
    <text class="dg-fs-sm dg-bold" x="20" y="165">KTable - KTable</text>
    <text class="dg-fs-sm" x="250" y="165" text-anchor="middle">없음</text>
    <text class="dg-fs-sm dg-bold" x="336" y="165" text-anchor="middle">지원</text>
    <text class="dg-fs-sm dg-bold" x="408" y="165" text-anchor="middle">지원</text>
    <text class="dg-fs-sm dg-bold" x="480" y="165" text-anchor="middle">지원</text>
    <rect class="dg-node dg-node--warn" x="522" y="151" width="72" height="20" rx="3"/>
    <text class="dg-fs-sm dg-bold" x="558" y="165" text-anchor="middle">필요</text>
  </g>

  <!-- 5행: KTable-KTable 외래키 -->
  <g data-dg="row-kt-kt-fk">
    <text class="dg-fs-sm dg-bold" x="20" y="195">KTable - KTable (외래키)</text>
    <text class="dg-fs-sm" x="250" y="195" text-anchor="middle">없음</text>
    <text class="dg-fs-sm dg-bold" x="336" y="195" text-anchor="middle">지원</text>
    <text class="dg-fs-sm dg-bold" x="408" y="195" text-anchor="middle">지원</text>
    <text class="dg-fs-sm dg-muted" x="480" y="195" text-anchor="middle">불가</text>
    <rect class="dg-node dg-node--ok" x="522" y="181" width="72" height="20" rx="3"/>
    <text class="dg-fs-sm dg-bold" x="558" y="195" text-anchor="middle">불필요</text>
  </g>

  <!-- co-partitioning 3요건 -->
  <rect class="dg-node dg-node--accent" x="12" y="218" width="696" height="86" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="22" y="236">co-partitioning 3요건 — 하나라도 어긋나면 같은 키가 다른 태스크로 갈라집니다</text>
  <circle class="dg-node" cx="32" cy="254" r="10"/>
  <text class="dg-fs-sm dg-bold dg-num" x="32" y="259" text-anchor="middle">1</text>
  <text class="dg-fs-sm" x="50" y="259"><tspan class="dg-bold">키 동일</tspan> — 양쪽이 같은 키로 파티셔닝되어 있어야 합니다.</text>
  <circle class="dg-node" cx="32" cy="276" r="10"/>
  <text class="dg-fs-sm dg-bold dg-num" x="32" y="281" text-anchor="middle">2</text>
  <text class="dg-fs-sm" x="50" y="281"><tspan class="dg-bold">파티션 수 동일</tspan> — 다르면 실행 중 예외가 발생합니다 (Streams 가 검증하는 유일한 항목).</text>
  <circle class="dg-node" cx="32" cy="298" r="10"/>
  <text class="dg-fs-sm dg-bold dg-num" x="32" y="303" text-anchor="middle">3</text>
  <text class="dg-fs-sm" x="50" y="303"><tspan class="dg-bold">파티셔너 동일</tspan> — 쓰는 쪽 파티셔너가 같아야 합니다. <tspan class="dg-bold">Streams 는 이것을 검증할 수 없습니다.</tspan></text>

  <!-- 예외 -->
  <rect class="dg-node dg-node--ok" x="12" y="314" width="696" height="70" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="22" y="332">co-partitioning 이 면제되는 두 경우</text>
  <text class="dg-fs-sm" x="22" y="350">GlobalKTable 조인 — 모든 인스턴스가 <tspan class="dg-bold">전체 파티션을 다 가지고</tspan> 있습니다.</text>
  <text class="dg-fs-sm" x="22" y="368">KTable 외래키 조인 — Streams 가 내부에서 co-partitioning 을 맞춰 줍니다.</text>

  <text class="dg-fs-sm dg-muted" x="12" y="404">파티션 수가 다르면 <tspan class="dg-bold">작은 쪽을 큰 쪽에 맞춰 리파티션</tspan>하는 것이 권장됩니다.</text>
  <text class="dg-fs-sm dg-muted" x="12" y="422">스트림-테이블 조인이면 KStream 쪽을, 테이블-테이블이면 작은 KTable 쪽을 리파티션하세요.</text>
</svg>
