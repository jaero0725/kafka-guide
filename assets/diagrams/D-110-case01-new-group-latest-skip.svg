<svg viewBox="0 0 720 546" role="img" class="kg-diagram"
     aria-labelledby="d110-title d110-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d110-title">case01 — 새 group.id 와 auto.offset.reset=latest 가 겹쳐 과거 데이터를 건너뛰는 흐름</title>
  <desc id="d110-desc">세 단계로 나눈 장애 시퀀스입니다. 정상 흐름에서는 토픽 orders 에 오프셋 0부터 999까지 1000건이 쌓여 있고 기존 그룹이 오프셋 1000까지 커밋해 두었으며 auto.offset.reset 은 커밋된 오프셋이 없을 때에만 쓰이는 규칙입니다. 어긋나는 지점에서는 배포하면서 group.id 를 새 값으로 바꾸는데 새 그룹에는 커밋된 오프셋이 없고 auto.offset.reset 기본값이 latest 이므로 시작 위치가 로그 끝인 1000으로 잡힙니다. 결과적으로 오프셋 0부터 999까지 1000건이 처리되지 않는데, 컨슈머는 정상 동작 중이고 lag 도 0으로 보이므로 알아채기 어렵습니다. 다만 데이터는 토픽에 남아 있으므로 유실이 아니라 읽지 않은 상태이며 오프셋을 되돌려 복구할 수 있습니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--ok" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--warn" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<rect class="dg-node dg-node--ok" x="8" y="8" width="704" height="122" rx="4"/>
<text class="dg-fs-md dg-bold" x="22" y="29">1. 정상 흐름</text>
<text class="dg-fs-sm dg-muted" x="698" y="29" text-anchor="end">auto.offset.reset 은 예외 상황용 규칙입니다</text>
<g>
<rect class="dg-node" x="24" y="38" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="98.2" y="58.5" text-anchor="middle">프로듀서</text>
</g>
<path class="dg-edge" d="M175.5,54 L194.5,54" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node" x="198.5" y="38" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="272.8" y="58.5" text-anchor="middle">orders 오프셋 0~999</text>
</g>
<path class="dg-edge" d="M350,54 L369,54" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--ok" x="373" y="38" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="447.2" y="58.5" text-anchor="middle">그룹 billing-v1</text>
</g>
<path class="dg-edge" d="M524.5,54 L543.5,54" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--ok" x="547.5" y="38" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="621.8" y="58.5" text-anchor="middle">커밋 1000 · lag 0</text>
</g>
<text class="dg-fs-sm" x="24" y="98">auto.offset.reset 은 그룹에 커밋된 오프셋이 없을 때, 또는 커밋된 오프셋이 로그 범위를 벗어났을 때만 적용됩니다.</text>
<text class="dg-fs-sm" x="24" y="116">평소에는 __consumer_offsets 에 저장된 커밋 오프셋에서 이어 읽으므로 이 설정이 동작에 끼어들지 않습니다.</text>
<rect class="dg-node dg-node--danger" x="8" y="152" width="704" height="122" rx="4"/>
<text class="dg-fs-md dg-bold" x="22" y="173">2. 어긋나는 지점</text>
<text class="dg-fs-sm dg-muted" x="698" y="173" text-anchor="end">배포에서 group.id 를 바꿨습니다</text>
<g>
<rect class="dg-node dg-node--warn" x="24" y="182" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="98.2" y="202.6" text-anchor="middle">group.id=billing-v2</text>
</g>
<path class="dg-edge" d="M175.5,198 L194.5,198" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--danger" x="198.5" y="182" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="272.8" y="202.6" text-anchor="middle">커밋 오프셋 없음</text>
</g>
<path class="dg-edge dg-edge--danger" d="M350,198 L369,198" marker-end="url(#mk-arrow-danger)"/>
<g>
<rect class="dg-node dg-node--danger" x="373" y="182" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="447.2" y="202.6" text-anchor="middle">reset=latest 적용</text>
</g>
<path class="dg-edge dg-edge--danger" d="M524.5,198 L543.5,198" marker-end="url(#mk-arrow-danger)"/>
<g>
<rect class="dg-node dg-node--danger" x="547.5" y="182" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="621.8" y="202.6" text-anchor="middle">시작 오프셋 1000</text>
</g>
<text class="dg-fs-sm" x="24" y="242">group.id 를 바꾸면 완전히 새 그룹입니다 — 이전 그룹의 커밋 오프셋을 물려받지 않습니다.</text>
<text class="dg-fs-sm" x="24" y="260">auto.offset.reset 기본값은 latest 이므로 시작 위치가 로그의 끝으로 정해집니다.</text>
<rect class="dg-node dg-node--warn" x="8" y="296" width="704" height="122" rx="4"/>
<text class="dg-fs-md dg-bold" x="22" y="317">3. 결과</text>
<text class="dg-fs-sm dg-muted" x="698" y="317" text-anchor="end">조용히 지나가는 사고</text>
<g>
<rect class="dg-node dg-node--danger" x="24" y="326" width="206.7" height="32" rx="4"/>
<text class="dg-fs-sm" x="127.3" y="346.6" text-anchor="middle">0~999 미처리</text>
</g>
<path class="dg-edge dg-edge--danger" d="M233.7,342 L252.7,342" marker-end="url(#mk-arrow-danger)"/>
<g>
<rect class="dg-node dg-node--warn" x="256.7" y="326" width="206.7" height="32" rx="4"/>
<text class="dg-fs-sm" x="360" y="346.6" text-anchor="middle">lag 0 으로 표시</text>
</g>
<path class="dg-edge" d="M466.3,342 L485.3,342" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--danger" x="489.3" y="326" width="206.7" height="32" rx="4"/>
<text class="dg-fs-sm" x="592.7" y="346.6" text-anchor="middle">지표상 정상으로 보임</text>
</g>
<text class="dg-fs-sm" x="24" y="386">컨슈머는 예외 없이 잘 돌고 lag 도 0 이라 모니터링에 아무 신호가 없습니다.</text>
<text class="dg-fs-sm" x="24" y="404">데이터 자체는 토픽에 남아 있으므로 유실이 아니라 "읽지 않은 것"이며 되돌릴 수 있습니다.</text>
<path class="dg-edge dg-edge--danger" d="M360,132 L360,149" marker-end="url(#mk-arrow-danger)"/>
<path class="dg-edge dg-edge--danger" d="M360,276 L360,293" marker-end="url(#mk-arrow-danger)"/>
<rect class="dg-node dg-node--ok" x="8" y="440" width="704" height="98" rx="4"/>
<text class="dg-fs-sm dg-bold" x="22" y="461">처방</text>
<text class="dg-fs-sm" x="70" y="461">새 그룹으로 과거 데이터를 처리해야 하면 auto.offset.reset=earliest 로 둡니다.</text>
<text class="dg-fs-sm" x="70" y="479">이미 지나간 경우: kafka-consumer-groups.sh --group billing-v2 --topic orders</text>
<text class="dg-fs-sm" x="70" y="497">                 --reset-offsets --to-earliest --execute</text>
<text class="dg-fs-sm" x="70" y="515">group.id 변경을 배포 체크리스트에 넣고, 변경 시 시작 위치를 함께 결정합니다.</text>
</svg>
