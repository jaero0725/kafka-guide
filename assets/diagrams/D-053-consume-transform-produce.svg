<svg viewBox="0 0 720 330" role="img" class="kg-diagram"
     aria-labelledby="d053-title d053-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d053-title">consume-transform-produce — 오프셋 커밋이 트랜잭션 안에 들어갑니다</title>
  <desc id="d053-desc">입력 토픽에서 읽어 변환한 뒤 출력 토픽으로 쓰는 패턴을 그린 그림입니다.
    KafkaConsumer 는 isolation.level=read_committed, enable.auto.commit=false 로 설정합니다.
    변환 결과를 트랜잭션 프로듀서로 출력 토픽에 쓰고, 같은 트랜잭션 안에서
    sendOffsetsToTransaction 으로 컨슈머의 오프셋을 __consumer_offsets 에 씁니다.
    점선으로 표시한 트랜잭션 경계 안에 출력 레코드와 오프셋 커밋이 함께 들어 있는 것이 핵심입니다.
    그래서 커밋하면 둘 다 반영되고, abort 하면 둘 다 무효가 되어 같은 레코드를 다시 처리합니다.
    컨슈머의 commitSync 나 commitAsync 를 따로 호출하면 원자성이 깨지므로 호출하지 않습니다.</desc>

  <text x="12" y="18" class="dg-fs-md dg-bold">consume-transform-produce — 출력과 오프셋을 한 트랜잭션으로 묶습니다</text>

  <!-- 트랜잭션 경계 -->
  <text x="404" y="42" class="dg-fs-sm dg-bold">하나의 트랜잭션 (원자적)</text>
  <rect class="dg-panel" x="404" y="46" width="304" height="154" rx="6"/>

  <!-- 입력 토픽 -->
  <rect class="dg-node dg-node--alt" x="12" y="58" width="92" height="52" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="58" y="80" text-anchor="middle">입력 토픽</text>
  <text class="dg-fs-sm dg-mono dg-muted" x="58" y="97" text-anchor="middle">orders</text>

  <line class="dg-edge" x1="104" y1="84" x2="121" y2="84"/>
  <path class="dg-marker" d="M120,79 L128,84 L120,89 Z"/>

  <!-- 컨슈머 -->
  <rect class="dg-node" x="128" y="58" width="140" height="52" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="138" y="76">KafkaConsumer</text>
  <text class="dg-fs-sm dg-mono" x="138" y="92">read_committed</text>
  <text class="dg-fs-sm dg-mono" x="138" y="106">auto.commit=false</text>

  <line class="dg-edge" x1="268" y1="84" x2="285" y2="84"/>
  <path class="dg-marker" d="M284,79 L292,84 L284,89 Z"/>

  <!-- 처리 -->
  <rect class="dg-node" x="292" y="58" width="92" height="52" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="338" y="80" text-anchor="middle">변환 처리</text>
  <text class="dg-fs-sm dg-muted" x="338" y="97" text-anchor="middle">transform</text>

  <line class="dg-edge dg-edge--accent" x1="384" y1="84" x2="407" y2="84"/>
  <path class="dg-marker--accent" d="M406,79 L414,84 L406,89 Z"/>

  <!-- 트랜잭션 프로듀서 -->
  <rect class="dg-node dg-node--accent" x="414" y="58" width="140" height="52" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="424" y="76">트랜잭션 프로듀서</text>
  <text class="dg-fs-sm dg-mono" x="424" y="92">transactional.id</text>
  <text class="dg-fs-sm dg-muted" x="424" y="106">컨슈머 1:1 로 두기</text>

  <line class="dg-edge dg-edge--accent" x1="554" y1="84" x2="577" y2="84"/>
  <path class="dg-marker--accent" d="M576,79 L584,84 L576,89 Z"/>

  <!-- 출력 토픽 -->
  <rect class="dg-node dg-node--accent" x="584" y="58" width="114" height="52" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="641" y="80" text-anchor="middle">출력 토픽</text>
  <text class="dg-fs-sm dg-mono dg-muted" x="641" y="97" text-anchor="middle">orders-enriched</text>

  <!-- 오프셋 분기 -->
  <line class="dg-edge dg-edge--accent" x1="484" y1="110" x2="484" y2="158"/>
  <line class="dg-edge dg-edge--accent" x1="484" y1="158" x2="577" y2="158"/>
  <path class="dg-marker--accent" d="M576,153 L584,158 L576,163 Z"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="414" y="132">sendOffsets</text>
  <text class="dg-fs-sm dg-mono dg-bold" x="414" y="148">ToTransaction()</text>

  <rect class="dg-node dg-node--accent" x="584" y="132" width="114" height="52" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="641" y="154" text-anchor="middle">__consumer</text>
  <text class="dg-fs-sm dg-mono dg-bold" x="641" y="170" text-anchor="middle">_offsets</text>

  <!-- 하단 대비: 해야 할 것 / 하면 안 되는 것 -->
  <rect class="dg-node dg-node--ok" x="12" y="212" width="340" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="22" y="230">커밋하면</text>
  <text class="dg-fs-sm" x="22" y="248">출력 레코드와 오프셋이 <tspan class="dg-bold">동시에</tspan> 확정됩니다.</text>
  <text class="dg-fs-sm" x="22" y="265">abort 하면 <tspan class="dg-bold">둘 다 무효</tspan> → 같은 구간을 재처리.</text>

  <rect class="dg-node dg-node--danger" x="368" y="212" width="340" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="378" y="230">하지 말 것</text>
  <text class="dg-fs-sm dg-mono" x="378" y="248">consumer.commitSync()</text>
  <text class="dg-fs-sm" x="378" y="265">따로 커밋하면 원자성이 깨집니다.</text>
  <g data-dg="x-mark">
    <line class="dg-x" x1="676" y1="238" x2="694" y2="256"/>
    <line class="dg-x" x1="694" y1="238" x2="676" y2="256"/>
  </g>

  <!-- 각주 -->
  <line class="dg-grid" x1="12" y1="284" x2="708" y2="284"/>
  <text class="dg-fs-sm" x="12" y="302">오프셋은 프로듀서가 <tspan class="dg-bold">컨슈머 그룹을 대신해</tspan> 씁니다 — 그래서 <tspan class="dg-mono">consumer.groupMetadata()</tspan> 를 함께 넘깁니다.</text>
  <text class="dg-fs-sm dg-muted" x="12" y="322">abort 후에는 오프셋을 자동으로 되감지 않습니다. 애플리케이션이 커밋된 오프셋을 다시 읽어 위치를 되돌려야 합니다.</text>
</svg>
