<svg viewBox="0 0 720 400" role="img" class="kg-diagram"
     aria-labelledby="d031-title d031-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d031-title">배치와 linger.ms — batch.size 도달과 linger.ms 만료 중 먼저 오는 쪽에 전송</title>
  <desc id="d031-desc">두 시나리오를 같은 12밀리초 시간축 위에 놓고 비교합니다.
    각 시나리오에는 두 개의 막대가 있습니다. 위 막대는 batch.size 16384 바이트가 채워지기까지 걸리는 시간,
    아래 막대는 linger.ms 5 밀리초 타이머가 만료되기까지 걸리는 시간입니다. 막대가 더 짧은 쪽, 즉 먼저 끝나는 조건이 전송을 유발합니다.
    시나리오 1은 트래픽이 많아 3 밀리초에 batch.size 가 먼저 채워지므로 linger 타이머가 만료되기 전에 전송되고 배치가 꽉 찹니다.
    시나리오 2는 트래픽이 적어 12 밀리초 동안 4200 바이트밖에 모이지 않으므로 5 밀리초에 linger.ms 만료가 먼저 와서
    부분만 찬 배치가 전송됩니다. linger.ms 기본값은 Kafka 4.0부터 0 이 아니라 5 입니다.</desc>

  <defs>
    <marker id="d031-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker--muted" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
  </defs>

  <text x="8" y="20" class="dg-fs-md dg-bold">전송을 유발하는 조건은 2개 — <tspan class="dg-mono">batch.size=16384</tspan> 도달, <tspan class="dg-mono">linger.ms=5</tspan> 만료. 막대가 짧은 쪽이 이깁니다.</text>

  <!-- ================= 시나리오 1 ================= -->
  <text x="8" y="48" class="dg-fs-sm dg-bold">① 트래픽 많음 — <tspan class="dg-mono">batch.size</tspan> 가 먼저 도달 (3ms)</text>

  <text x="8" y="72" class="dg-fs-sm dg-bold">batch.size</text>
  <text x="8" y="88" class="dg-fs-sm dg-muted">16384 B</text>
  <rect class="dg-node--empty" x="110" y="58" width="580" height="26" rx="3"/>
  <rect class="dg-node dg-node--accent" x="110" y="58" width="145" height="26" rx="3"/>
  <text x="120" y="76" class="dg-fs-sm dg-bold">16384 B 도달 → 전송</text>

  <text x="8" y="106" class="dg-fs-sm dg-bold">linger.ms</text>
  <text x="8" y="122" class="dg-fs-sm dg-muted">5 ms</text>
  <rect class="dg-node--empty" x="110" y="92" width="580" height="26" rx="3"/>
  <rect class="dg-node dg-node--muted" x="110" y="92" width="242" height="26" rx="3"/>
  <text x="120" y="110" class="dg-fs-sm dg-muted">타이머 5ms — 도달 전에 리셋됨</text>

  <!-- 승자 표시 -->
  <line class="dg-edge dg-edge--accent" x1="255" y1="54" x2="255" y2="130" />
  <text x="262" y="146" class="dg-fs-sm dg-bold">3ms 에 전송 · 배치가 꽉 찼습니다</text>

  <!-- 시간축 -->
  <line class="dg-grid" x1="110" y1="130" x2="690" y2="130"/>
  <line class="dg-grid" x1="110" y1="126" x2="110" y2="134"/>
  <line class="dg-grid" x1="207" y1="126" x2="207" y2="134"/>
  <line class="dg-grid" x1="303" y1="126" x2="303" y2="134"/>
  <line class="dg-grid" x1="400" y1="126" x2="400" y2="134"/>
  <line class="dg-grid" x1="497" y1="126" x2="497" y2="134"/>
  <line class="dg-grid" x1="593" y1="126" x2="593" y2="134"/>
  <line class="dg-grid" x1="690" y1="126" x2="690" y2="134"/>
  <text x="110" y="146" class="dg-fs-sm dg-muted dg-num" text-anchor="middle">0</text>
  <text x="207" y="146" class="dg-fs-sm dg-muted dg-num" text-anchor="middle">2</text>

  <!-- ================= 시나리오 2 ================= -->
  <text x="8" y="196" class="dg-fs-sm dg-bold">② 트래픽 적음 — <tspan class="dg-mono">linger.ms</tspan> 만료가 먼저 도달 (5ms)</text>

  <text x="8" y="220" class="dg-fs-sm dg-bold">batch.size</text>
  <text x="8" y="236" class="dg-fs-sm dg-muted">16384 B</text>
  <rect class="dg-node--empty" x="110" y="206" width="580" height="26" rx="3"/>
  <rect class="dg-node dg-node--muted" x="110" y="206" width="556" height="26" rx="3"/>
  <text x="120" y="224" class="dg-fs-sm dg-muted">12ms 동안 4,200 B — 16384 미달, 계속 기다려야 함</text>
  <line class="dg-edge dg-edge--muted dg-edge--dashed" x1="666" y1="219" x2="700" y2="219" marker-end="url(#d031-ah)"/>

  <text x="8" y="254" class="dg-fs-sm dg-bold">linger.ms</text>
  <text x="8" y="270" class="dg-fs-sm dg-muted">5 ms</text>
  <rect class="dg-node--empty" x="110" y="240" width="580" height="26" rx="3"/>
  <rect class="dg-node dg-node--accent" x="110" y="240" width="242" height="26" rx="3"/>
  <text x="120" y="258" class="dg-fs-sm dg-bold">5ms 만료 → 전송</text>

  <line class="dg-edge dg-edge--accent" x1="352" y1="202" x2="352" y2="278"/>
  <text x="359" y="294" class="dg-fs-sm dg-bold">5ms 에 전송 · 배치는 4,200 B 뿐</text>

  <line class="dg-grid" x1="110" y1="278" x2="690" y2="278"/>
  <line class="dg-grid" x1="110" y1="274" x2="110" y2="282"/>
  <line class="dg-grid" x1="207" y1="274" x2="207" y2="282"/>
  <line class="dg-grid" x1="303" y1="274" x2="303" y2="282"/>
  <line class="dg-grid" x1="400" y1="274" x2="400" y2="282"/>
  <line class="dg-grid" x1="497" y1="274" x2="497" y2="282"/>
  <line class="dg-grid" x1="593" y1="274" x2="593" y2="282"/>
  <line class="dg-grid" x1="690" y1="274" x2="690" y2="282"/>
  <text x="110" y="294" class="dg-fs-sm dg-muted dg-num" text-anchor="middle">0</text>
  <text x="207" y="294" class="dg-fs-sm dg-muted dg-num" text-anchor="middle">2</text>
  <text x="690" y="294" class="dg-fs-sm dg-muted" text-anchor="end">경과 시간 (ms)</text>

  <!-- ================= 정리 ================= -->
  <line class="dg-grid" x1="8" y1="316" x2="712" y2="316"/>
  <text x="8" y="336" class="dg-fs-sm"><tspan class="dg-bold"><tspan class="dg-mono">linger.ms</tspan> 기본값은 5 입니다.</tspan> Kafka 4.0에서 <tspan class="dg-mono">0</tspan> → <tspan class="dg-mono">5</tspan> 로 바뀌었습니다. 3.x 기준 자료는 대부분 <tspan class="dg-mono">0</tspan> 으로 적혀 있습니다.</text>
  <text x="8" y="356" class="dg-fs-sm">①처럼 배치가 꽉 차면 처리량이 좋고, ②처럼 <tspan class="dg-mono">linger</tspan> 로 나가면 지연은 짧지만 요청 수가 늘어납니다.</text>
  <text x="8" y="376" class="dg-fs-sm dg-muted"><tspan class="dg-mono">batch.size</tspan> 는 파티션별 상한입니다. 이보다 큰 레코드는 배치로 묶지 않고 단독으로 보냅니다.</text>
  <text x="8" y="394" class="dg-fs-sm dg-muted">브로커 백프레셔가 걸리면 <tspan class="dg-mono">linger.ms</tspan> 설정값보다 실제 대기 시간이 길어질 수 있습니다.</text>
</svg>
