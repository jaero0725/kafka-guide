<svg viewBox="0 0 720 368" role="img" class="kg-diagram"
     aria-labelledby="d083-title d083-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d083-title">Connect DLQ 흐름 — errors.tolerance 와 dead letter queue</title>
  <desc id="d083-desc">싱크 커넥터의 처리 경로와 오류 처리 분기를 그린 그림입니다.
    경로는 Kafka 소스 토픽, converter, SMT 체인, SinkTask, 외부 시스템 순서입니다.
    converter, SMT, SinkTask 세 단계 어디서든 오류가 날 수 있습니다.
    오류가 나면 errors.tolerance 설정에 따라 갈립니다.
    기본값 none 이면 첫 오류에서 태스크가 FAILED 상태로 멈추고 REST API 로 restart 해야 다시 돕니다.
    all 로 두면 오류 레코드를 건너뛰고 계속 처리합니다.
    이때 errors.log.enable 을 true 로 하면 로그에 남고,
    errors.deadletterqueue.topic.name 을 지정하면 문제 레코드가 그 DLQ 토픽으로 전송됩니다.
    errors.deadletterqueue.context.headers.enable 을 true 로 하면 실패 원인이 헤더로 함께 들어갑니다.
    헤더 이름은 모두 __connect.errors. 로 시작하며
    topic, partition, offset, connector.name, task.id, stage, class.name,
    exception.class.name, exception.message, exception.stacktrace 가 있습니다.
    DLQ 설정은 싱크 커넥터에만 있습니다. 소스 커넥터에는 DLQ 설정이 없습니다.</desc>

  <text x="12" y="18" class="dg-fs-md dg-bold">DLQ 흐름 — 기본값은 “멈춤”입니다</text>

  <!-- 파이프라인 -->
  <rect class="dg-node dg-node--alt" x="12" y="40" width="132" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="78" y="67" text-anchor="middle">Kafka 소스 토픽</text>
  <line class="dg-edge" x1="144" y1="62" x2="150" y2="62"/>
  <path class="dg-marker" d="M149,57 L157,62 L149,67 Z"/>

  <rect class="dg-node" x="153" y="40" width="132" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="219" y="60" text-anchor="middle">Converter</text>
  <text class="dg-fs-sm dg-muted" x="219" y="76" text-anchor="middle">바이트 → Struct</text>
  <line class="dg-edge" x1="285" y1="62" x2="291" y2="62"/>
  <path class="dg-marker" d="M290,57 L298,62 L290,67 Z"/>

  <rect class="dg-node" x="294" y="40" width="132" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="360" y="60" text-anchor="middle">SMT 체인</text>
  <text class="dg-fs-sm dg-muted" x="360" y="76" text-anchor="middle">transforms</text>
  <line class="dg-edge" x1="426" y1="62" x2="432" y2="62"/>
  <path class="dg-marker" d="M431,57 L439,62 L431,67 Z"/>

  <rect class="dg-node" x="435" y="40" width="132" height="44" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="501" y="60" text-anchor="middle">SinkTask</text>
  <text class="dg-fs-sm dg-muted" x="501" y="76" text-anchor="middle">put()</text>
  <line class="dg-edge" x1="567" y1="62" x2="573" y2="62"/>
  <path class="dg-marker" d="M572,57 L580,62 L572,67 Z"/>

  <rect class="dg-node dg-node--alt" x="576" y="40" width="132" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="642" y="67" text-anchor="middle">외부 시스템</text>

  <!-- 오류 발생 지점 -->
  <line class="dg-edge dg-edge--danger" x1="219" y1="84" x2="219" y2="94"/>
  <line class="dg-edge dg-edge--danger" x1="360" y1="84" x2="360" y2="94"/>
  <line class="dg-edge dg-edge--danger" x1="501" y1="84" x2="501" y2="94"/>
  <line class="dg-edge dg-edge--danger dg-edge--dashed" x1="219" y1="94" x2="501" y2="94"/>
  <text class="dg-fs-sm dg-bold" x="516" y="98">← 이 세 단계에서 오류 발생</text>
  <line class="dg-edge dg-edge--danger" x1="360" y1="94" x2="360" y2="101"/>
  <path class="dg-marker--danger" d="M355,101 L365,101 L360,109 Z"/>

  <!-- 분기 -->
  <rect class="dg-node dg-node--warn" x="270" y="110" width="180" height="28" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="360" y="129" text-anchor="middle">errors.tolerance ?</text>

  <line class="dg-edge dg-edge--danger" x1="300" y1="138" x2="180" y2="148"/>
  <path class="dg-marker--danger" d="M186,144 L176,150 L184,153 Z"/>
  <line class="dg-edge dg-edge--ok" x1="420" y1="138" x2="540" y2="148"/>
  <path class="dg-marker--ok" d="M534,144 L544,150 L536,153 Z"/>

  <!-- none -->
  <rect class="dg-node dg-node--danger" x="12" y="150" width="336" height="72" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="22" y="168">errors.tolerance = none</text>
  <text class="dg-fs-sm dg-bold" x="242" y="168">기본값</text>
  <text class="dg-fs-sm" x="22" y="186">첫 오류에서 태스크가 <tspan class="dg-bold">FAILED</tspan> 로 멈춥니다.</text>
  <text class="dg-fs-sm" x="22" y="203">Connect 는 실패한 태스크를 자동 재시작하지 않습니다.</text>
  <text class="dg-fs-sm dg-mono dg-muted" x="22" y="219">POST /connectors/{name}/tasks/{id}/restart</text>

  <!-- all -->
  <rect class="dg-node dg-node--ok" x="372" y="150" width="336" height="72" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="382" y="168">errors.tolerance = all</text>
  <text class="dg-fs-sm" x="382" y="186">오류 레코드를 <tspan class="dg-bold">건너뛰고</tspan> 계속 처리합니다.</text>
  <text class="dg-fs-sm dg-mono" x="382" y="203">errors.log.enable=true</text>
  <text class="dg-fs-sm dg-muted" x="574" y="203">→ 로그에 기록</text>
  <text class="dg-fs-sm dg-mono dg-bold" x="382" y="219">errors.deadletterqueue.topic.name</text>

  <line class="dg-edge dg-edge--ok" x1="540" y1="222" x2="540" y2="229"/>
  <path class="dg-marker--ok" d="M535,229 L545,229 L540,237 Z"/>

  <!-- DLQ 토픽 -->
  <rect class="dg-node dg-node--accent" x="12" y="238" width="696" height="90" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="22" y="256">DLQ 토픽 — 원본 레코드 그대로 + 실패 원인 헤더 (<tspan class="dg-mono">errors.deadletterqueue.context.headers.enable=true</tspan>)</text>
  <text class="dg-fs-sm dg-mono" x="22" y="276">__connect.errors.topic</text>
  <text class="dg-fs-sm dg-mono" x="192" y="276">.partition</text>
  <text class="dg-fs-sm dg-mono" x="362" y="276">.offset</text>
  <text class="dg-fs-sm dg-mono" x="532" y="276">.connector.name</text>
  <text class="dg-fs-sm dg-mono" x="22" y="293">.task.id</text>
  <text class="dg-fs-sm dg-mono" x="192" y="293">.stage</text>
  <text class="dg-fs-sm dg-mono" x="362" y="293">.class.name</text>
  <text class="dg-fs-sm dg-mono" x="532" y="293">.exception.class.name</text>
  <text class="dg-fs-sm dg-mono" x="22" y="310">.exception.message</text>
  <text class="dg-fs-sm dg-mono" x="192" y="310">.exception.stacktrace</text>
  <text class="dg-fs-sm dg-muted" x="362" y="310">DLQ 토픽은 자동 생성됩니다 (<tspan class="dg-mono">replication.factor</tspan> 기본 3)</text>

  <!-- 각주 -->
  <line class="dg-grid" x1="12" y1="338" x2="708" y2="338"/>
  <text class="dg-fs-sm dg-bold" x="12" y="356">DLQ 설정은 <tspan class="dg-bold">싱크 커넥터에만</tspan> 있습니다. 소스 커넥터에는 <tspan class="dg-mono">errors.deadletterqueue.*</tspan> 가 없고 로그 기록만 가능합니다.</text>
</svg>
