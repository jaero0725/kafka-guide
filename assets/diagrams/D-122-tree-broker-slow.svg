<svg viewBox="0 0 720 840" role="img" class="kg-diagram"
     aria-labelledby="d122-title d122-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d122-title">트러블슈팅 결정 트리 — 브로커 성능이 저하될 때</title>
  <desc id="d122-desc">브로커 성능 저하를 메트릭에서 출발해 좁혀 가는 결정 트리입니다. RequestHandlerAvgIdlePercent 가 0.3 아래면 요청 처리 스레드가 부족하므로 num.io.threads 와 디스크 상태를 봅니다. NetworkProcessorAvgIdlePercent 가 낮으면 num.network.threads 를 검토합니다. UnderReplicatedPartitions 가 0 이 아니면 복제가 밀린 상태이므로 num.replica.fetchers 와 네트워크·디스크를 확인합니다. OfflinePartitionsCount 가 0 이 아니면 리더가 없는 파티션이 있어 읽기와 쓰기가 모두 막힙니다. ActiveControllerCount 의 클러스터 합이 1 이 아니면 컨트롤러 쿼럼 문제입니다. 로그 flush 지연이 크면 디스크가 병목이고, 리더가 한 브로커에 몰려 있으면 preferred 리더 선출로 균형을 되돌립니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--ok" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--warn" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<text class="dg-fs-md dg-bold" x="8" y="20">브로커가 느리다 · 응답이 밀린다</text>
<text class="dg-fs-sm dg-muted" x="8" y="40">추측하지 말고 메트릭부터 봅니다. 각 판단 아래가 확인할 지표입니다.</text>
<g>
<path class="dg-node dg-node--warn" d="M158,54 L308,96 L158,138 L8,96 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="92" text-anchor="middle">RequestHandlerAvgIdle < 0.3?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="110" text-anchor="middle">RequestHandlerPool</text>
<rect class="dg-node dg-node--danger" x="352" y="66" width="360" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="85">요청 처리 스레드 포화</text>
<text class="dg-fs-sm" x="364" y="103">· num.io.threads 를 올린다</text>
<text class="dg-fs-sm" x="364" y="121">· 디스크 지연이 원인이면 효과 없음</text>
<path class="dg-edge dg-edge--danger" d="M310,96 L348,96" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="90">예</text>
<path class="dg-edge" d="M158,139 L158,158" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="168" y="154">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M158,160 L308,202 L158,244 L8,202 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="198" text-anchor="middle">NetworkProcessorAvgIdle 낮음?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="216" text-anchor="middle">SocketServer 메트릭</text>
<rect class="dg-node dg-node--warn" x="352" y="172" width="360" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="191">네트워크 스레드 포화</text>
<text class="dg-fs-sm" x="364" y="209">· num.network.threads 검토</text>
<text class="dg-fs-sm" x="364" y="227">· 리스너마다 별도 풀이다</text>
<path class="dg-edge dg-edge--danger" d="M310,202 L348,202" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="196">예</text>
<path class="dg-edge" d="M158,245 L158,264" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="168" y="260">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M158,266 L308,308 L158,350 L8,308 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="304" text-anchor="middle">UnderReplicatedPartitions > 0?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="322" text-anchor="middle">--under-replicated</text>
<rect class="dg-node dg-node--danger" x="352" y="278" width="360" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="297">복제가 밀리는 중</text>
<text class="dg-fs-sm" x="364" y="315">· num.replica.fetchers · 대역폭 확인</text>
<text class="dg-fs-sm" x="364" y="333">· IsrShrinksPerSec 동반 상승 확인</text>
<path class="dg-edge dg-edge--danger" d="M310,308 L348,308" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="302">예</text>
<path class="dg-edge" d="M158,351 L158,370" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="168" y="366">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M158,372 L308,414 L158,456 L8,414 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="410" text-anchor="middle">OfflinePartitionsCount > 0?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="428" text-anchor="middle">KafkaController</text>
<rect class="dg-node dg-node--danger" x="352" y="384" width="360" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="403">리더 없는 파티션 — 최우선</text>
<text class="dg-fs-sm" x="364" y="421">· 읽기·쓰기가 모두 막힌다</text>
<text class="dg-fs-sm" x="364" y="439">· --unavailable-partitions 로 범위 확인</text>
<path class="dg-edge dg-edge--danger" d="M310,414 L348,414" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="408">예</text>
<path class="dg-edge" d="M158,457 L158,476" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="168" y="472">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M158,478 L308,520 L158,562 L8,520 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="516" text-anchor="middle">ActiveControllerCount 합 ≠ 1?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="534" text-anchor="middle">kafka-metadata-quorum</text>
<rect class="dg-node dg-node--danger" x="352" y="490" width="360" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="509">컨트롤러 쿼럼 이상</text>
<text class="dg-fs-sm" x="364" y="527">· 정확히 한 대만 1 이어야 한다</text>
<text class="dg-fs-sm" x="364" y="545">· describe --status 로 lag 확인</text>
<path class="dg-edge dg-edge--danger" d="M310,520 L348,520" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="514">예</text>
<path class="dg-edge" d="M158,563 L158,582" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="168" y="578">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M158,584 L308,626 L158,668 L8,626 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="622" text-anchor="middle">로그 flush 지연이 크다?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="640" text-anchor="middle">LogFlushRateAndTimeMs</text>
<rect class="dg-node dg-node--warn" x="352" y="596" width="360" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="615">디스크가 병목</text>
<text class="dg-fs-sm" x="364" y="633">· kafka-log-dirs.sh --describe</text>
<text class="dg-fs-sm" x="364" y="651">· 한 디스크에 로그 디렉터리 여러 개 금지</text>
<path class="dg-edge dg-edge--danger" d="M310,626 L348,626" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="620">예</text>
<path class="dg-edge" d="M158,669 L158,688" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="168" y="684">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M158,690 L308,732 L158,774 L8,732 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="158" y="728" text-anchor="middle">리더가 한 브로커에 몰렸다?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="158" y="746" text-anchor="middle">--describe Leader 열</text>
<rect class="dg-node dg-node--warn" x="352" y="693" width="360" height="78" rx="4"/>
<text class="dg-fs-sm dg-bold" x="364" y="712">리더 편중</text>
<text class="dg-fs-sm" x="364" y="730">· kafka-leader-election.sh</text>
<text class="dg-fs-sm" x="364" y="748">  --election-type preferred</text>
<text class="dg-fs-sm" x="364" y="766">· 재배치는 kafka-reassign-partitions.sh</text>
<path class="dg-edge dg-edge--danger" d="M310,732 L348,732" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="330" y="726">예</text>
<line class="dg-grid" x1="8" y1="784" x2="712" y2="784"/>
<text class="dg-fs-sm" x="8" y="804">정상 기준: URP 0 · UnderMinIsrPartitionCount 0 · OfflinePartitionsCount 0 · ActiveController 합 1.</text>
<text class="dg-fs-sm" x="8" y="822">RequestHandlerAvgIdlePercent 는 0~1 값이며 공식 문서는 0.3 이상을 권합니다.</text>
</svg>
