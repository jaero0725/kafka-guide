<svg viewBox="0 0 720 840" role="img" class="kg-diagram"
     aria-labelledby="d122-title d122-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d122-title">트러블슈팅 결정 트리 — 브로커 성능이 저하될 때</title>
  <desc id="d122-desc">브로커 성능 저하를 메트릭에서 출발해 좁혀 가는 결정 트리입니다. RequestHandlerAvgIdlePercent 가 0.3 아래면 요청 처리 스레드가 부족하므로 num.io.threads 와 디스크 상태를 봅니다. NetworkProcessorAvgIdlePercent 가 낮으면 num.network.threads 를 검토합니다. UnderReplicatedPartitions 가 0 이 아니면 복제가 밀린 상태이므로 num.replica.fetchers 와 네트워크·디스크를 확인합니다. OfflinePartitionsCount 가 0 이 아니면 리더가 없는 파티션이 있어 읽기와 쓰기가 모두 막힙니다. ActiveControllerCount 의 클러스터 합이 1 이 아니면 컨트롤러 쿼럼 문제입니다. 로그 flush 지연이 크면 디스크가 병목이고, 리더가 한 브로커에 몰려 있으면 preferred 리더 선출로 균형을 되돌립니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--ok" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--warn" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<text class="dg-fs-md dg-bold" x="8" y="20">브로커가 느리다 · 응답이 밀린다</text>
<text class="dg-fs-sm dg-muted" x="8" y="40">추측하지 말고 메트릭부터 봅니다. 각 판단 아래가 확인할 지표입니다.</text>
<g>
<path class="dg-node dg-node--warn" d="M176,54 L344,96 L176,138 L8,96 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="92" text-anchor="middle">RequestHandlerAvgIdlePercent < 0.3?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="110" text-anchor="middle">KafkaRequestHandlerPool</text>
<rect class="dg-node dg-node--danger" x="392" y="66" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="85">요청 처리 스레드 포화</text>
<text class="dg-fs-sm" x="404" y="103">num.io.threads 를 올리거나 부하를 분산합니다</text>
<text class="dg-fs-sm" x="404" y="121">디스크 지연이 원인이면 스레드만 늘려도 해결되지 않습니다</text>
<path class="dg-edge dg-edge--danger" d="M346,96 L388,96" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="90">예</text>
<path class="dg-edge" d="M176,139 L176,158" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="154">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,160 L344,202 L176,244 L8,202 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="198" text-anchor="middle">NetworkProcessorAvgIdlePercent 낮음?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="216" text-anchor="middle">SocketServer 메트릭</text>
<rect class="dg-node dg-node--warn" x="392" y="172" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="191">네트워크 스레드 포화</text>
<text class="dg-fs-sm" x="404" y="209">num.network.threads 를 검토합니다 (리스너마다 별도 풀입니다)</text>
<text class="dg-fs-sm" x="404" y="227">요청 수가 비정상적으로 많은 클라이언트를 먼저 찾습니다</text>
<path class="dg-edge dg-edge--danger" d="M346,202 L388,202" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="196">예</text>
<path class="dg-edge" d="M176,245 L176,264" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="260">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,266 L344,308 L176,350 L8,308 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="304" text-anchor="middle">UnderReplicatedPartitions > 0?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="322" text-anchor="middle">--describe --under-replicated-partitions</text>
<rect class="dg-node dg-node--danger" x="392" y="278" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="297">복제가 밀리는 중</text>
<text class="dg-fs-sm" x="404" y="315">num.replica.fetchers · 네트워크 대역 · 디스크 처리량을 확인합니다</text>
<text class="dg-fs-sm" x="404" y="333">IsrShrinksPerSec 가 함께 오르면 브로커 한 대가 뒤처지는 중입니다</text>
<path class="dg-edge dg-edge--danger" d="M346,308 L388,308" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="302">예</text>
<path class="dg-edge" d="M176,351 L176,370" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="366">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,372 L344,414 L176,456 L8,414 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="410" text-anchor="middle">OfflinePartitionsCount > 0?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="428" text-anchor="middle">KafkaController 메트릭</text>
<rect class="dg-node dg-node--danger" x="392" y="384" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="403">리더가 없는 파티션 존재</text>
<text class="dg-fs-sm" x="404" y="421">해당 파티션은 읽기·쓰기가 모두 막힙니다 — 최우선 대응 대상입니다</text>
<text class="dg-fs-sm dg-mono dg-muted" x="404" y="439">kafka-topics.sh --describe --unavailable-partitions 로 범위를 확인</text>
<path class="dg-edge dg-edge--danger" d="M346,414 L388,414" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="408">예</text>
<path class="dg-edge" d="M176,457 L176,476" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="472">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,478 L344,520 L176,562 L8,520 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="516" text-anchor="middle">ActiveControllerCount 합이 1 이 아니다?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="534" text-anchor="middle">kafka-metadata-quorum.sh</text>
<rect class="dg-node dg-node--danger" x="392" y="490" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="509">컨트롤러 쿼럼 이상</text>
<text class="dg-fs-sm" x="404" y="527">클러스터 전체에서 정확히 한 대만 1 이어야 합니다</text>
<text class="dg-fs-sm" x="404" y="545">describe --status 로 리더와 복제 지연(lag)을 확인합니다</text>
<path class="dg-edge dg-edge--danger" d="M346,520 L388,520" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="514">예</text>
<path class="dg-edge" d="M176,563 L176,582" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="578">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,584 L344,626 L176,668 L8,626 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="622" text-anchor="middle">로그 flush 지연이 크다?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="640" text-anchor="middle">LogFlushRateAndTimeMs</text>
<rect class="dg-node dg-node--warn" x="392" y="596" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="615">디스크가 병목</text>
<text class="dg-fs-sm dg-mono dg-muted" x="404" y="633">kafka-log-dirs.sh --describe 로 디렉터리별 사용량을 확인합니다</text>
<text class="dg-fs-sm" x="404" y="651">같은 디스크에 여러 로그 디렉터리를 두지 않습니다</text>
<path class="dg-edge dg-edge--danger" d="M346,626 L388,626" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="620">예</text>
<path class="dg-edge" d="M176,669 L176,688" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="684">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,690 L344,732 L176,774 L8,732 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="728" text-anchor="middle">리더가 한 브로커에 몰렸다?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="746" text-anchor="middle">--describe (Leader 열)</text>
<rect class="dg-node dg-node--warn" x="392" y="702" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="721">리더 편중</text>
<text class="dg-fs-sm dg-mono dg-muted" x="404" y="739">kafka-leader-election.sh --election-type preferred --all-topic-partitions</text>
<text class="dg-fs-sm" x="404" y="757">재배치가 필요하면 kafka-reassign-partitions.sh 를 씁니다</text>
<path class="dg-edge dg-edge--danger" d="M346,732 L388,732" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="726">예</text>
<line class="dg-grid" x1="8" y1="784" x2="712" y2="784"/>
<text class="dg-fs-sm" x="8" y="804">정상 기준: UnderReplicatedPartitions 0 · UnderMinIsrPartitionCount 0 · OfflinePartitionsCount 0 · ActiveControllerCount 클러스터 합 1.</text>
<text class="dg-fs-sm" x="8" y="822">RequestHandlerAvgIdlePercent 는 0 과 1 사이 값이며 공식 문서는 0.3 이상을 권합니다.</text>
</svg>
