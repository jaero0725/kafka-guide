<svg viewBox="0 0 720 354" role="img" class="kg-diagram"
     aria-labelledby="d091-title d091-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d091-title">KStream · KTable · GlobalKTable — 같은 입력을 다르게 해석합니다</title>
  <desc id="d091-desc">같은 입력 레코드 다섯 건을 세 가지 추상화가 어떻게 해석하는지 비교한 그림입니다.
    입력은 시간 순서대로 키 A 에 값 1, 키 B 에 값 2, 키 A 에 값 3, 키 B 에 값 null, 키 A 에 값 4 입니다.
    KStream 은 레코드 스트림이므로 다섯 건을 각각 독립적인 이벤트로 다룹니다.
    같은 키가 반복되어도 덮어쓰지 않고 값이 null 인 것도 하나의 이벤트로 전달됩니다.
    KTable 은 변경로그로 해석하므로 키별로 마지막 값만 남는 upsert 가 됩니다.
    결과는 A 가 4 이고, B 는 값이 null 인 레코드를 tombstone 으로 보아 삭제됩니다.
    GlobalKTable 은 해석 자체는 KTable 과 같지만 저장 방식이 다릅니다.
    입력 토픽의 모든 파티션을 모든 애플리케이션 인스턴스가 전부 복제해 가지고 있습니다.
    그래서 조인할 때 co-partitioning 이 필요하지 않고, 키가 아닌 값으로도 조회할 수 있습니다.
    대신 인스턴스마다 전체 데이터를 들고 있어야 하므로 작은 참조 데이터에 적합합니다.</desc>

  <text x="12" y="18" class="dg-fs-md dg-bold">KStream vs KTable vs GlobalKTable — 입력은 같고 해석이 다릅니다</text>

  <!-- 입력 -->
  <text x="12" y="72" class="dg-fs-sm dg-bold">입력</text>
  <text x="12" y="89" class="dg-fs-sm dg-muted">토픽</text>
  <text x="100" y="46" class="dg-fs-sm dg-muted">t1</text>
  <text x="204" y="46" class="dg-fs-sm dg-muted">t2</text>
  <text x="308" y="46" class="dg-fs-sm dg-muted">t3</text>
  <text x="412" y="46" class="dg-fs-sm dg-muted">t4</text>
  <text x="516" y="46" class="dg-fs-sm dg-muted">t5</text>

  <g data-dg="in-1"><rect class="dg-node" x="100" y="52" width="96" height="44" rx="3"/>
    <text class="dg-fs-sm dg-bold" x="148" y="72" text-anchor="middle">key A</text>
    <text class="dg-fs-sm dg-mono" x="148" y="89" text-anchor="middle">value 1</text></g>
  <g data-dg="in-2"><rect class="dg-node" x="204" y="52" width="96" height="44" rx="3"/>
    <text class="dg-fs-sm dg-bold" x="252" y="72" text-anchor="middle">key B</text>
    <text class="dg-fs-sm dg-mono" x="252" y="89" text-anchor="middle">value 2</text></g>
  <g data-dg="in-3"><rect class="dg-node" x="308" y="52" width="96" height="44" rx="3"/>
    <text class="dg-fs-sm dg-bold" x="356" y="72" text-anchor="middle">key A</text>
    <text class="dg-fs-sm dg-mono" x="356" y="89" text-anchor="middle">value 3</text></g>
  <g data-dg="in-4"><rect class="dg-node dg-node--warn" x="412" y="52" width="96" height="44" rx="3"/>
    <text class="dg-fs-sm dg-bold" x="460" y="72" text-anchor="middle">key B</text>
    <text class="dg-fs-sm dg-mono dg-bold" x="460" y="89" text-anchor="middle">value null</text></g>
  <g data-dg="in-5"><rect class="dg-node" x="516" y="52" width="96" height="44" rx="3"/>
    <text class="dg-fs-sm dg-bold" x="564" y="72" text-anchor="middle">key A</text>
    <text class="dg-fs-sm dg-mono" x="564" y="89" text-anchor="middle">value 4</text></g>
  <text class="dg-fs-sm dg-muted" x="620" y="76">시간 →</text>

  <!-- ===== KStream ===== -->
  <rect class="dg-node" x="12" y="112" width="224" height="152" rx="4"/>
  <text class="dg-fs-md dg-bold" x="22" y="133">KStream</text>
  <text class="dg-fs-sm" x="22" y="151">레코드 스트림 · 각 이벤트 독립</text>
  <line class="dg-grid" x1="22" y1="158" x2="226" y2="158"/>
  <g data-dg="ks-rows">
    <rect class="dg-node dg-node--ok" x="22" y="164" width="204" height="16" rx="2"/>
    <text class="dg-fs-sm dg-mono" x="28" y="177">A = 1</text>
    <rect class="dg-node dg-node--ok" x="22" y="183" width="204" height="16" rx="2"/>
    <text class="dg-fs-sm dg-mono" x="28" y="196">B = 2</text>
    <rect class="dg-node dg-node--ok" x="22" y="202" width="204" height="16" rx="2"/>
    <text class="dg-fs-sm dg-mono" x="28" y="215">A = 3</text>
    <rect class="dg-node dg-node--warn" x="22" y="221" width="204" height="16" rx="2"/>
    <text class="dg-fs-sm dg-mono" x="28" y="234">B = null <tspan class="dg-bold">← 이것도 이벤트</tspan></text>
    <rect class="dg-node dg-node--ok" x="22" y="240" width="204" height="16" rx="2"/>
    <text class="dg-fs-sm dg-mono" x="28" y="253">A = 4</text>
  </g>

  <!-- ===== KTable ===== -->
  <rect class="dg-node dg-node--accent" x="248" y="112" width="224" height="152" rx="4"/>
  <text class="dg-fs-md dg-bold" x="258" y="133">KTable</text>
  <text class="dg-fs-sm" x="258" y="151">변경로그 · 키별 upsert</text>
  <line class="dg-grid" x1="258" y1="158" x2="462" y2="158"/>
  <text class="dg-fs-sm dg-bold" x="258" y="176">최종 상태</text>
  <rect class="dg-node dg-node--ok" x="258" y="182" width="204" height="20" rx="2"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="264" y="196">A = 4</text>
  <text class="dg-fs-sm dg-muted" x="360" y="196">1·3 은 덮어써짐</text>
  <rect class="dg-node dg-node--danger" x="258" y="206" width="204" height="20" rx="2"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="264" y="220">B</text>
  <text class="dg-fs-sm dg-bold" x="300" y="220">삭제됨 (tombstone)</text>
  <text class="dg-fs-sm" x="258" y="242">키 2개 입력 → 행 1개 남음</text>
  <text class="dg-fs-sm dg-muted" x="258" y="258">상태 저장소 + changelog 사용</text>

  <!-- ===== GlobalKTable ===== -->
  <rect class="dg-node" x="484" y="112" width="224" height="152" rx="4"/>
  <text class="dg-fs-md dg-bold" x="494" y="133">GlobalKTable</text>
  <text class="dg-fs-sm" x="494" y="151">해석은 KTable 과 동일</text>
  <line class="dg-grid" x1="494" y1="158" x2="698" y2="158"/>
  <text class="dg-fs-sm dg-bold" x="494" y="176">최종 상태 (KTable 과 같음)</text>
  <rect class="dg-node dg-node--ok" x="494" y="182" width="204" height="20" rx="2"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="500" y="196">A = 4</text>
  <rect class="dg-node dg-node--danger" x="494" y="206" width="204" height="20" rx="2"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="500" y="220">B</text>
  <text class="dg-fs-sm dg-bold" x="536" y="220">삭제됨 (tombstone)</text>
  <text class="dg-fs-sm dg-bold" x="494" y="242">다른 점 — 모든 파티션을</text>
  <text class="dg-fs-sm dg-bold" x="494" y="258">모든 인스턴스가 전부 복제</text>

  <!-- 각주 -->
  <line class="dg-grid" x1="12" y1="276" x2="708" y2="276"/>
  <text class="dg-fs-sm" x="12" y="294">GlobalKTable 은 전체 복제라서 조인 시 <tspan class="dg-bold">co-partitioning 이 필요 없고</tspan> 값으로도 조회할 수 있습니다 (D-093).</text>
  <text class="dg-fs-sm dg-muted" x="12" y="312">대신 인스턴스마다 전체 데이터를 들고 있어야 하므로 <tspan class="dg-bold">작은 참조 데이터</tspan>에만 씁니다.</text>
  <text class="dg-fs-sm dg-muted" x="12" y="328">같은 토픽을 <tspan class="dg-mono">builder.stream()</tspan> 으로 읽으면 KStream, <tspan class="dg-mono">builder.table()</tspan> 로 읽으면 KTable 입니다.</text>
  <text class="dg-fs-sm dg-muted" x="12" y="346">데이터가 다른 것이 아니라 <tspan class="dg-bold">해석이 다른 것</tspan>입니다.</text>
</svg>
