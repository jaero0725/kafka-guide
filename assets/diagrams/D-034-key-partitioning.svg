<svg viewBox="0 0 720 452" role="img" class="kg-diagram"
     aria-labelledby="d034-title d034-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d034-title">키 있음/없음 파티셔닝 — murmur2 해시와 sticky batching 비교</title>
  <desc id="d034-desc">파티션 여러 개에 레코드를 보내며 분배를 관찰하는 인터랙티브 그림입니다.
    위쪽 막대는 파티션별 누적 건수이고, 아래쪽 스트립은 최근 24건이 어떤 순서로 어느 파티션에 갔는지 보여 줍니다.
    모드는 세 가지입니다.
    첫째 키 있음 모드에서는 toPositive(murmur2(key)) 를 파티션 수로 나눈 나머지가 파티션이 되므로
    같은 키는 언제나 같은 파티션으로 가고, 그래서 같은 키의 순서가 보장됩니다.
    둘째 키 없음 sticky batching 모드는 Kafka 의 실제 기본 동작입니다.
    한 파티션에 batch.size 만큼 보낸 뒤 다음 파티션으로 전환하므로 스트립에 같은 번호가 연속으로 나타납니다.
    셋째 키 없음 순수 라운드로빈 모드는 비교용입니다. 매 건마다 파티션이 바뀌므로 스트립이 0,1,2 순서로 반복됩니다.
    시험 문제에서는 키가 없을 때를 라운드로빈이라고 표현하기도 하지만,
    실제 구현은 배치 단위로 몰아 보내는 sticky 방식이며 결과적으로 분포는 고르게 됩니다.
    초기 상태는 키 order-42 로 6개 파티션에 8건을 보낸 모습이며 전부 파티션 0 으로 갔습니다.
    Kafka 4.0 에서 DefaultPartitioner 와 UniformStickyPartitioner 클래스는 제거되었고 내장 파티셔너가 이 동작을 담당합니다.</desc>

  <text x="8" y="20" class="dg-fs-md dg-bold">키가 있으면 결정적, 키가 없으면 배치 단위로 몰아 보냅니다</text>
  <text data-dg="mode-label" x="8" y="42" class="dg-fs-sm dg-bold">키 있음 — 같은 키는 언제나 같은 파티션으로 갑니다 (파티션 단위 순서 보장)</text>
  <text data-dg="formula" x="8" y="60" class="dg-fs-sm dg-mono">toPositive(murmur2("order-42")) % 6 = 0</text>
