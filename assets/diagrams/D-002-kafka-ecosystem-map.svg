<svg viewBox="0 0 720 436" role="img" class="kg-diagram"
     aria-labelledby="d002-title d002-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d002-title">Kafka 생태계 지도 — Apache Kafka 에 포함되는 컴포넌트와 별도 컴포넌트</title>
  <desc id="d002-desc">가운데에 브로커로 이루어진 Kafka 클러스터가 있고 왼쪽에는 데이터를 쓰는 Producer API, Kafka Connect source 커넥터, MirrorMaker 2 가, 오른쪽에는 데이터를 읽는 Consumer API, Kafka Streams, Kafka Connect sink 커넥터가 있습니다. 이들은 모두 Apache Kafka 배포판에 포함되며 Admin API 와 kafka 로 시작하는 CLI 도구도 함께 들어 있습니다. 모든 데이터는 브로커의 로그를 거치고 클라이언트끼리 직접 주고받지 않습니다. 아래쪽 점선 영역의 Schema Registry, ksqlDB, REST Proxy 는 Apache Kafka 배포판에 없고 따로 설치하는 Confluent 계열 컴포넌트입니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--ok" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--warn" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--muted" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<text class="dg-fs-md dg-bold" x="8" y="20">Kafka 생태계 지도 — 어디까지가 Apache Kafka 인가</text>
<rect class="dg-panel" x="8" y="32" width="704" height="268" rx="4"/>
<text class="dg-fs-sm dg-bold" x="18" y="49">Apache Kafka 프로젝트에 들어 있는 것</text>
<g>
<rect class="dg-node dg-node--accent" x="248" y="116" width="224" height="96" rx="4"/>
<text class="dg-fs-sm" x="360" y="152.6" text-anchor="middle">Kafka 클러스터</text>
<text class="dg-fs-sm" x="360" y="168.6" text-anchor="middle">브로커 (KRaft 모드)</text>
<text class="dg-fs-sm" x="360" y="184.6" text-anchor="middle">토픽 · 파티션 · 로그</text>
</g>
<text class="dg-fs-sm dg-muted" x="360" y="200" text-anchor="middle">컨트롤러 쿼럼 포함</text>
<g>
<rect class="dg-node" x="24" y="62" width="190" height="44" rx="4"/>
<text class="dg-fs-sm" x="119" y="80.5" text-anchor="middle">Producer API</text>
<text class="dg-fs-sm" x="119" y="96.5" text-anchor="middle">애플리케이션이 쓰기</text>
</g>
<g>
<rect class="dg-node" x="24" y="122" width="190" height="44" rx="4"/>
<text class="dg-fs-sm" x="119" y="140.6" text-anchor="middle">Kafka Connect (source)</text>
<text class="dg-fs-sm" x="119" y="156.6" text-anchor="middle">외부 시스템 → Kafka</text>
</g>
<g>
<rect class="dg-node" x="24" y="182" width="190" height="44" rx="4"/>
<text class="dg-fs-sm" x="119" y="200.6" text-anchor="middle">MirrorMaker 2</text>
<text class="dg-fs-sm" x="119" y="216.6" text-anchor="middle">클러스터 간 복제</text>
</g>
<path class="dg-edge dg-edge--accent" d="M216,84 L246,164" marker-end="url(#mk-arrow-accent)"/>
<path class="dg-edge" d="M216,144 L246,164" marker-end="url(#mk-arrow)"/>
<path class="dg-edge" d="M216,204 L246,164" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node" x="506" y="62" width="190" height="44" rx="4"/>
<text class="dg-fs-sm" x="601" y="80.5" text-anchor="middle">Consumer API</text>
<text class="dg-fs-sm" x="601" y="96.5" text-anchor="middle">애플리케이션이 읽기</text>
</g>
<g>
<rect class="dg-node" x="506" y="122" width="190" height="44" rx="4"/>
<text class="dg-fs-sm" x="601" y="140.6" text-anchor="middle">Kafka Streams</text>
<text class="dg-fs-sm" x="601" y="156.6" text-anchor="middle">Kafka → 처리 → Kafka</text>
</g>
<g>
<rect class="dg-node" x="506" y="182" width="190" height="44" rx="4"/>
<text class="dg-fs-sm" x="601" y="200.6" text-anchor="middle">Kafka Connect (sink)</text>
<text class="dg-fs-sm" x="601" y="216.6" text-anchor="middle">Kafka → 외부 시스템</text>
</g>
<path class="dg-edge dg-edge--accent" d="M474,164 L504,84" marker-end="url(#mk-arrow-accent)"/>
<path class="dg-edge" d="M474,164 L504,144" marker-end="url(#mk-arrow)"/>
<path class="dg-edge" d="M474,164 L504,204" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="24" y="246">Admin API · kafka-*.sh CLI 도구도 Apache Kafka 배포판에 포함됩니다.</text>
<text class="dg-fs-sm dg-muted" x="24" y="266">데이터는 항상 브로커의 로그를 거칩니다 — 클라이언트끼리 직접 주고받지 않습니다.</text>
<rect class="dg-panel" x="8" y="310" width="704" height="96" rx="4"/>
<text class="dg-fs-sm dg-bold" x="18" y="327">따로 설치하는 컴포넌트 (Apache Kafka 배포판에 없음)</text>
<g>
<rect class="dg-node dg-node--muted" x="24" y="336" width="208" height="52" rx="4"/>
<text class="dg-fs-sm" x="128" y="358.6" text-anchor="middle">Schema Registry</text>
<text class="dg-fs-sm" x="128" y="374.6" text-anchor="middle">스키마 등록 · 호환성 검사</text>
</g>
<g>
<rect class="dg-node dg-node--muted" x="248" y="336" width="208" height="52" rx="4"/>
<text class="dg-fs-sm" x="352" y="358.6" text-anchor="middle">ksqlDB</text>
<text class="dg-fs-sm" x="352" y="374.6" text-anchor="middle">SQL 로 스트림 처리</text>
</g>
<g>
<rect class="dg-node dg-node--muted" x="472" y="336" width="208" height="52" rx="4"/>
<text class="dg-fs-sm" x="576" y="358.6" text-anchor="middle">REST Proxy</text>
<text class="dg-fs-sm" x="576" y="374.6" text-anchor="middle">HTTP 로 produce · consume</text>
</g>
<text class="dg-fs-sm dg-bold" x="8" y="424">시험 주의: Schema Registry · ksqlDB · REST Proxy 는 Apache Kafka 기능이 아닙니다.</text>
</svg>
