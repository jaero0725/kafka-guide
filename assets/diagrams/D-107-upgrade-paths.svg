<svg viewBox="0 0 720 540" role="img" class="kg-diagram"
     aria-labelledby="d107-title d107-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d107-title">4.3 업그레이드 경로 — 이미 KRaft, 낮은 KRaft, ZooKeeper 모드의 세 가지 경우</title>
  <desc id="d107-desc">경로 A 는 이미 KRaft 이고 버전이 3.3.x 에서 4.2.x 사이인 경우로, 브로커를 한 대씩 롤링 재시작해 소프트웨어를 올린 뒤 동작과 성능을 확인하고 마지막에 kafka-features.sh upgrade --release-version 4.3 으로 메타데이터 버전을 올립니다. 4.3 은 메타데이터 변경이 있어 이 단계 뒤에는 다운그레이드가 불가능합니다. 경로 B 는 KRaft 이지만 3.3.x 보다 낮은 경우로 공식 문서는 3.9.x 를 먼저 거치도록 권합니다. 소프트웨어뿐 아니라 메타데이터 버전도 최소 3.3 이어야 합니다. 경로 C 는 아직 ZooKeeper 모드인 경우로 3.9 로 올린 뒤 KRaft 컨트롤러 쿼럼을 띄우고 zookeeper.metadata.migration.enable 을 true 로 두어 마이그레이션을 완료해야 합니다. 3.9 가 마지막 브리지 릴리스이므로 여기서 끝내야 하며 4.0 이상에는 ZooKeeper 경로가 없습니다. 공통 원칙으로 클라이언트를 브로커보다 먼저 올리지 않으며 4.0 이후 브로커는 2.1 이상 클라이언트만 지원합니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--ok" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--warn" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--muted" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<text class="dg-fs-md dg-bold" x="8" y="20">4.3 으로 가는 업그레이드 경로 — 지금 상태에 따라 셋 중 하나입니다</text>
<rect class="dg-node dg-node--ok" x="8" y="36" width="704" height="142" rx="4"/>
<text class="dg-fs-sm dg-bold" x="22" y="58">A. 이미 KRaft · 3.3.x ~ 4.2.x</text>
<g>
<rect class="dg-node" x="24" y="68" width="148.5" height="34" rx="4"/>
<text class="dg-fs-sm" x="98.2" y="89.5" text-anchor="middle">현재 클러스터</text>
</g>
<path class="dg-edge" d="M175.5,85 L194.5,85" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--accent" x="198.5" y="68" width="148.5" height="34" rx="4"/>
<text class="dg-fs-sm" x="272.8" y="89.5" text-anchor="middle">브로커 롤링 재시작</text>
</g>
<path class="dg-edge" d="M350,85 L369,85" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node" x="373" y="68" width="148.5" height="34" rx="4"/>
<text class="dg-fs-sm" x="447.2" y="89.5" text-anchor="middle">동작·성능 확인</text>
</g>
<path class="dg-edge" d="M524.5,85 L543.5,85" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--ok" x="547.5" y="68" width="148.5" height="34" rx="4"/>
<text class="dg-fs-sm" x="621.8" y="89.5" text-anchor="middle">kafka-features.sh upgrade</text>
</g>
<text class="dg-fs-sm" x="24" y="132">소프트웨어를 한 대씩 올린 뒤 마지막에 메타데이터 버전을 올립니다.</text>
<text class="dg-fs-sm dg-mono" x="24" y="150">bin/kafka-features.sh --bootstrap-server :9092 upgrade --release-version 4.3</text>
<text class="dg-fs-sm" x="24" y="168">4.3 은 메타데이터 변경이 있어 이 단계 뒤에는 다운그레이드가 불가능합니다.</text>
<rect class="dg-node dg-node--warn" x="8" y="192" width="704" height="124" rx="4"/>
<text class="dg-fs-sm dg-bold" x="22" y="214">B. KRaft 이지만 3.3.x 보다 낮음</text>
<g>
<rect class="dg-node" x="24" y="224" width="148.5" height="34" rx="4"/>
<text class="dg-fs-sm" x="98.2" y="245.6" text-anchor="middle">현재 클러스터</text>
</g>
<path class="dg-edge" d="M175.5,241 L194.5,241" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--warn" x="198.5" y="224" width="148.5" height="34" rx="4"/>
<text class="dg-fs-sm" x="272.8" y="245.6" text-anchor="middle">3.9.x 로 먼저</text>
</g>
<path class="dg-edge" d="M350,241 L369,241" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--accent" x="373" y="224" width="148.5" height="34" rx="4"/>
<text class="dg-fs-sm" x="447.2" y="245.6" text-anchor="middle">4.3 롤링 업그레이드</text>
</g>
<path class="dg-edge" d="M524.5,241 L543.5,241" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--ok" x="547.5" y="224" width="148.5" height="34" rx="4"/>
<text class="dg-fs-sm" x="621.8" y="245.6" text-anchor="middle">kafka-features.sh upgrade</text>
</g>
<text class="dg-fs-sm" x="24" y="288">공식 문서는 3.3.x 미만 KRaft 클러스터는 3.9.x 를 경유하도록 권합니다.</text>
<text class="dg-fs-sm" x="24" y="306">메타데이터 버전도 최소 3.3 이어야 합니다 — 소프트웨어만 올려서는 부족합니다.</text>
<rect class="dg-node dg-node--danger" x="8" y="330" width="704" height="142" rx="4"/>
<text class="dg-fs-sm dg-bold" x="22" y="352">C. 아직 ZooKeeper 모드</text>
<g>
<rect class="dg-node dg-node--danger" x="24" y="362" width="148.5" height="34" rx="4"/>
<text class="dg-fs-sm" x="98.2" y="383.6" text-anchor="middle">ZK 모드 클러스터</text>
</g>
<path class="dg-edge dg-edge--danger" d="M175.5,379 L194.5,379" marker-end="url(#mk-arrow-danger)"/>
<g>
<rect class="dg-node dg-node--warn" x="198.5" y="362" width="148.5" height="34" rx="4"/>
<text class="dg-fs-sm" x="272.8" y="383.6" text-anchor="middle">3.9 로 업그레이드</text>
</g>
<path class="dg-edge" d="M350,379 L369,379" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--danger" x="373" y="362" width="148.5" height="34" rx="4"/>
<text class="dg-fs-sm" x="447.2" y="383.6" text-anchor="middle">KRaft 마이그레이션</text>
</g>
<path class="dg-edge dg-edge--danger" d="M524.5,379 L543.5,379" marker-end="url(#mk-arrow-danger)"/>
<g>
<rect class="dg-node dg-node--accent" x="547.5" y="362" width="148.5" height="34" rx="4"/>
<text class="dg-fs-sm" x="621.8" y="383.6" text-anchor="middle">4.3 롤링 업그레이드</text>
</g>
<text class="dg-fs-sm" x="24" y="426">3.9 가 마지막 브리지 릴리스이므로 여기서 마이그레이션을 끝내야 합니다.</text>
<text class="dg-fs-sm dg-mono" x="24" y="444">KRaft 컨트롤러 쿼럼을 먼저 띄우고 zookeeper.metadata.migration.enable=true 로 시작합니다</text>
<text class="dg-fs-sm" x="24" y="462">마이그레이션이 끝난 뒤에야 4.x 로 올릴 수 있습니다. 4.0 이상에는 ZooKeeper 경로가 없습니다.</text>
<line class="dg-grid" x1="8" y1="486" x2="712" y2="486"/>
<text class="dg-fs-sm dg-bold" x="8" y="508">공통 원칙: 클라이언트는 브로커보다 먼저 올리지 않습니다. 4.0 이후 브로커는 2.1 이상 클라이언트만 지원합니다.</text>
<text class="dg-fs-sm" x="8" y="528">메타데이터 버전을 올리는 마지막 단계는 되돌릴 수 없는 경우가 많습니다 — 충분히 관찰한 뒤 실행합니다.</text>
</svg>
