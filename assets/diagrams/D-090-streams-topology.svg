<svg viewBox="0 0 720 356" role="img" class="kg-diagram"
     aria-labelledby="d090-title d090-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d090-title">Streams 토폴로지 — sub-topology 경계와 리파티션 토픽</title>
  <desc id="d090-desc">Kafka Streams 토폴로지가 리파티션 토픽에서 두 개의 sub-topology 로 갈리는 모습을 그린 그림입니다.
    첫 번째 sub-topology 는 orders 토픽을 읽는 source 노드에서 시작해 filter, selectKey 를 지나
    리파티션 토픽으로 쓰는 sink 노드로 끝납니다.
    selectKey 가 키를 바꾸므로 스트림에 리파티션 표시가 붙고, 뒤에서 집계를 하면 실제로 리파티션이 일어납니다.
    가운데의 리파티션 토픽이 두 sub-topology 를 잇는 경계입니다.
    두 번째 sub-topology 는 그 리파티션 토픽을 읽는 source 노드에서 시작해
    상태 저장소를 쓰는 집계 노드, KTable 을 KStream 으로 바꾸는 노드를 지나
    결과 토픽으로 쓰는 sink 노드로 끝납니다.
    태스크는 sub-topology 단위로 만들어지므로 경계가 병렬성의 단위도 함께 나눕니다.
    리파티션 토픽 이름은 application.id 와 연산자 이름과 repartition 접미사로 이루어지고,
    cleanup.policy 는 delete, retention.ms 는 무한이며 처리된 데이터는 Streams 가 자동으로 지웁니다.</desc>

  <text x="12" y="18" class="dg-fs-md dg-bold">토폴로지 — sub-topology 는 <tspan class="dg-bold">리파티션 토픽에서</tspan> 갈립니다</text>

  <!-- ===== sub-topology 0 ===== -->
  <rect class="dg-panel" x="12" y="32" width="696" height="92" rx="6"/>
  <text class="dg-fs-sm dg-bold" x="24" y="48">sub-topology 0</text>

  <rect class="dg-node dg-node--alt" x="24" y="56" width="156" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="102" y="80" text-anchor="middle">source</text>
  <text class="dg-fs-sm dg-mono dg-muted" x="102" y="98" text-anchor="middle">orders</text>
  <line class="dg-edge" x1="180" y1="86" x2="191" y2="86"/>
  <path class="dg-marker" d="M190,81 L198,86 L190,91 Z"/>

  <rect class="dg-node" x="194" y="56" width="156" height="60" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="272" y="80" text-anchor="middle">filter</text>
  <text class="dg-fs-sm dg-muted" x="272" y="98" text-anchor="middle">stateless</text>
  <line class="dg-edge" x1="350" y1="86" x2="361" y2="86"/>
  <path class="dg-marker" d="M360,81 L368,86 L360,91 Z"/>

  <rect class="dg-node dg-node--warn" x="364" y="56" width="156" height="60" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="442" y="80" text-anchor="middle">selectKey</text>
  <text class="dg-fs-sm dg-bold" x="442" y="98" text-anchor="middle">리파티션 표시됨</text>
  <line class="dg-edge" x1="520" y1="86" x2="531" y2="86"/>
  <path class="dg-marker" d="M530,81 L538,86 L530,91 Z"/>

  <rect class="dg-node dg-node--accent" x="534" y="56" width="156" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="612" y="80" text-anchor="middle">sink</text>
  <text class="dg-fs-sm dg-muted" x="612" y="98" text-anchor="middle">→ 리파티션 토픽</text>

  <!-- ===== 리파티션 토픽 (경계) ===== -->
  <line class="dg-edge dg-edge--accent" x1="612" y1="116" x2="612" y2="153"/>
  <line class="dg-edge dg-edge--accent" x1="612" y1="153" x2="477" y2="153"/>
  <path class="dg-marker--accent" d="M478,148 L470,153 L478,158 Z"/>

  <rect class="dg-node dg-node--accent" x="250" y="134" width="220" height="38" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="360" y="151" text-anchor="middle">리파티션 토픽 (내부)</text>
  <text class="dg-fs-sm dg-muted" x="360" y="166" text-anchor="middle">sub-topology 경계</text>

  <line class="dg-edge dg-edge--accent" x1="250" y1="153" x2="102" y2="153"/>
  <line class="dg-edge dg-edge--accent" x1="102" y1="153" x2="102" y2="196"/>
  <path class="dg-marker--accent" d="M97,196 L107,196 L102,204 Z"/>

  <!-- ===== sub-topology 1 ===== -->
  <rect class="dg-panel" x="12" y="208" width="696" height="92" rx="6"/>
  <text class="dg-fs-sm dg-bold" x="24" y="224">sub-topology 1</text>

  <rect class="dg-node dg-node--alt" x="24" y="232" width="156" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="102" y="256" text-anchor="middle">source</text>
  <text class="dg-fs-sm dg-muted" x="102" y="274" text-anchor="middle">리파티션 토픽</text>
  <line class="dg-edge" x1="180" y1="262" x2="191" y2="262"/>
  <path class="dg-marker" d="M190,257 L198,262 L190,267 Z"/>

  <rect class="dg-node dg-node--ok" x="194" y="232" width="156" height="60" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="272" y="256" text-anchor="middle">count</text>
  <text class="dg-fs-sm dg-bold" x="272" y="274" text-anchor="middle">상태 저장소 사용</text>
  <line class="dg-edge" x1="350" y1="262" x2="361" y2="262"/>
  <path class="dg-marker" d="M360,257 L368,262 L360,267 Z"/>

  <rect class="dg-node" x="364" y="232" width="156" height="60" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="442" y="256" text-anchor="middle">toStream</text>
  <text class="dg-fs-sm dg-muted" x="442" y="274" text-anchor="middle">KTable → KStream</text>
  <line class="dg-edge" x1="520" y1="262" x2="531" y2="262"/>
  <path class="dg-marker" d="M530,257 L538,262 L530,267 Z"/>

  <rect class="dg-node dg-node--alt" x="534" y="232" width="156" height="60" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="612" y="256" text-anchor="middle">sink</text>
  <text class="dg-fs-sm dg-mono dg-muted" x="612" y="274" text-anchor="middle">order-counts</text>

  <!-- 각주 -->
  <line class="dg-grid" x1="12" y1="312" x2="708" y2="312"/>
  <text class="dg-fs-sm" x="12" y="330">태스크는 <tspan class="dg-bold">sub-topology 단위</tspan>로 만들어집니다 — 경계가 병렬성의 단위도 나눕니다.</text>
  <text class="dg-fs-sm dg-muted" x="12" y="348">리파티션 토픽 이름은 <tspan class="dg-mono">{application.id}-{연산자}-repartition</tspan> 이고 <tspan class="dg-mono">cleanup.policy=delete</tspan> 입니다.</text>
</svg>
