<svg viewBox="0 0 720 546" role="img" class="kg-diagram"
     aria-labelledby="d116-title d116-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d116-title">case07 — 컨슈머에 멱등성이 없어 재처리가 이중 결제로 이어지는 흐름</title>
  <desc id="d116-desc">정상 흐름은 poll 로 레코드를 받아 결제 API 를 호출하고 성공하면 오프셋을 커밋하는 순서입니다. 어긋나는 지점은 결제 API 호출이 성공한 뒤 커밋 전에 프로세스가 종료되는 경우로, 배포나 OOM, 리밸런스로 파티션이 회수되는 상황에서 발생합니다. 이때 오프셋은 커밋되지 않았으므로 재시작 후 같은 레코드를 다시 받아 결제 API 를 두 번 호출합니다. 중요한 점은 Kafka 트랜잭션과 exactly-once 설정을 켜도 Kafka 밖의 외부 시스템 호출에는 적용되지 않는다는 것입니다. 처방은 결제 요청에 멱등 키를 부여하고 처리 이력을 저장소에 기록해 먼저 조회하는 것입니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--ok" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--warn" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<rect class="dg-node dg-node--ok" x="8" y="8" width="704" height="122" rx="4"/>
<text class="dg-fs-md dg-bold" x="22" y="29">1. 정상 흐름</text>
<text class="dg-fs-sm dg-muted" x="698" y="29" text-anchor="end">처리 후 커밋 (at-least-once)</text>
<g>
<rect class="dg-node" x="24" y="38" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="98.2" y="58.5" text-anchor="middle">poll() 레코드 수신</text>
</g>
<path class="dg-edge" d="M175.5,54 L194.5,54" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node" x="198.5" y="38" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="272.8" y="58.5" text-anchor="middle">결제 API 호출</text>
</g>
<path class="dg-edge" d="M350,54 L369,54" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--ok" x="373" y="38" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="447.2" y="58.5" text-anchor="middle">성공</text>
</g>
<path class="dg-edge" d="M524.5,54 L543.5,54" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--ok" x="547.5" y="38" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="621.8" y="58.5" text-anchor="middle">오프셋 커밋</text>
</g>
<text class="dg-fs-sm" x="24" y="98">처리 후 커밋은 유실을 막는 대신 중복 가능성을 남기는 선택입니다 (at-least-once).</text>
<text class="dg-fs-sm" x="24" y="116">반대로 처리 전에 커밋하면 중복은 없지만 유실이 생깁니다 — 둘 중 하나를 고르는 문제입니다.</text>
<rect class="dg-node dg-node--danger" x="8" y="152" width="704" height="122" rx="4"/>
<text class="dg-fs-md dg-bold" x="22" y="173">2. 어긋나는 지점</text>
<text class="dg-fs-sm dg-muted" x="698" y="173" text-anchor="end">성공과 커밋 사이의 틈</text>
<g>
<rect class="dg-node dg-node--ok" x="24" y="182" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="98.2" y="202.6" text-anchor="middle">결제 성공</text>
</g>
<path class="dg-edge" d="M175.5,198 L194.5,198" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--danger" x="198.5" y="182" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="272.8" y="202.6" text-anchor="middle">커밋 전 프로세스 종료</text>
</g>
<path class="dg-edge dg-edge--danger" d="M350,198 L369,198" marker-end="url(#mk-arrow-danger)"/>
<g>
<rect class="dg-node dg-node--danger" x="373" y="182" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="447.2" y="202.6" text-anchor="middle">오프셋 미커밋</text>
</g>
<path class="dg-edge dg-edge--danger" d="M524.5,198 L543.5,198" marker-end="url(#mk-arrow-danger)"/>
<g>
<rect class="dg-node dg-node--warn" x="547.5" y="182" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="621.8" y="202.6" text-anchor="middle">재시작 · 재할당</text>
</g>
<text class="dg-fs-sm" x="24" y="242">배포, OOM, 리밸런스로 파티션이 회수되는 순간이 모두 이 틈에 해당합니다.</text>
<text class="dg-fs-sm" x="24" y="260">Kafka 는 이 레코드를 아직 처리되지 않은 것으로 봅니다 — 커밋된 오프셋만이 진실입니다.</text>
<rect class="dg-node dg-node--danger" x="8" y="296" width="704" height="122" rx="4"/>
<text class="dg-fs-md dg-bold" x="22" y="317">3. 결과</text>
<text class="dg-fs-sm dg-muted" x="698" y="317" text-anchor="end">결제가 두 번 일어납니다</text>
<g>
<rect class="dg-node dg-node--danger" x="24" y="326" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="98.2" y="346.6" text-anchor="middle">같은 레코드 재수신</text>
</g>
<path class="dg-edge dg-edge--danger" d="M175.5,342 L194.5,342" marker-end="url(#mk-arrow-danger)"/>
<g>
<rect class="dg-node dg-node--danger" x="198.5" y="326" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="272.8" y="346.6" text-anchor="middle">결제 API 두 번째 호출</text>
</g>
<path class="dg-edge dg-edge--danger" d="M350,342 L369,342" marker-end="url(#mk-arrow-danger)"/>
<g>
<rect class="dg-node dg-node--danger" x="373" y="326" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="447.2" y="346.6" text-anchor="middle">이중 결제</text>
</g>
<path class="dg-edge dg-edge--danger" d="M524.5,342 L543.5,342" marker-end="url(#mk-arrow-danger)"/>
<g>
<rect class="dg-node dg-node--danger" x="547.5" y="326" width="148.5" height="32" rx="4"/>
<text class="dg-fs-sm" x="621.8" y="346.6" text-anchor="middle">EOS 로도 막히지 않음</text>
</g>
<text class="dg-fs-sm" x="24" y="386">exactly-once 설정과 트랜잭션은 Kafka 안의 쓰기와 오프셋 커밋을 원자적으로 묶는 기능입니다.</text>
<text class="dg-fs-sm" x="24" y="404">외부 결제 API 는 그 트랜잭션 경계 밖이므로 두 번 호출된 사실을 Kafka 가 되돌릴 수 없습니다.</text>
<path class="dg-edge dg-edge--danger" d="M360,132 L360,149" marker-end="url(#mk-arrow-danger)"/>
<path class="dg-edge dg-edge--danger" d="M360,276 L360,293" marker-end="url(#mk-arrow-danger)"/>
<rect class="dg-node dg-node--ok" x="8" y="440" width="704" height="98" rx="4"/>
<text class="dg-fs-sm dg-bold" x="22" y="461">처방</text>
<text class="dg-fs-sm" x="70" y="461">결제 요청에 멱등 키를 붙입니다 (주문 ID 또는 토픽·파티션·오프셋 조합).</text>
<text class="dg-fs-sm" x="70" y="479">처리 이력을 저장소에 기록하고 처리 전에 먼저 조회해 이미 처리한 레코드는 건너뜁니다.</text>
<text class="dg-fs-sm" x="70" y="497">외부 시스템이 멱등 API 를 제공하면 그것을 씁니다 — 재시도 안전성을 상대 시스템에 맡깁니다.</text>
<text class="dg-fs-sm" x="70" y="515">Kafka 트랜잭션은 Kafka → Kafka 범위에서만 원자성을 보장한다는 점을 설계 전제로 둡니다.</text>
</svg>
