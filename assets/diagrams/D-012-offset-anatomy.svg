<svg viewBox="0 0 720 470" role="img" class="kg-diagram"
     aria-labelledby="d012-title d012-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d012-title">오프셋 4종 구분 — log-start-offset · committed offset · high watermark · LEO</title>
  <desc id="d012-desc">하나의 파티션 로그를 12칸 막대로 표현한 그림입니다. 리더 로그 위에 네 지점이 표시됩니다.
    log-start-offset은 리텐션으로 삭제된 경계, committed offset은 컨슈머 그룹이 커밋한 위치,
    high watermark는 ISR 내 모든 레플리카가 복제를 마쳐 컨슈머가 읽을 수 있는 상한,
    LEO는 리더가 기록한 마지막 위치입니다. committed offset과 high watermark 사이는 아직 읽지 않은 구간이고,
    high watermark와 LEO 사이는 복제가 끝나지 않아 컨슈머에게 보이지 않는 구간입니다.
    아래에는 팔로워 두 대의 복제 진행 막대가 있으며, high watermark가 그중 최소 LEO에 맞춰지는 것을 점선으로 잇습니다.</desc>

  <!-- ================= 리더 로그 ================= -->
  <text x="8" y="20" class="dg-fs-md dg-bold">리더 (broker-1) 의 파티션 로그 — <tspan class="dg-mono">orders-0</tspan></text>

  <!-- LEO 마커 (중립 · 실선) -->
  <g data-dg="marker-leo" class="dg-move" transform="translate(576,0)">
    <line class="dg-edge" x1="0" y1="54" x2="0" y2="118"/>
    <path class="dg-marker" d="M-5,118 L5,118 L0,126 Z"/>
    <rect class="dg-node" x="-34" y="34" width="68" height="20" rx="4"/>
    <text class="dg-fs-sm dg-bold" x="-28" y="48" text-anchor="start">LEO</text>
    <text class="dg-fs-sm dg-bold dg-num" x="28" y="48" text-anchor="end" data-dg="val-leo">12</text>
  </g>

  <!-- high watermark 마커 (강조 · 파선) — 팔로워 구간까지 이어지는 안내선 포함 -->
  <g data-dg="marker-hw" class="dg-move" transform="translate(376,0)">
    <line class="dg-edge dg-edge--accent dg-edge--dashed" x1="0" y1="86" x2="0" y2="118"/>
    <line class="dg-edge dg-edge--accent dg-edge--dashed" x1="0" y1="170" x2="0" y2="344"/>
    <path class="dg-marker--accent" d="M-5,118 L5,118 L0,126 Z"/>
    <rect class="dg-node dg-node--accent" x="-34" y="66" width="68" height="20" rx="4"/>
    <text class="dg-fs-sm dg-bold" x="-28" y="80" text-anchor="start">HW</text>
    <text class="dg-fs-sm dg-bold dg-num" x="28" y="80" text-anchor="end" data-dg="val-hw">7</text>
  </g>

  <!-- 레코드 칸 12개 (오프셋 0..11) -->
  <g data-dg="cell-0"><rect class="dg-node" x="96" y="126" width="40" height="44" rx="2"/><text class="dg-fs-sm dg-num" x="116" y="153" text-anchor="middle">0</text></g>
  <g data-dg="cell-1"><rect class="dg-node" x="136" y="126" width="40" height="44" rx="2"/><text class="dg-fs-sm dg-num" x="156" y="153" text-anchor="middle">1</text></g>
  <g data-dg="cell-2"><rect class="dg-node" x="176" y="126" width="40" height="44" rx="2"/><text class="dg-fs-sm dg-num" x="196" y="153" text-anchor="middle">2</text></g>
  <g data-dg="cell-3"><rect class="dg-node" x="216" y="126" width="40" height="44" rx="2"/><text class="dg-fs-sm dg-num" x="236" y="153" text-anchor="middle">3</text></g>
  <g data-dg="cell-4"><rect class="dg-node" x="256" y="126" width="40" height="44" rx="2"/><text class="dg-fs-sm dg-num" x="276" y="153" text-anchor="middle">4</text></g>
  <g data-dg="cell-5"><rect class="dg-node" x="296" y="126" width="40" height="44" rx="2"/><text class="dg-fs-sm dg-num" x="316" y="153" text-anchor="middle">5</text></g>
  <g data-dg="cell-6"><rect class="dg-node" x="336" y="126" width="40" height="44" rx="2"/><text class="dg-fs-sm dg-num" x="356" y="153" text-anchor="middle">6</text></g>
  <g data-dg="cell-7"><rect class="dg-node" x="376" y="126" width="40" height="44" rx="2"/><text class="dg-fs-sm dg-num" x="396" y="153" text-anchor="middle">7</text></g>
  <g data-dg="cell-8"><rect class="dg-node" x="416" y="126" width="40" height="44" rx="2"/><text class="dg-fs-sm dg-num" x="436" y="153" text-anchor="middle">8</text></g>
  <g data-dg="cell-9"><rect class="dg-node" x="456" y="126" width="40" height="44" rx="2"/><text class="dg-fs-sm dg-num" x="476" y="153" text-anchor="middle">9</text></g>
  <g data-dg="cell-10"><rect class="dg-node" x="496" y="126" width="40" height="44" rx="2"/><text class="dg-fs-sm dg-num" x="516" y="153" text-anchor="middle">10</text></g>
  <g data-dg="cell-11"><rect class="dg-node" x="536" y="126" width="40" height="44" rx="2"/><text class="dg-fs-sm dg-num" x="556" y="153" text-anchor="middle">11</text></g>
  <text x="8" y="153" class="dg-fs-sm dg-bold">리더</text>

  <!-- 구간 막대: committed → HW (아직 안 읽음) / HW → LEO (아직 복제 안 됨) -->
  <rect data-dg="span-unread" class="dg-node dg-node--ok" x="256" y="172" width="120" height="12" rx="3"/>
  <rect data-dg="span-unreplicated" class="dg-node dg-node--muted" x="376" y="172" width="200" height="12" rx="3"/>
  <text data-dg="label-unread" class="dg-fs-sm" x="316" y="199" text-anchor="middle">아직 안 읽음 3건</text>
  <text data-dg="label-unreplicated" class="dg-fs-sm" x="476" y="199" text-anchor="middle">아직 복제 안 됨 5건</text>

  <!-- log-start-offset 마커 (주의 · 점선) — committed 보다 먼저 그려 겹칠 때 아래로 -->
  <g data-dg="marker-lso" class="dg-move" transform="translate(96,0)">
    <line class="dg-edge dg-edge--warn dg-edge--dotted" x1="0" y1="196" x2="0" y2="246"/>
    <path class="dg-marker--warn" d="M-5,196 L5,196 L0,188 Z"/>
    <rect class="dg-node dg-node--warn" x="-34" y="246" width="68" height="20" rx="4"/>
    <text class="dg-fs-sm dg-bold" x="-28" y="260" text-anchor="start">시작</text>
    <text class="dg-fs-sm dg-bold dg-num" x="28" y="260" text-anchor="end" data-dg="val-lso">0</text>
  </g>

  <!-- committed offset 마커 (정상 · 실선) -->
  <g data-dg="marker-committed" class="dg-move" transform="translate(256,0)">
    <line class="dg-edge dg-edge--ok" x1="0" y1="196" x2="0" y2="212"/>
    <path class="dg-marker--ok" d="M-5,196 L5,196 L0,188 Z"/>
    <rect class="dg-node dg-node--ok" x="-34" y="212" width="68" height="20" rx="4"/>
    <text class="dg-fs-sm dg-bold" x="-28" y="226" text-anchor="start">커밋</text>
    <text class="dg-fs-sm dg-bold dg-num" x="28" y="226" text-anchor="end" data-dg="val-committed">4</text>
  </g>

  <!-- ================= 팔로워 복제 진행 ================= -->
  <text x="8" y="288" class="dg-fs-md dg-bold">팔로워 복제 진행 (ISR 멤버) — high watermark 는 이 중 최소 LEO 로 결정</text>

  <rect class="dg-node--empty" x="96" y="300" width="480" height="16" rx="3"/>
  <rect data-dg="follower-bar-b" class="dg-node dg-node--accent" x="96" y="300" width="360" height="16" rx="3"/>
  <text x="8" y="312" class="dg-fs-sm dg-bold">팔로워 B</text>
  <text data-dg="follower-val-b" class="dg-fs-sm dg-num dg-muted" x="462" y="312" text-anchor="start">LEO 9</text>

  <rect class="dg-node--empty" x="96" y="324" width="480" height="16" rx="3"/>
  <rect data-dg="follower-bar-c" class="dg-node dg-node--accent" x="96" y="324" width="280" height="16" rx="3"/>
  <text x="8" y="336" class="dg-fs-sm dg-bold">팔로워 C</text>
  <text data-dg="follower-val-c" class="dg-fs-sm dg-num dg-muted" x="382" y="336" text-anchor="start">LEO 7</text>

  <text data-dg="note-hw" x="8" y="362" class="dg-fs-sm">high watermark = ISR 내 최소 LEO → 팔로워 C(7)</text>

  <!-- ================= 범례 ================= -->
  <line class="dg-grid" x1="8" y1="376" x2="712" y2="376"/>

  <!-- 1행: 지표 4종 -->
  <rect class="dg-node dg-node--warn" x="8" y="386" width="16" height="12" rx="3"/>
  <text class="dg-fs-sm" x="30" y="396">시작 = log-start-offset (리텐션 삭제 경계)</text>
  <rect class="dg-node dg-node--ok" x="372" y="386" width="16" height="12" rx="3"/>
  <text class="dg-fs-sm" x="394" y="396">커밋 = committed offset (컨슈머 그룹)</text>

  <rect class="dg-node dg-node--accent" x="8" y="408" width="16" height="12" rx="3"/>
  <text class="dg-fs-sm" x="30" y="418">HW = high watermark (읽기 가능 상한)</text>
  <rect class="dg-node" x="372" y="408" width="16" height="12" rx="3"/>
  <text class="dg-fs-sm" x="394" y="418">LEO = log end offset (리더 기록 끝)</text>

  <!-- 2행: 칸 상태 -->
  <rect class="dg-node dg-node--ok" x="8" y="432" width="16" height="12" rx="2"/>
  <text class="dg-fs-sm" x="30" y="442">읽고 커밋함</text>
  <rect class="dg-node dg-node--accent" x="140" y="432" width="16" height="12" rx="2"/>
  <text class="dg-fs-sm" x="162" y="442">읽을 수 있음</text>
  <rect class="dg-node" x="282" y="432" width="16" height="12" rx="2" opacity="0.6"/>
  <text class="dg-fs-sm" x="304" y="442">복제 미완 · 안 보임</text>
  <rect class="dg-node" x="470" y="432" width="16" height="12" rx="2" opacity="0.32"/>
  <text class="dg-fs-sm" x="492" y="442">미기록</text>
  <rect class="dg-node--empty" x="580" y="432" width="16" height="12" rx="2"/>
  <text class="dg-fs-sm" x="602" y="442">삭제됨</text>

  <text class="dg-fs-sm dg-muted" x="8" y="462">컨슈머는 high watermark 를 넘어서 읽지 못합니다.</text>
</svg>
