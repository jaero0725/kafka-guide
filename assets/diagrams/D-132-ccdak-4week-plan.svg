<svg viewBox="0 0 720 564" role="img" class="kg-diagram"
     aria-labelledby="d132-title d132-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d132-title">CCDAK 4주 학습 플랜 간트 — 학습·실습·문제풀이 배치</title>
  <desc id="d132-desc">가로축이 4주, 세로축이 학습·실습·문제풀이·복습 항목인 간트 차트입니다. 1주차는 ch01부터 ch03까지 개요와 아키텍처, 2주차는 ch04 Producer와 ch05 Consumer, 3주차는 ch06 전달 보장부터 ch08 스키마까지, 4주차 전반은 ch09 Connect부터 ch11 운영까지 읽습니다. 실무 예제는 1주차 중반부터 4주차 초반까지, 실수 사례는 3주차 중반부터 이어집니다. 장별 확인문제는 읽은 직후 바로 풀고, 도메인별 문제은행은 2주차부터, 모의고사 두 회는 4주차에 배치합니다. 오답노트와 플래시카드는 2주차부터 매일 병행하고, 마지막 이틀은 벼락치기 요약과 설정값 관계도만 봅니다. 주 14시간, 하루 2시간 기준의 예시 일정입니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<text class="dg-fs-md dg-bold" x="8" y="20">CCDAK 4주 학습 플랜 — 주 14시간(하루 2시간) 기준 예시</text>
<text class="dg-fs-sm dg-muted" x="8" y="42">학습 · 실습 · 문제풀이를 겹쳐 진행합니다. 다 읽고 나서 몰아서 푸는 방식은 4주 안에 끝나지 않습니다.</text>
