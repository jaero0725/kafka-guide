<path class="dg-edge" d="M492,339 L502,339" marker-end="url(#mk-arrow)"/>
<rect class="dg-node" x="504" y="324" width="56" height="30" rx="3"/>
<text class="dg-fs-sm dg-bold dg-num" x="532" y="344" text-anchor="middle">4.3</text>
<text class="dg-fs-sm" x="8" y="380">2.8 다음이 3.0 — 여기서 minor 번호가 건너뜁니다. Scala 버전(2.13)과는 아무 관계가 없습니다.</text>
<text class="dg-fs-sm dg-muted" x="8" y="400">Scala 를 직접 쓰지 않는다면 _2.13 배포판을 그대로 고르면 됩니다. 브로커 실행에는 Java 만 필요합니다.</text>
