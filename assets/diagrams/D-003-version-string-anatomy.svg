<text class="dg-fs-sm" x="34" y="172.6" text-anchor="start">브로커를 컴파일한 Scala 의 버전입니다.</text>
<text class="dg-fs-sm" x="34" y="188.6" text-anchor="start">Kafka 4.x 는 Scala 2.13 배포판만 제공합니다</text>
<text class="dg-fs-sm" x="34" y="204.6" text-anchor="start">(2.12 지원은 4.0 에서 제거).</text>
</g>
