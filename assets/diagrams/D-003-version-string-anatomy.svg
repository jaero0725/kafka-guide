<svg viewBox="0 0 720 412" role="img" class="kg-diagram"
     aria-labelledby="d003-title d003-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d003-title">Kafka 배포 파일명 분해 — kafka_2.13-4.3.1.tgz 의 2.13 은 Scala 버전</title>
  <desc id="d003-desc">배포 파일명 kafka_2.13-4.3.1.tgz 를 두 부분으로 분해합니다. 밑줄 뒤의 2.13 은 브로커를 컴파일한 Scala 버전이며 Kafka 4.x 는 Scala 2.13 배포판만 제공합니다. Scala 2.12 지원은 4.0 에서 제거되었습니다. 하이픈 뒤의 4.3.1 이 Apache Kafka 버전으로 major 4, minor 3, patch 1 이며 설정 기본값과 CLI, API 는 이 번호를 기준으로 봅니다. 아래 경고 상자는 Kafka 2.13 이라는 버전이 존재하지 않는다는 점을 알려 줍니다. Kafka 의 minor 버전은 2.8 다음이 3.0 이므로 2.9 부터 2.13 까지는 아예 없습니다. 맨 아래에는 2.6, 2.7, 2.8, 3.0 을 지나 3.9, 4.0, 4.3 으로 이어지는 실제 버전 흐름이 표시되어 있습니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
