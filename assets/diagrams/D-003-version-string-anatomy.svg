<text class="dg-fs-sm" x="394" y="172.6" text-anchor="start">major 4 · minor 3 · patch 1.</text>
<text class="dg-fs-sm" x="394" y="188.6" text-anchor="start">설정 기본값 · CLI · API 는 모두</text>
<text class="dg-fs-sm" x="394" y="204.6" text-anchor="start">이 번호를 기준으로 봅니다.</text>
</g>
