  <title id="d130-title">CCDAK 도메인 가중치 — 6개 도메인의 비중과 학습 시간 배분</title>
  <desc id="d130-desc">CCDAK 시험의 6개 도메인 비중을 두 가지 방식으로 보여 줍니다. 위쪽은 100문항을 도메인별로 나눈 누적 막대이고, 아래는 도메인별 막대 길이로 학습량을 비교한 것입니다. Application Development 28퍼센트, Fundamentals 23퍼센트, Kafka Connect 15퍼센트, Application Observability 13퍼센트, Kafka Streams 12퍼센트, Application Testing 8퍼센트입니다. 상위 두 도메인의 합이 51퍼센트이므로 학습 시간의 절반을 여기에 배분해야 합니다. 오른쪽 열은 총 40시간을 가중치대로 나눈 시간입니다. 이 수치는 공개 자료 기준의 잠정치이며 합계가 99퍼센트로 반올림되어 있습니다.</desc>

