<svg viewBox="0 0 720 312" role="img" class="kg-diagram"
     aria-labelledby="d080-title d080-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d080-title">Kafka Connect 아키텍처 — 워커 · 커넥터 · 태스크 · 내부 토픽 3종</title>
  <desc id="d080-desc">분산 모드 Connect 클러스터를 그린 그림입니다.
    같은 group.id 를 가진 워커 세 대가 하나의 클러스터를 이루고, 그중 한 대가 그룹 리더가 되어 태스크 할당을 계산합니다.
    커넥터 A 는 소스 커넥터로 태스크 세 개, 커넥터 B 는 싱크 커넥터로 태스크 세 개를 요구하며
    합계 여섯 개의 태스크가 세 워커에 두 개씩 분산됩니다.
    커넥터는 설정일 뿐이고 실제로 데이터를 옮기는 것은 태스크입니다.
    모든 워커가 REST API 를 제공하므로 어느 워커에 요청해도 됩니다.
    클러스터 상태는 Kafka 내부 토픽 세 개에 저장됩니다.
    config.storage.topic 은 커넥터와 태스크 설정을 담고 파티션 하나에 compact 정책을 씁니다.
    offset.storage.topic 은 소스 커넥터의 오프셋을 담고 기본 25 파티션에 compact 정책을 씁니다.
    status.storage.topic 은 커넥터와 태스크 상태를 담고 compact 정책을 씁니다.
    워커가 자기 상태를 이 토픽들에 저장하기 때문에 워커 자체는 상태를 갖지 않고 교체할 수 있습니다.</desc>

  <text x="12" y="18" class="dg-fs-md dg-bold">Kafka Connect 아키텍처 — 상태는 워커가 아니라 Kafka 에 있습니다</text>

  <!-- 클러스터 -->
  <rect class="dg-panel" x="12" y="30" width="696" height="140" rx="6"/>
  <text class="dg-fs-sm dg-bold" x="24" y="48">Connect 클러스터 — <tspan class="dg-mono">group.id=connect-cluster</tspan> (컨슈머 그룹 id 와 겹치면 안 됩니다)</text>

  <!-- worker-1 (리더) -->
  <g data-dg="worker-1">
    <rect class="dg-node dg-node--accent" x="24" y="58" width="216" height="102" rx="4"/>
    <text class="dg-fs-sm dg-bold" x="34" y="76">worker-1 <tspan class="dg-bold">(그룹 리더)</tspan></text>
    <text class="dg-fs-sm dg-mono dg-muted" x="34" y="92">REST :8083</text>
    <rect class="dg-node" x="34" y="100" width="94" height="22" rx="3"/>
    <text class="dg-fs-sm" x="81" y="115" text-anchor="middle">A · task 0</text>
    <rect class="dg-node dg-node--alt" x="136" y="100" width="94" height="22" rx="3"/>
    <text class="dg-fs-sm" x="183" y="115" text-anchor="middle">B · task 0</text>
    <text class="dg-fs-sm dg-bold" x="34" y="140">태스크 할당 계산</text>
    <text class="dg-fs-sm dg-muted" x="34" y="154">설정 변경 감지 → 리밸런스</text>
  </g>

  <!-- worker-2 -->
  <g data-dg="worker-2">
    <rect class="dg-node" x="252" y="58" width="216" height="102" rx="4"/>
    <text class="dg-fs-sm dg-bold" x="262" y="76">worker-2</text>
    <text class="dg-fs-sm dg-mono dg-muted" x="262" y="92">REST :8083</text>
    <rect class="dg-node" x="262" y="100" width="94" height="22" rx="3"/>
    <text class="dg-fs-sm" x="309" y="115" text-anchor="middle">A · task 1</text>
    <rect class="dg-node dg-node--alt" x="364" y="100" width="94" height="22" rx="3"/>
    <text class="dg-fs-sm" x="411" y="115" text-anchor="middle">B · task 1</text>
    <text class="dg-fs-sm dg-muted" x="262" y="140">리더가 준 할당대로 실행</text>
  </g>

  <!-- worker-3 -->
  <g data-dg="worker-3">
    <rect class="dg-node" x="480" y="58" width="216" height="102" rx="4"/>
    <text class="dg-fs-sm dg-bold" x="490" y="76">worker-3</text>
    <text class="dg-fs-sm dg-mono dg-muted" x="490" y="92">REST :8083</text>
    <rect class="dg-node" x="490" y="100" width="94" height="22" rx="3"/>
    <text class="dg-fs-sm" x="537" y="115" text-anchor="middle">A · task 2</text>
    <rect class="dg-node dg-node--alt" x="592" y="100" width="94" height="22" rx="3"/>
    <text class="dg-fs-sm" x="639" y="115" text-anchor="middle">B · task 2</text>
    <text class="dg-fs-sm dg-muted" x="490" y="140">리더가 준 할당대로 실행</text>
  </g>

  <!-- 아래로 내려가는 화살표 -->
  <line class="dg-edge dg-edge--accent" x1="124" y1="172" x2="124" y2="181"/>
  <path class="dg-marker--accent" d="M119,181 L129,181 L124,189 Z"/>
  <line class="dg-edge dg-edge--accent" x1="360" y1="172" x2="360" y2="181"/>
  <path class="dg-marker--accent" d="M355,181 L365,181 L360,189 Z"/>
  <line class="dg-edge dg-edge--accent" x1="596" y1="172" x2="596" y2="181"/>
  <path class="dg-marker--accent" d="M591,181 L601,181 L596,189 Z"/>

  <!-- 내부 토픽 3종 -->
  <rect class="dg-node dg-node--accent" x="12" y="190" width="224" height="58" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="22" y="208">config.storage.topic</text>
  <text class="dg-fs-sm" x="22" y="225">커넥터 · 태스크 설정</text>
  <text class="dg-fs-sm dg-muted" x="22" y="241">파티션 1개 · compact 필수</text>

  <rect class="dg-node dg-node--accent" x="248" y="190" width="224" height="58" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="258" y="208">offset.storage.topic</text>
  <text class="dg-fs-sm" x="258" y="225"><tspan class="dg-bold">소스</tspan> 커넥터 오프셋</text>
  <text class="dg-fs-sm dg-muted" x="258" y="241">기본 25 파티션 · compact</text>

  <rect class="dg-node dg-node--accent" x="484" y="190" width="224" height="58" rx="4"/>
  <text class="dg-fs-sm dg-mono dg-bold" x="494" y="208">status.storage.topic</text>
  <text class="dg-fs-sm" x="494" y="225">커넥터 · 태스크 상태</text>
  <text class="dg-fs-sm dg-muted" x="494" y="241">compact · 상태 API 가 읽음</text>

  <!-- 각주 -->
  <line class="dg-grid" x1="12" y1="262" x2="708" y2="262"/>
  <text class="dg-fs-sm" x="12" y="280"><tspan class="dg-bold">커넥터는 설정, 태스크는 일꾼</tspan>입니다. <tspan class="dg-mono">tasks.max</tspan> (기본 1) 가 태스크 수의 상한이고 실제 수는 커넥터가 정합니다.</text>
  <text class="dg-fs-sm dg-muted" x="12" y="298">싱크 커넥터의 오프셋은 이 세 토픽이 아니라 <tspan class="dg-mono">__consumer_offsets</tspan> 에 저장됩니다 — 비대칭은 D-081 을 보세요.</text>
</svg>
