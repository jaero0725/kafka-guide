<svg viewBox="0 0 720 840" role="img" class="kg-diagram"
     aria-labelledby="d121-title d121-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d121-title">트러블슈팅 결정 트리 — 프로듀서 전송이 실패할 때</title>
  <desc id="d121-desc">프로듀서 전송 실패를 예외 유형에서 출발해 좁혀 가는 결정 트리입니다. 마름모는 판단, 사각형은 조치입니다. RecordTooLargeException 이면 프로듀서 max.request.size 와 브로커·토픽 쪽 상한을 함께 확인합니다. NotEnoughReplicas 계열이면 ISR 이 min.insync.replicas 보다 적은 것이므로 --under-min-isr-partitions 로 확인합니다. TimeoutException 이면 delivery.timeout.ms 예산 안에서 전송을 마치지 못한 것이므로 메타데이터 조회 경로와 브로커 응답 지연을 봅니다. send 호출 자체가 블록되면 buffer.memory 가 고갈되어 max.block.ms 를 기다리는 상황입니다. TOPIC_AUTHORIZATION_FAILED 면 쓰기 권한을, UnknownTopicOrPartitionException 이면 토픽 존재 여부와 auto.create.topics.enable 을 확인합니다. 마지막으로 순서가 어긋나면 멱등성 설정과 max.in.flight.requests.per.connection 을 점검합니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--ok" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--warn" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<text class="dg-fs-md dg-bold" x="8" y="20">프로듀서 전송이 실패한다</text>
<text class="dg-fs-sm dg-muted" x="8" y="40">먼저 예외 유형을 봅니다. 예외 이름이 곧 원인 분류입니다.</text>
<g>
<path class="dg-node dg-node--warn" d="M176,54 L344,96 L176,138 L8,96 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="92" text-anchor="middle">RecordTooLargeException?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="110" text-anchor="middle">kafka-configs.sh --describe</text>
<rect class="dg-node dg-node--danger" x="392" y="66" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="85">크기 상한 불일치</text>
<text class="dg-fs-sm" x="404" y="103">프로듀서 max.request.size(1048576) 와 브로커 message.max.bytes(1048588)</text>
<text class="dg-fs-sm" x="404" y="121">토픽 max.message.bytes 까지 함께 올려야 통과합니다 → D-119</text>
<path class="dg-edge dg-edge--danger" d="M346,96 L388,96" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="90">예</text>
<path class="dg-edge" d="M176,139 L176,158" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="154">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,160 L344,202 L176,244 L8,202 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="198" text-anchor="middle">NotEnoughReplicas 계열?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="216" text-anchor="middle">--describe --under-min-isr-partitions</text>
<rect class="dg-node dg-node--danger" x="392" y="172" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="191">ISR 이 min.insync.replicas 미달</text>
<text class="dg-fs-sm" x="404" y="209">브로커 장애 또는 복제 지연으로 ISR 이 줄어든 상태입니다</text>
<text class="dg-fs-sm" x="404" y="227">ISR 회복을 기다리거나 원인 브로커를 복구합니다 → D-115</text>
<path class="dg-edge dg-edge--danger" d="M346,202 L388,202" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="196">예</text>
<path class="dg-edge" d="M176,245 L176,264" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="260">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,266 L344,308 L176,350 L8,308 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="304" text-anchor="middle">TimeoutException?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="322" text-anchor="middle">브로커 · 네트워크 확인</text>
<rect class="dg-node dg-node--warn" x="392" y="278" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="297">delivery.timeout.ms 예산 초과</text>
<text class="dg-fs-sm" x="404" y="315">메타데이터를 못 받거나 브로커 응답이 늦은 경우입니다</text>
<text class="dg-fs-sm" x="404" y="333">advertised.listeners 오설정도 이 증상으로 나타납니다 → D-101</text>
<path class="dg-edge dg-edge--danger" d="M346,308 L388,308" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="302">예</text>
<path class="dg-edge" d="M176,351 L176,370" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="366">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,372 L344,414 L176,456 L8,414 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="410" text-anchor="middle">send() 가 블록된다?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="428" text-anchor="middle">producer 메트릭 확인</text>
<rect class="dg-node dg-node--warn" x="392" y="384" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="403">buffer.memory 고갈</text>
<text class="dg-fs-sm" x="404" y="421">버퍼가 차면 max.block.ms(기본 60000) 만큼 기다린 뒤 예외입니다</text>
<text class="dg-fs-sm" x="404" y="439">전송 속도 < 생산 속도 — 배치·압축·파티션 분산을 재검토</text>
<path class="dg-edge dg-edge--danger" d="M346,414 L388,414" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="408">예</text>
<path class="dg-edge" d="M176,457 L176,476" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="472">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,478 L344,520 L176,562 L8,520 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="516" text-anchor="middle">TOPIC_AUTHORIZATION_FAILED?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="534" text-anchor="middle">kafka-acls.sh --list --topic T</text>
<rect class="dg-node dg-node--danger" x="392" y="490" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="509">쓰기 권한 없음</text>
<text class="dg-fs-sm" x="404" y="527">토픽 Write 권한이 필요하고 트랜잭션이면 TransactionalId 권한도 필요합니다</text>
<text class="dg-fs-sm" x="404" y="545">멱등 프로듀서는 IdempotentWrite 가 아니라 토픽 Write 로 충분합니다</text>
<path class="dg-edge dg-edge--danger" d="M346,520 L388,520" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="514">예</text>
<path class="dg-edge" d="M176,563 L176,582" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="578">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,584 L344,626 L176,668 L8,626 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="622" text-anchor="middle">UnknownTopicOrPartition?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="640" text-anchor="middle">kafka-topics.sh --list</text>
<rect class="dg-node dg-node--warn" x="392" y="596" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="615">토픽이 없다</text>
<text class="dg-fs-sm" x="404" y="633">auto.create.topics.enable 이 true 여도 첫 전송은 실패할 수 있습니다</text>
<text class="dg-fs-sm" x="404" y="651">토픽을 미리 만들고 파티션 수를 확인합니다</text>
<path class="dg-edge dg-edge--danger" d="M346,626 L388,626" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="620">예</text>
<path class="dg-edge" d="M176,669 L176,688" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="186" y="684">아니오</text>
<g>
<path class="dg-node dg-node--warn" d="M176,690 L344,732 L176,774 L8,732 Z"/>
</g>
<text class="dg-fs-sm dg-bold" x="176" y="728" text-anchor="middle">순서가 어긋난다?</text>
<text class="dg-fs-sm dg-mono dg-muted" x="176" y="746" text-anchor="middle">producer 설정 확인</text>
<rect class="dg-node dg-node--danger" x="392" y="702" width="320" height="60" rx="4"/>
<text class="dg-fs-sm dg-bold" x="404" y="721">재시도로 순서가 뒤집힌 상태</text>
<text class="dg-fs-sm" x="404" y="739">enable.idempotence=false 이고 max.in.flight > 1 이면 순서가 바뀔 수 있습니다</text>
<text class="dg-fs-sm" x="404" y="757">기본값(멱등성 true · max.in.flight 5)을 유지하면 순서가 보장됩니다</text>
<path class="dg-edge dg-edge--danger" d="M346,732 L388,732" marker-end="url(#mk-arrow-danger)"/>
<text class="dg-fs-sm dg-bold" x="366" y="726">예</text>
<line class="dg-grid" x1="8" y1="784" x2="712" y2="784"/>
<text class="dg-fs-sm" x="8" y="804">프로듀서 예외는 재시도 가능(retriable)과 불가능으로 나뉩니다. RecordTooLarge 는 재시도해도 성공하지 않습니다.</text>
<text class="dg-fs-sm" x="8" y="822">콜백 onCompletion() 의 exception 을 반드시 로깅하세요 — 여기서 예외 이름을 못 보면 위 판단을 시작할 수 없습니다.</text>
</svg>
