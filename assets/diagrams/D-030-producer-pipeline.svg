<svg viewBox="0 0 720 418" role="img" class="kg-diagram"
     aria-labelledby="d030-title d030-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d030-title">Producer 전송 파이프라인 — 애플리케이션 스레드와 Sender 스레드의 경계</title>
  <desc id="d030-desc">send() 호출부터 콜백까지의 경로를 두 개의 수평 레인으로 나눈 그림입니다.
    위 레인은 애플리케이션 스레드가 하는 일로, send() 호출, 인터셉터 onSend, 직렬화, 파티션 결정까지입니다.
    가운데 RecordAccumulator 는 파티션별 배치 큐이며 두 스레드가 만나는 지점입니다.
    애플리케이션 스레드는 여기에 레코드를 넣고 곧바로 반환하므로 send() 는 블록되지 않습니다.
    아래 레인은 Sender 스레드(백그라운드 I/O 스레드)가 하는 일로, 배치를 꺼내 ProduceRequest 로 브로커에 보내고
    응답을 받아 onCompletion 콜백을 실행합니다. 콜백은 애플리케이션 스레드가 아니라 Sender 스레드에서 실행됩니다.
    맨 아래 띠는 다른 프로세스인 브로커이며, 리더가 로그에 append 하고 acks 설정에 따라 ISR 복제를 기다립니다.</desc>

  <defs>
    <marker id="d030-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
    <marker id="d030-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker--accent" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
  </defs>

  <text x="8" y="20" class="dg-fs-md dg-bold"><tspan class="dg-mono">send()</tspan> 한 번에 관여하는 스레드는 2개입니다</text>

  <!-- ============ 레인 A : 애플리케이션 스레드 ============ -->
  <rect class="dg-panel" x="8" y="32" width="704" height="86" rx="4"/>
  <text x="18" y="49" class="dg-fs-sm dg-bold">레인 A · 애플리케이션 스레드 (여러분의 코드가 도는 스레드)</text>

  <g>
    <rect class="dg-node" x="66" y="56" width="132" height="48" rx="4"/>
    <text x="76" y="76" class="dg-fs-sm dg-bold dg-mono">send()</text>
    <text x="76" y="94" class="dg-fs-sm">호출 후 즉시 반환</text>
  </g>
  <line class="dg-edge" x1="198" y1="80" x2="218" y2="80" marker-end="url(#d030-ah)"/>
  <g>
    <rect class="dg-node" x="222" y="56" width="132" height="48" rx="4"/>
    <text x="232" y="76" class="dg-fs-sm dg-bold">인터셉터</text>
    <text x="232" y="94" class="dg-fs-sm dg-mono">onSend()</text>
  </g>
  <line class="dg-edge" x1="354" y1="80" x2="374" y2="80" marker-end="url(#d030-ah)"/>
  <g>
    <rect class="dg-node" x="378" y="56" width="132" height="48" rx="4"/>
    <text x="388" y="76" class="dg-fs-sm dg-bold">직렬화</text>
    <text x="388" y="94" class="dg-fs-sm">Serializer 적용</text>
  </g>
  <line class="dg-edge" x1="510" y1="80" x2="530" y2="80" marker-end="url(#d030-ah)"/>
  <g>
    <rect class="dg-node" x="534" y="56" width="132" height="48" rx="4"/>
    <text x="544" y="76" class="dg-fs-sm dg-bold">파티셔너</text>
    <text x="544" y="94" class="dg-fs-sm">파티션 번호 결정</text>
  </g>

  <!-- 넘김 -->
  <line class="dg-edge dg-edge--accent" x1="600" y1="104" x2="600" y2="126" marker-end="url(#d030-ah-accent)"/>

  <!-- ============ 경계 : RecordAccumulator ============ -->
  <rect class="dg-node dg-node--accent" x="66" y="130" width="600" height="56" rx="4"/>
  <text x="78" y="152" class="dg-fs-sm dg-bold"><tspan class="dg-mono">RecordAccumulator</tspan> — 파티션별 배치 큐 (두 스레드가 만나는 유일한 지점)</text>
  <text x="78" y="172" class="dg-fs-sm"><tspan class="dg-mono">batch.size=16384</tspan> 도달 또는 <tspan class="dg-mono">linger.ms=5</tspan> 만료 중 먼저 오는 쪽에 전송</text>
  <text x="8" y="146" class="dg-fs-sm dg-bold">경계</text>
  <text x="8" y="164" class="dg-fs-sm dg-muted">스레드</text>
  <text x="8" y="180" class="dg-fs-sm dg-muted">교체</text>

  <line class="dg-edge dg-edge--accent" x1="132" y1="186" x2="132" y2="212" marker-end="url(#d030-ah-accent)"/>

  <!-- ============ 레인 B : Sender 스레드 ============ -->
  <rect class="dg-panel" x="8" y="192" width="704" height="88" rx="4"/>
  <text x="18" y="209" class="dg-fs-sm dg-bold">레인 B · Sender 스레드 (KafkaProducer 가 내부에 띄우는 백그라운드 I/O 스레드)</text>

  <g>
    <rect class="dg-node dg-node--alt" x="66" y="216" width="132" height="48" rx="4"/>
    <text x="76" y="236" class="dg-fs-sm dg-bold">배치 인출</text>
    <text x="76" y="254" class="dg-fs-sm">전송 조건 충족분</text>
  </g>
  <line class="dg-edge" x1="198" y1="240" x2="218" y2="240" marker-end="url(#d030-ah)"/>
  <g>
    <rect class="dg-node dg-node--alt" x="222" y="216" width="132" height="48" rx="4"/>
    <text x="232" y="236" class="dg-fs-sm dg-bold">요청 전송</text>
    <text x="232" y="254" class="dg-fs-sm dg-mono">ProduceRequest</text>
  </g>
  <line class="dg-edge" x1="354" y1="240" x2="374" y2="240" marker-end="url(#d030-ah)"/>
  <g>
    <rect class="dg-node dg-node--alt" x="378" y="216" width="132" height="48" rx="4"/>
    <text x="388" y="236" class="dg-fs-sm dg-bold">응답 수신</text>
    <text x="388" y="254" class="dg-fs-sm">offset 또는 오류</text>
  </g>
  <line class="dg-edge dg-edge--accent" x1="510" y1="240" x2="530" y2="240" marker-end="url(#d030-ah-accent)"/>
  <g>
    <rect class="dg-node dg-node--accent" x="534" y="216" width="132" height="48" rx="4"/>
    <text x="544" y="236" class="dg-fs-sm dg-bold">콜백 실행</text>
    <text x="544" y="254" class="dg-fs-sm dg-mono">onCompletion()</text>
  </g>

  <!-- 네트워크 왕복 -->
  <path class="dg-edge" d="M288,264 L288,300" marker-end="url(#d030-ah)"/>
  <text x="296" y="288" class="dg-fs-sm dg-muted">요청</text>
  <path class="dg-edge dg-edge--dashed" d="M444,336 L444,264" marker-end="url(#d030-ah)"/>
  <text x="452" y="288" class="dg-fs-sm dg-muted">응답</text>

  <!-- ============ 브로커 ============ -->
  <rect class="dg-node dg-node--alt" x="66" y="300" width="600" height="40" rx="4"/>
  <text x="78" y="325" class="dg-fs-sm dg-bold">브로커 (파티션 리더) — 로그에 append 후 <tspan class="dg-mono">acks</tspan> 설정만큼 ISR 복제를 기다린 뒤 응답</text>
  <text x="8" y="318" class="dg-fs-sm dg-bold">다른</text>
  <text x="8" y="334" class="dg-fs-sm dg-bold">프로세스</text>

  <!-- ============ 정리 ============ -->
  <line class="dg-grid" x1="8" y1="356" x2="712" y2="356"/>
  <text x="8" y="376" class="dg-fs-sm"><tspan class="dg-bold">콜백은 레인 B(Sender 스레드)에서 실행됩니다.</tspan> 애플리케이션 스레드로 돌아오지 않습니다 — 가장 자주 틀립니다.</text>
  <text x="8" y="394" class="dg-fs-sm dg-muted">직렬화 실패처럼 <tspan class="dg-mono">send()</tspan> 안에서 즉시 드러난 오류만 예외적으로 호출 스레드에서 콜백이 실행됩니다.</text>
  <text x="8" y="410" class="dg-fs-sm dg-muted">버퍼 총량은 <tspan class="dg-mono">buffer.memory=33554432</tspan>. 가득 차면 <tspan class="dg-mono">send()</tspan> 가 <tspan class="dg-mono">max.block.ms=60000</tspan> 까지 블록됩니다.</text>
</svg>
