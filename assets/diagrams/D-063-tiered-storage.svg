<svg viewBox="0 0 720 376" role="img" class="kg-diagram"
     aria-labelledby="d063-title d063-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d063-title">Tiered Storage — 로컬 계층과 원격 계층</title>
  <desc id="d063-desc">파티션 로그의 세그먼트 일곱 개를 오래된 것부터 최신 순으로 늘어놓고
    앞의 네 개는 원격 계층, 뒤의 세 개는 로컬 계층에 있는 모습을 그린 그림입니다.
    경계는 local.retention.ms 또는 local.retention.bytes 입니다.
    이 경계를 넘긴 세그먼트는 원격 스토리지로 업로드된 뒤 로컬 디스크에서 삭제되고, 전체 보관 기간은 retention.ms 가 정합니다.
    원격 계층은 S3 나 HDFS 같은 외부 스토리지이며 RemoteStorageManager 구현을 사용자가 지정해야 합니다.
    원격 세그먼트의 메타데이터는 기본 구현에서 내부 토픽 __remote_log_metadata 에 저장됩니다.
    최신 데이터를 따라 읽는 컨슈머는 로컬 디스크와 OS 페이지 캐시에서 읽습니다.
    과거 데이터를 재처리하는 컨슈머는 원격 계층에서 읽습니다.
    브로커 설정 remote.log.storage.system.enable 과 토픽 설정 remote.storage.enable 은 둘 다 기본값이 false 입니다.
    컴팩션 토픽은 Tiered Storage 를 지원하지 않습니다.</desc>

  <text x="12" y="18" class="dg-fs-md dg-bold">Tiered Storage — 오래된 세그먼트를 원격 계층으로 옮깁니다</text>

  <!-- 로그 레인 -->
  <text x="12" y="60" class="dg-fs-sm dg-bold">파티션</text>
  <text x="12" y="77" class="dg-fs-sm dg-mono dg-muted">events-0</text>
  <text x="100" y="42" class="dg-fs-sm dg-muted">오래된 세그먼트</text>
  <text x="700" y="42" class="dg-fs-sm dg-muted" text-anchor="end">최신 · 활성</text>

  <g data-dg="seg-remote-0"><rect class="dg-node dg-node--muted" x="100" y="52" width="84" height="38" rx="3"/><text class="dg-fs-sm" x="142" y="76" text-anchor="middle">S0</text></g>
  <g data-dg="seg-remote-1"><rect class="dg-node dg-node--muted" x="186" y="52" width="84" height="38" rx="3"/><text class="dg-fs-sm" x="228" y="76" text-anchor="middle">S1</text></g>
  <g data-dg="seg-remote-2"><rect class="dg-node dg-node--muted" x="272" y="52" width="84" height="38" rx="3"/><text class="dg-fs-sm" x="314" y="76" text-anchor="middle">S2</text></g>
  <g data-dg="seg-remote-3"><rect class="dg-node dg-node--muted" x="358" y="52" width="84" height="38" rx="3"/><text class="dg-fs-sm" x="400" y="76" text-anchor="middle">S3</text></g>
  <g data-dg="seg-local-0"><rect class="dg-node" x="444" y="52" width="84" height="38" rx="3"/><text class="dg-fs-sm" x="486" y="76" text-anchor="middle">S4</text></g>
  <g data-dg="seg-local-1"><rect class="dg-node" x="530" y="52" width="84" height="38" rx="3"/><text class="dg-fs-sm" x="572" y="76" text-anchor="middle">S5</text></g>
  <g data-dg="seg-local-2"><rect class="dg-node dg-node--accent" x="616" y="52" width="84" height="38" rx="3"/><text class="dg-fs-sm dg-bold" x="658" y="76" text-anchor="middle">S6 활성</text></g>

  <!-- local.retention 경계 -->
  <line class="dg-edge dg-edge--accent dg-edge--dashed" x1="444" y1="44" x2="444" y2="182"/>
  <text class="dg-fs-sm dg-bold" x="440" y="106" text-anchor="end">local.retention 경계 →</text>

  <!-- 계층 박스 -->
  <rect class="dg-node dg-node--alt" x="100" y="114" width="342" height="68" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="110" y="132">원격 계층 — S3 · HDFS 등 외부 스토리지</text>
  <text class="dg-fs-sm" x="110" y="150"><tspan class="dg-mono">RemoteStorageManager</tspan> 구현을 지정해야 합니다</text>
  <text class="dg-fs-sm" x="110" y="168">메타데이터 기본 저장소: <tspan class="dg-mono">__remote_log_metadata</tspan></text>

  <rect class="dg-node dg-node--accent" x="452" y="114" width="256" height="68" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="462" y="132">로컬 계층 — 브로커 디스크</text>
  <text class="dg-fs-sm" x="462" y="150">활성 세그먼트 + 최근 세그먼트</text>
  <text class="dg-fs-sm" x="462" y="168">OS 페이지 캐시로 빠른 tail read</text>

  <!-- 컨슈머 읽기 경로 -->
  <line class="dg-edge" x1="271" y1="212" x2="271" y2="185"/>
  <path class="dg-marker" d="M266,185 L276,185 L271,177 Z"/>
  <rect class="dg-node" x="100" y="212" width="342" height="46" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="110" y="230">과거 재처리 컨슈머 (backfill)</text>
  <text class="dg-fs-sm dg-muted" x="110" y="248">원격에서 가져오므로 지연이 큽니다</text>

  <line class="dg-edge dg-edge--accent" x1="580" y1="212" x2="580" y2="185"/>
  <path class="dg-marker--accent" d="M575,185 L585,185 L580,177 Z"/>
  <rect class="dg-node dg-node--accent" x="452" y="212" width="256" height="46" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="462" y="230">실시간 컨슈머 (tail read)</text>
  <text class="dg-fs-sm dg-muted" x="462" y="248">거의 항상 로컬·캐시에서 처리</text>

  <!-- 설정 -->
  <rect class="dg-node dg-node--alt" x="12" y="270" width="696" height="78" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="22" y="288">기본값 — 켜지 않으면 동작하지 않습니다</text>
  <text class="dg-fs-sm dg-mono" x="22" y="306">remote.log.storage.system.enable = false</text>
  <text class="dg-fs-sm dg-muted" x="360" y="306">브로커 전체 스위치</text>
  <text class="dg-fs-sm dg-mono" x="22" y="324">remote.storage.enable = false</text>
  <text class="dg-fs-sm dg-muted" x="360" y="324">토픽별 스위치</text>
  <text class="dg-fs-sm dg-mono" x="22" y="342">local.retention.ms = -2</text>
  <text class="dg-fs-sm dg-muted" x="360" y="342">−2 는 retention.ms 값을 그대로 씁니다</text>

  <!-- 각주 -->
  <text class="dg-fs-sm dg-muted" x="12" y="368">제약: <tspan class="dg-bold">컴팩션 토픽은 지원하지 않습니다.</tspan> 브로커 레벨을 끄기 전에 모든 토픽에서 먼저 해제해야 합니다.</text>
</svg>
