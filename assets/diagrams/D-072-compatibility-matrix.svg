<svg viewBox="0 0 720 440" role="img" class="kg-diagram"
     aria-labelledby="d072-title d072-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d072-title">스키마 호환성 모드 매트릭스 — 변경 유형별 허용·거부</title>
  <desc id="d072-desc">가로는 스키마 변경 유형 일곱 가지, 세로는 호환성 모드 일곱 가지인 표입니다.
    변경 유형은 기본값 있는 필드 추가, 기본값 없는 필드 추가, 기본값 있던 필드 삭제, 기본값 없던 필드 삭제,
    타입 확대 int 에서 long, 타입 축소 long 에서 int, 별칭 없는 필드 이름 변경입니다.
    호환성 모드는 BACKWARD, BACKWARD_TRANSITIVE, FORWARD, FORWARD_TRANSITIVE, FULL, FULL_TRANSITIVE, NONE 입니다.
    BACKWARD 는 새 스키마가 이전 스키마로 쓰인 데이터를 읽을 수 있는지 검사하고,
    FORWARD 는 새 스키마로 쓴 데이터를 이전 스키마가 읽을 수 있는지 검사하며, FULL 은 둘 다 검사합니다.
    TRANSITIVE 가 붙으면 직전 버전만이 아니라 모든 이전 버전과 비교합니다.
    BACKWARD 에서는 기본값 있는 필드 추가, 필드 삭제, 타입 확대가 허용되고
    기본값 없는 필드 추가, 타입 축소, 이름 변경은 거부됩니다.
    FORWARD 에서는 필드 추가와 기본값 있던 필드 삭제, 타입 축소가 허용되고
    기본값 없던 필드 삭제, 타입 확대, 이름 변경은 거부됩니다.
    FULL 은 양쪽 모두 허용인 경우만 허용하므로 기본값 있는 필드 추가와 기본값 있던 필드 삭제만 통과합니다.
    NONE 은 검사를 하지 않으므로 모두 통과하지만 깨진 조합도 등록됩니다.
    이 표는 이전 버전이 하나인 v1 에서 v2 로의 변경을 기준으로 하므로 TRANSITIVE 열의 판정이 같습니다.
    컨트롤에서 변경 유형과 호환성 모드를 고르면 그 칸이 강조되고 판정 이유가 표시됩니다.</desc>

  <text x="12" y="18" class="dg-fs-md dg-bold">스키마 호환성 매트릭스 — 이 변경을 이 모드에서 등록할 수 있는가</text>
  <text x="12" y="36" class="dg-fs-sm">이 표는 <tspan class="dg-bold">v1 → v2 (이전 버전이 1개)</tspan> 기준입니다. TRANSITIVE 는 판정 규칙이 아니라 <tspan class="dg-bold">비교 대상 버전 범위</tspan>가 다릅니다.</text>

