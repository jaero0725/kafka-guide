<svg viewBox="0 0 720 426" role="img" class="kg-diagram"
     aria-labelledby="d010-title d010-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d010-title">KRaft 클러스터 전체 구조 — 컨트롤러 쿼럼, 브로커 3대, 클라이언트</title>
  <desc id="d010-desc">위쪽은 컨트롤러 쿼럼입니다. controller 롤로 실행되는 노드 3대 가운데 하나가 액티브 컨트롤러이자 Raft 리더이고 나머지 둘은 팔로워이며, 메타데이터는 __cluster_metadata 내부 로그에 Raft 로 복제됩니다. 운영에서는 3대 또는 5대를 권장합니다. 가운데는 브로커 3대이며 토픽 orders 의 파티션 3개가 replication.factor 3 으로 배치되어 각 브로커가 하나의 리더와 두 개의 팔로워를 갖습니다. 브로커는 컨트롤러에서 메타데이터를 받아 가고, 쓰기와 읽기는 파티션 리더가 처리합니다. 아래쪽 프로듀서는 bootstrap.servers 로 접속해 메타데이터를 조회한 뒤 파티션 리더에 직접 전송하고, 컨슈머 그룹은 리더에서 fetch 하며 오프셋을 __consumer_offsets 에 커밋합니다. 클라이언트는 컨트롤러에 접속하지 않고 항상 브로커에 붙으며 ZooKeeper 는 4.0 에서 제거되었습니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--ok" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--warn" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--muted" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<text class="dg-fs-md dg-bold" x="8" y="20">KRaft 클러스터 전체 구조 — 컨트롤러 쿼럼 · 브로커 · 클라이언트</text>
<rect class="dg-panel" x="8" y="32" width="704" height="96" rx="4"/>
<text class="dg-fs-sm dg-bold" x="18" y="49">컨트롤러 쿼럼 (process.roles=controller) — 권장 3대 또는 5대</text>
<g>
<rect class="dg-node dg-node--accent" x="24" y="56" width="212" height="44" rx="4"/>
<text class="dg-fs-sm" x="130" y="74.5" text-anchor="middle">controller-1</text>
<text class="dg-fs-sm" x="130" y="90.5" text-anchor="middle">액티브 (Raft 리더)</text>
</g>
<g>
<rect class="dg-node" x="252" y="56" width="212" height="44" rx="4"/>
<text class="dg-fs-sm" x="358" y="74.5" text-anchor="middle">controller-2</text>
<text class="dg-fs-sm" x="358" y="90.5" text-anchor="middle">팔로워</text>
</g>
<g>
<rect class="dg-node" x="480" y="56" width="212" height="44" rx="4"/>
<text class="dg-fs-sm" x="586" y="74.5" text-anchor="middle">controller-3</text>
<text class="dg-fs-sm" x="586" y="90.5" text-anchor="middle">팔로워</text>
</g>
<text class="dg-fs-sm" x="24" y="118">메타데이터는 __cluster_metadata 라는 내부 로그에 Raft 로 복제됩니다.</text>
<path class="dg-edge dg-edge--dashed" d="M300,149 L300,133" marker-end="url(#mk-arrow)"/>
<text class="dg-fs-sm" x="312" y="146">브로커는 컨트롤러에서 메타데이터를 받아 갑니다 (옵서버)</text>
<rect class="dg-panel" x="8" y="154" width="704" height="122" rx="4"/>
<text class="dg-fs-sm dg-bold" x="18" y="171">브로커 (process.roles=broker) — 토픽 orders · 파티션 3개 · replication.factor 3</text>
<g>
<rect class="dg-node dg-node--alt" x="24" y="178" width="212" height="26" rx="4"/>
<text class="dg-fs-sm" x="130" y="195.6" text-anchor="middle">broker-1</text>
</g>
