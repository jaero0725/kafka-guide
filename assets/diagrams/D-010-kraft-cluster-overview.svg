<text class="dg-fs-sm" x="540" y="345.6" text-anchor="middle">리더에서 fetch · 오프셋은</text>
<text class="dg-fs-sm" x="540" y="361.6" text-anchor="middle">__consumer_offsets 에 커밋</text>
