<text class="dg-fs-sm" x="128" y="244.6" text-anchor="middle">팔로워</text>
</g>
<g>
<rect class="dg-node" x="166" y="210" width="66" height="44" rx="4"/>
<text class="dg-fs-sm" x="199" y="228.6" text-anchor="middle">P2</text>
<text class="dg-fs-sm" x="199" y="244.6" text-anchor="middle">팔로워</text>
</g>
<g>
<rect class="dg-node dg-node--alt" x="252" y="178" width="212" height="26" rx="4"/>
<text class="dg-fs-sm" x="358" y="195.6" text-anchor="middle">broker-2</text>
</g>
<g>
<rect class="dg-node dg-node--ok" x="252" y="210" width="66" height="44" rx="4"/>
<text class="dg-fs-sm" x="285" y="228.6" text-anchor="middle">P1</text>
<text class="dg-fs-sm" x="285" y="244.6" text-anchor="middle">리더</text>
</g>
<g>
<rect class="dg-node" x="323" y="210" width="66" height="44" rx="4"/>
<text class="dg-fs-sm" x="356" y="228.6" text-anchor="middle">P2</text>
<text class="dg-fs-sm" x="356" y="244.6" text-anchor="middle">팔로워</text>
</g>
<g>
