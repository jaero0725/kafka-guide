<text class="dg-fs-sm" x="584" y="228.6" text-anchor="middle">P0</text>
<text class="dg-fs-sm" x="584" y="244.6" text-anchor="middle">팔로워</text>
</g>
<g>
<rect class="dg-node" x="622" y="210" width="66" height="44" rx="4"/>
<text class="dg-fs-sm" x="655" y="228.6" text-anchor="middle">P1</text>
<text class="dg-fs-sm" x="655" y="244.6" text-anchor="middle">팔로워</text>
</g>
<g>
<rect class="dg-node dg-node--accent" x="60" y="310" width="240" height="62" rx="4"/>
<text class="dg-fs-sm" x="180" y="329.6" text-anchor="middle">Producer</text>
<text class="dg-fs-sm" x="180" y="345.6" text-anchor="middle">bootstrap.servers 로 접속 → 메타데이터 조회</text>
<text class="dg-fs-sm" x="180" y="361.6" text-anchor="middle">→ 파티션 리더에 직접 전송</text>
</g>
