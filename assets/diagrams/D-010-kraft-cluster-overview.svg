<text class="dg-fs-sm" x="427" y="228.6" text-anchor="middle">P0</text>
<text class="dg-fs-sm" x="427" y="244.6" text-anchor="middle">팔로워</text>
</g>
<g>
<rect class="dg-node dg-node--alt" x="480" y="178" width="212" height="26" rx="4"/>
<text class="dg-fs-sm" x="586" y="195.6" text-anchor="middle">broker-3</text>
</g>
<g>
<rect class="dg-node dg-node--ok" x="480" y="210" width="66" height="44" rx="4"/>
