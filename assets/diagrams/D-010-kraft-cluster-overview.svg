<text class="dg-fs-sm" x="8" y="394">초록색 = 파티션 리더. 쓰기와 읽기는 항상 리더가 처리하고 팔로워는 복제만 합니다.</text>
<text class="dg-fs-sm dg-bold" x="8" y="414">클라이언트는 컨트롤러에 접속하지 않습니다 — 항상 브로커에 붙습니다. ZooKeeper 는 4.0 에서 제거되었습니다.</text>
