<rect class="dg-node dg-node--done" x="130" y="130" width="32" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="146" y="147.5" text-anchor="middle">4</text>
<rect class="dg-node dg-node--done" x="162" y="130" width="32" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="178" y="147.5" text-anchor="middle">5</text>
<g>
<rect class="dg-node" x="252" y="56" width="212" height="40" rx="4"/>
<text class="dg-fs-sm" x="358" y="72.5" text-anchor="middle">controller-2</text>
<text class="dg-fs-sm" x="358" y="88.5" text-anchor="middle">팔로워 (voter)</text>
</g>
<rect class="dg-node dg-node--alt" x="252" y="104" width="212" height="62" rx="4"/>
<text class="dg-fs-sm dg-bold dg-mono" x="262" y="122">__cluster_metadata-0</text>
<rect class="dg-node dg-node--done" x="262" y="130" width="32" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="278" y="147.5" text-anchor="middle">1</text>
<rect class="dg-node dg-node--done" x="294" y="130" width="32" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="310" y="147.5" text-anchor="middle">2</text>
<rect class="dg-node dg-node--done" x="326" y="130" width="32" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="342" y="147.5" text-anchor="middle">3</text>
<rect class="dg-node dg-node--done" x="358" y="130" width="32" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="374" y="147.5" text-anchor="middle">4</text>
<rect class="dg-node dg-node--done" x="390" y="130" width="32" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="406" y="147.5" text-anchor="middle">5</text>
<g>
<rect class="dg-node" x="480" y="56" width="212" height="40" rx="4"/>
<text class="dg-fs-sm" x="586" y="72.5" text-anchor="middle">controller-3</text>
<text class="dg-fs-sm" x="586" y="88.5" text-anchor="middle">팔로워 (voter)</text>
</g>
<rect class="dg-node dg-node--alt" x="480" y="104" width="212" height="62" rx="4"/>
<text class="dg-fs-sm dg-bold dg-mono" x="490" y="122">__cluster_metadata-0</text>
<rect class="dg-node dg-node--done" x="490" y="130" width="32" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="506" y="147.5" text-anchor="middle">1</text>
<rect class="dg-node dg-node--done" x="522" y="130" width="32" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="538" y="147.5" text-anchor="middle">2</text>
<rect class="dg-node dg-node--done" x="554" y="130" width="32" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="570" y="147.5" text-anchor="middle">3</text>
<rect class="dg-node dg-node--done" x="586" y="130" width="32" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="602" y="147.5" text-anchor="middle">4</text>
<rect class="dg-node" x="618" y="130" width="32" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="634" y="147.5" text-anchor="middle">5</text>
<path class="dg-edge dg-edge--accent" d="M236,132 L248,132" marker-end="url(#mk-arrow-accent)"/>
<path class="dg-edge dg-edge--accent" d="M464,132 L476,132" marker-end="url(#mk-arrow-accent)"/>
<text class="dg-fs-sm" x="24" y="194">쓰기는 항상 액티브 컨트롤러가 하고, 팔로워는 그 로그를 복제합니다 (Raft). 레코드는 과반 복제되면 커밋됩니다.</text>
<g>
<rect class="dg-node" x="8" y="224" width="344" height="84" rx="4"/>
<text class="dg-fs-sm" x="20" y="246.6" text-anchor="start">스냅샷</text>
<text class="dg-fs-sm" x="20" y="262.6" text-anchor="start">로그가 계속 길어지지 않도록 상태를 스냅샷으로 저장하고</text>
<text class="dg-fs-sm" x="20" y="278.6" text-anchor="start">앞부분을 잘라냅니다. 재시작 시 스냅샷 + 이후 로그만</text>
<text class="dg-fs-sm" x="20" y="294.6" text-anchor="start">재생하면 되므로 복구가 빠릅니다.</text>
</g>
<g>
<rect class="dg-node dg-node--ok" x="368" y="224" width="344" height="84" rx="4"/>
<text class="dg-fs-sm" x="380" y="246.6" text-anchor="start">브로커 = 옵서버 (voter 아님)</text>
<text class="dg-fs-sm" x="380" y="262.6" text-anchor="start">브로커는 쿼럼 투표에 참여하지 않고 메타데이터 로그만</text>
<text class="dg-fs-sm" x="380" y="278.6" text-anchor="start">복제해 캐시합니다. 그래서 컨트롤러가 잠시 멈춰도</text>
<text class="dg-fs-sm" x="380" y="294.6" text-anchor="start">이미 아는 메타데이터로 계속 동작합니다.</text>
</g>
<text class="dg-fs-sm dg-bold" x="8" y="334">쿼럼 크기는 3 또는 5 를 권장합니다 — 3대면 1대 장애, 5대면 2대 장애까지 견딥니다.</text>
<text class="dg-fs-sm" x="8" y="354">주소는 controller.quorum.bootstrap.servers 로 지정합니다 — controller.quorum.voters 는 deprecated 입니다.</text>
<text class="dg-fs-sm dg-bold" x="8" y="374">상태 확인</text>
<text class="dg-fs-sm dg-mono dg-muted" x="76" y="374">kafka-metadata-quorum.sh --bootstrap-controller :9093 describe --status</text>
</svg>
