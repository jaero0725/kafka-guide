<svg viewBox="0 0 720 318" role="img" class="kg-diagram"
     aria-labelledby="d084-title d084-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d084-title">Connect 태스크 재분배 — 워커 이탈과 지연 리밸런스</title>
  <desc id="d084-desc">워커 세 대에 태스크 여섯 개가 나뉘어 있던 Connect 클러스터에서
    워커 한 대가 빠졌을 때 무슨 일이 일어나는지 세 단계로 보여줍니다.
    첫 단계는 정상 상태로 worker-1 이 A0 과 B0, worker-2 가 A1 과 B1, worker-3 이 A2 와 B2 를 실행합니다.
    두 번째 단계는 worker-3 이 빠진 직후입니다.
    Connect 는 즉시 재할당하지 않고 scheduled.rebalance.max.delay.ms 기본값 300000 밀리초, 즉 5분을 기다립니다.
    이 시간 안에 worker-3 이 돌아오면 원래 태스크를 그대로 되돌려 받습니다.
    대신 그동안 A2 와 B2 는 아무도 실행하지 않는 상태로 남습니다.
    세 번째 단계는 대기 시간이 지나도 돌아오지 않은 경우입니다.
    A2 와 B2 가 남은 두 워커로 재할당됩니다.
    증분 협력 리밸런싱이 기본이므로 이미 잘 돌고 있는 A0, B0, A1, B1 은 멈추지 않습니다.</desc>

  <text x="12" y="18" class="dg-fs-md dg-bold">태스크 재분배 — 워커가 빠지면 바로 옮기지 않습니다</text>

  <!-- ===== ① 정상 ===== -->
  <rect class="dg-node dg-node--alt" x="12" y="30" width="224" height="24" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="22" y="47">① 정상 — 태스크 6개 / 워커 3대</text>

  <rect class="dg-node" x="12" y="64" width="224" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="22" y="80">worker-1</text>
  <rect class="dg-node dg-node--ok" x="22" y="86" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="53" y="99" text-anchor="middle">A0</text>
  <rect class="dg-node dg-node--ok" x="93" y="86" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="124" y="99" text-anchor="middle">B0</text>

  <rect class="dg-node" x="12" y="112" width="224" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="22" y="128">worker-2</text>
  <rect class="dg-node dg-node--ok" x="22" y="134" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="53" y="147" text-anchor="middle">A1</text>
  <rect class="dg-node dg-node--ok" x="93" y="134" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="124" y="147" text-anchor="middle">B1</text>

  <rect class="dg-node" x="12" y="160" width="224" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="22" y="176">worker-3</text>
  <rect class="dg-node dg-node--ok" x="22" y="182" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="53" y="195" text-anchor="middle">A2</text>
  <rect class="dg-node dg-node--ok" x="93" y="182" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="124" y="195" text-anchor="middle">B2</text>

  <!-- ===== ② 이탈 직후 ===== -->
  <rect class="dg-node dg-node--warn" x="248" y="30" width="224" height="24" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="258" y="47">② worker-3 이탈 → 대기</text>

  <rect class="dg-node" x="248" y="64" width="224" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="258" y="80">worker-1 <tspan class="dg-muted">그대로 실행</tspan></text>
  <rect class="dg-node dg-node--ok" x="258" y="86" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="289" y="99" text-anchor="middle">A0</text>
  <rect class="dg-node dg-node--ok" x="329" y="86" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="360" y="99" text-anchor="middle">B0</text>

  <rect class="dg-node" x="248" y="112" width="224" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="258" y="128">worker-2 <tspan class="dg-muted">그대로 실행</tspan></text>
  <rect class="dg-node dg-node--ok" x="258" y="134" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="289" y="147" text-anchor="middle">A1</text>
  <rect class="dg-node dg-node--ok" x="329" y="134" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="360" y="147" text-anchor="middle">B1</text>

  <rect class="dg-node dg-node--danger" x="248" y="160" width="224" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="258" y="176">worker-3 이탈</text>
  <rect class="dg-node--empty" x="258" y="182" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm dg-muted" x="289" y="195" text-anchor="middle">A2 ?</text>
  <rect class="dg-node--empty" x="329" y="182" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm dg-muted" x="360" y="195" text-anchor="middle">B2 ?</text>
  <g data-dg="x-worker3">
    <line class="dg-x" x1="440" y1="168" x2="456" y2="184"/>
    <line class="dg-x" x1="456" y1="168" x2="440" y2="184"/>
  </g>

  <!-- ===== ③ 재할당 ===== -->
  <rect class="dg-node dg-node--accent" x="484" y="30" width="224" height="24" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="494" y="47">③ 대기 시간 경과 → 재할당</text>

  <rect class="dg-node" x="484" y="64" width="224" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="494" y="80">worker-1</text>
  <rect class="dg-node dg-node--ok" x="494" y="86" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="525" y="99" text-anchor="middle">A0</text>
  <rect class="dg-node dg-node--ok" x="565" y="86" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="596" y="99" text-anchor="middle">B0</text>
  <rect class="dg-node dg-node--accent" x="636" y="86" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm dg-bold" x="667" y="99" text-anchor="middle">A2</text>

  <rect class="dg-node" x="484" y="112" width="224" height="44" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="494" y="128">worker-2</text>
  <rect class="dg-node dg-node--ok" x="494" y="134" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="525" y="147" text-anchor="middle">A1</text>
  <rect class="dg-node dg-node--ok" x="565" y="134" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm" x="596" y="147" text-anchor="middle">B1</text>
  <rect class="dg-node dg-node--accent" x="636" y="134" width="62" height="18" rx="3"/>
  <text class="dg-fs-sm dg-bold" x="667" y="147" text-anchor="middle">B2</text>

  <rect class="dg-node--empty" x="484" y="160" width="224" height="44" rx="4"/>
  <text class="dg-fs-sm dg-muted" x="494" y="176">worker-3 없음</text>
  <text class="dg-fs-sm dg-bold" x="494" y="196">새 워커가 들어오면 다시 리밸런스</text>

  <!-- 설명 -->
  <rect class="dg-node dg-node--warn" x="12" y="216" width="696" height="56" rx="4"/>
  <text class="dg-fs-sm dg-bold" x="22" y="234">왜 바로 옮기지 않는가 — <tspan class="dg-mono">scheduled.rebalance.max.delay.ms</tspan> 기본 300000 (5분)</text>
  <text class="dg-fs-sm" x="22" y="252">이 시간 안에 worker-3 이 돌아오면 <tspan class="dg-bold">원래 태스크를 그대로 되돌려 받습니다</tspan> (재시작·재복구 비용 절약).</text>
  <text class="dg-fs-sm" x="22" y="268">대신 그동안 A2 · B2 는 <tspan class="dg-bold">아무도 실행하지 않습니다</tspan> — 롤링 재시작 때 지연이 보이는 이유입니다.</text>

  <!-- 각주 -->
  <line class="dg-grid" x1="12" y1="284" x2="708" y2="284"/>
  <text class="dg-fs-sm" x="12" y="302">기본은 <tspan class="dg-bold">증분 협력 리밸런싱</tspan>입니다. 영향받지 않는 A0·B0·A1·B1 은 멈추지 않습니다 (A = 소스 커넥터, B = 싱크 커넥터).</text>
  <text class="dg-fs-sm dg-muted" x="12" y="316">2.3 이전의 <tspan class="dg-mono">eager</tspan> 프로토콜은 리밸런스마다 모든 태스크를 멈췄습니다.</text>
</svg>
