<text class="dg-fs-sm" x="44" y="438">enable.idempotence=true 는 acks=all · retries 0 초과 · max.in.flight ≤ 5 를 요구합니다</text>
<rect class="dg-panel" x="30" y="468" width="682" height="132" rx="4"/>
