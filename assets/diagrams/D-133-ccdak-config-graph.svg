<text class="dg-fs-sm" x="44" y="592">buffer.memory 가 차면 send() 가 max.block.ms(기본 60000) 만큼 블록된 뒤 예외를 던집니다</text>
<rect class="dg-panel" x="30" y="622" width="682" height="202" rx="4"/>
