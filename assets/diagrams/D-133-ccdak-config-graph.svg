<rect class="dg-node dg-node--ok" x="386.7" y="116" width="140" height="54" rx="4"/>
<text class="dg-fs-sm dg-bold dg-mono" x="456.7" y="133" text-anchor="middle">replication.</text>
<text class="dg-fs-sm dg-bold dg-mono" x="456.7" y="148" text-anchor="middle">factor</text>
<text class="dg-fs-sm dg-muted" x="456.7" y="162" text-anchor="middle">● 기본 생성 시 지정</text>
</g>
<g data-dg="n-unclean-leader-election-enable" data-n="unclean.leader.election.enable" data-o="브로커 · 토픽" data-v="false">
<rect class="dg-node dg-node--warn" x="558" y="116" width="140" height="54" rx="4"/>
<text class="dg-fs-sm dg-bold dg-mono" x="628" y="133" text-anchor="middle">unclean.leader.</text>
<text class="dg-fs-sm dg-bold dg-mono" x="628" y="148" text-anchor="middle">election.enable</text>
<text class="dg-fs-sm dg-muted" x="628" y="162" text-anchor="middle">■ 기본 false</text>
</g>
<text class="dg-fs-sm" x="44" y="198">acks=all 일 때만 min.insync.replicas 를 검사 — ISR 이 부족하면 NotEnoughReplicas 로 거부됩니다</text>
<text class="dg-fs-sm" x="44" y="214">min.insync.replicas ≤ replication.factor · 권장 RF 3 + min.insync 2 · unclean=true 면 이 보장이 깨집니다</text>
<rect class="dg-panel" x="30" y="244" width="682" height="202" rx="4"/>
<text class="dg-fs-sm dg-bold" x="40" y="261">2. 재시도 예산 — 언제까지 다시 보내는가</text>
