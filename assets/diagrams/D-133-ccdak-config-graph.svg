<svg viewBox="0 0 720 1020" role="img" class="kg-diagram"
     aria-labelledby="d133-title d133-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d133-title">CCDAK 설정값 관계도 — 내구성 · 재시도 · 배치 · 메시지 크기 · 컨슈머 생존 5개 클러스터</title>
  <desc id="d133-desc">프로듀서 · 브로커 · 토픽 · 컨슈머 설정 23개를 다섯 묶음으로 나누고, 공식 문서에 명시된 의존 관계만 화살표로 이은 관계도입니다. 소속은 색과 기호로 구분하며 세모는 프로듀서, 네모는 브로커, 동그라미는 토픽, 마름모는 컨슈머입니다. 내구성 묶음에서는 acks=all 일 때만 min.insync.replicas 를 검사하고, min.insync.replicas 는 replication.factor 이하여야 하며, unclean.leader.election.enable 이 true 면 ISR 밖 레플리카가 리더가 되어 그 보장이 깨집니다. 재시도 예산 묶음에서는 delivery.timeout.ms 가 request.timeout.ms 와 linger.ms 의 합 이상이어야 하고, enable.idempotence 는 acks=all 과 max.in.flight 5 이하를 요구합니다. 배치 묶음에서는 batch.size 도달과 linger.ms 만료 중 먼저 오는 쪽에 전송하며 압축은 배치 단위입니다. 메시지 크기 묶음에서는 max.request.size 와 message.max.bytes(토픽 max.message.bytes 가 덮어씀) 두 계열만 하드 상한이고 fetch 쪽 세 설정은 첫 배치가 더 커도 반환해 진행을 보장합니다. 컨슈머 생존 묶음에서는 하트비트 축과 poll 축이 서로 달라 처리가 길어지면 max.poll.interval.ms 쪽이 먼저 터집니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--muted" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<text class="dg-fs-md dg-bold" x="8" y="18">CCDAK 설정값 관계도 — 실제로 서로를 제약하는 설정만 이었습니다</text>
<rect class="dg-node dg-node--accent" x="8" y="30" width="16" height="12" rx="3"/>
<text class="dg-fs-sm" x="30" y="41">▲ 프로듀서</text>
<rect class="dg-node dg-node--warn" x="126" y="30" width="16" height="12" rx="3"/>
<text class="dg-fs-sm" x="148" y="41">■ 브로커</text>
<rect class="dg-node dg-node--ok" x="244" y="30" width="16" height="12" rx="3"/>
<text class="dg-fs-sm" x="266" y="41">● 토픽</text>
<rect class="dg-node dg-node--alt" x="362" y="30" width="16" height="12" rx="3"/>
<text class="dg-fs-sm" x="384" y="41">◆ 컨슈머</text>
<text class="dg-fs-sm dg-muted" x="462" y="41">노드를 클릭하면 연결된 설정만 남습니다</text>
<text class="dg-fs-sm" x="8" y="60">⇒ 필요 조건      ≤ ≥ 값 상한 · 하한      ⊂ 예산 · 용량에 포함      ⊕ 둘 중 먼저 오는 쪽</text>
<text class="dg-fs-sm" x="8" y="78">⊳ 토픽이 브로커 값을 덮어씀      ⊗ 한 번에 처리할 양      ⨯ 보장을 무력화(위험)      ∥ 직접 의존 없음</text>
<rect class="dg-panel" x="30" y="90" width="682" height="132" rx="4"/>
<text class="dg-fs-sm dg-bold" x="40" y="107">1. 내구성 — 데이터를 잃지 않으려면</text>
<g data-dg="n-acks" data-n="acks" data-o="프로듀서" data-v="all">
<rect class="dg-node dg-node--accent" x="44" y="116" width="140" height="54" rx="4"/>
<text class="dg-fs-sm dg-bold dg-mono" x="114" y="140" text-anchor="middle">acks</text>
<text class="dg-fs-sm dg-muted" x="114" y="162" text-anchor="middle">▲ 기본 all</text>
</g>
