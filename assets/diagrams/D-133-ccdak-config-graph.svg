<text class="dg-fs-sm dg-bold dg-mono" x="285.3" y="148" text-anchor="middle">replicas</text>
<text class="dg-fs-sm dg-muted" x="285.3" y="162" text-anchor="middle">■ 기본 1</text>
</g>
