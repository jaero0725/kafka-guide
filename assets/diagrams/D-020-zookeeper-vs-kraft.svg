<svg viewBox="0 0 720 380" role="img" class="kg-diagram"
     aria-labelledby="d020-title d020-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d020-title">ZooKeeper 모드와 KRaft 모드 비교 — Kafka 2.x 와 4.x 아키텍처</title>
  <desc id="d020-desc">왼쪽 Kafka 2.x 는 ZooKeeper 앙상블과 브로커라는 두 종류의 프로세스를 운영하며 메타데이터는 ZooKeeper znode 에 저장됩니다. 브로커 중 한 대가 컨트롤러를 겸하고 일부 CLI 가 --zookeeper 옵션을 사용하며 메타데이터 변경은 znode watch 로 전파됩니다. 오른쪽 Kafka 4.x 는 KRaft 전용으로 프로세스가 한 종류이며 롤만 다릅니다. controller 롤 노드들이 Raft 로 합의해 메타데이터를 __cluster_metadata 내부 로그에 저장하고 브로커는 그 로그를 복제해 캐시합니다. --zookeeper 옵션은 제거되었습니다. 맨 아래 경고는 ZooKeeper 지원이 4.0 에서 제거되었고 마지막 브리지 릴리스가 3.9 이므로 ZooKeeper 를 쓰는 클러스터는 3.9 에서 KRaft 로 먼저 마이그레이션해야 4.x 로 올릴 수 있다는 내용입니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--ok" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--warn" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--muted" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<text class="dg-fs-md dg-bold" x="8" y="20">ZooKeeper 모드(2.x)와 KRaft 모드(4.x) 비교</text>
<rect class="dg-panel" x="8" y="32" width="348" height="246" rx="4"/>
<text class="dg-fs-sm dg-bold" x="18" y="49">Kafka 2.x — 메타데이터는 ZooKeeper znode</text>
<g>
<rect class="dg-node dg-node--muted" x="24" y="52" width="96" height="44" rx="4"/>
<text class="dg-fs-sm" x="72" y="70.5" text-anchor="middle">ZooKeeper</text>
<text class="dg-fs-sm" x="72" y="86.5" text-anchor="middle">zk-1</text>
</g>
<path class="dg-edge dg-edge--dashed" d="M72,126 L72,100" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--muted" x="132" y="52" width="96" height="44" rx="4"/>
<text class="dg-fs-sm" x="180" y="70.5" text-anchor="middle">ZooKeeper</text>
<text class="dg-fs-sm" x="180" y="86.5" text-anchor="middle">zk-2</text>
</g>
<path class="dg-edge dg-edge--dashed" d="M180,126 L180,100" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--muted" x="240" y="52" width="96" height="44" rx="4"/>
<text class="dg-fs-sm" x="288" y="70.5" text-anchor="middle">ZooKeeper</text>
<text class="dg-fs-sm" x="288" y="86.5" text-anchor="middle">zk-3</text>
</g>
<path class="dg-edge dg-edge--dashed" d="M288,126 L288,100" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node dg-node--warn" x="24" y="128" width="96" height="52" rx="4"/>
<text class="dg-fs-sm" x="72" y="150.6" text-anchor="middle">broker-1</text>
<text class="dg-fs-sm" x="72" y="166.6" text-anchor="middle">컨트롤러</text>
</g>
<g>
<rect class="dg-node" x="132" y="128" width="96" height="52" rx="4"/>
<text class="dg-fs-sm" x="180" y="150.6" text-anchor="middle">broker-2</text>
<text class="dg-fs-sm" x="180" y="166.6" text-anchor="middle">일반</text>
</g>
<g>
<rect class="dg-node" x="240" y="128" width="96" height="52" rx="4"/>
<text class="dg-fs-sm" x="288" y="150.6" text-anchor="middle">broker-3</text>
<text class="dg-fs-sm" x="288" y="166.6" text-anchor="middle">일반</text>
</g>
<text class="dg-fs-sm" x="24" y="202">프로세스 2종 — ZooKeeper 와 브로커를 따로 운영합니다.</text>
<text class="dg-fs-sm" x="24" y="220">컨트롤러는 브로커 중 한 대가 겸합니다.</text>
<text class="dg-fs-sm" x="24" y="238">일부 CLI 가 --zookeeper 옵션을 씁니다.</text>
<text class="dg-fs-sm dg-muted" x="24" y="256">메타데이터 변경이 znode watch 로 전파됩니다.</text>
<rect class="dg-panel" x="364" y="32" width="348" height="246" rx="4"/>
<text class="dg-fs-sm dg-bold" x="374" y="49">Kafka 4.x — 메타데이터는 __cluster_metadata</text>
<g>
<rect class="dg-node dg-node--accent" x="380" y="52" width="96" height="44" rx="4"/>
<text class="dg-fs-sm" x="428" y="70.5" text-anchor="middle">controller</text>
<text class="dg-fs-sm" x="428" y="86.5" text-anchor="middle">액티브</text>
</g>
<path class="dg-edge dg-edge--dashed" d="M428,126 L428,100" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node" x="488" y="52" width="96" height="44" rx="4"/>
<text class="dg-fs-sm" x="536" y="70.5" text-anchor="middle">controller</text>
<text class="dg-fs-sm" x="536" y="86.5" text-anchor="middle">팔로워</text>
</g>
<path class="dg-edge dg-edge--dashed" d="M536,126 L536,100" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node" x="596" y="52" width="96" height="44" rx="4"/>
<text class="dg-fs-sm" x="644" y="70.5" text-anchor="middle">controller</text>
<text class="dg-fs-sm" x="644" y="86.5" text-anchor="middle">팔로워</text>
</g>
<path class="dg-edge dg-edge--dashed" d="M644,126 L644,100" marker-end="url(#mk-arrow)"/>
<g>
<rect class="dg-node" x="380" y="128" width="96" height="52" rx="4"/>
<text class="dg-fs-sm" x="428" y="150.6" text-anchor="middle">broker-1</text>
<text class="dg-fs-sm" x="428" y="166.6" text-anchor="middle">브로커 롤</text>
</g>
<g>
<rect class="dg-node" x="488" y="128" width="96" height="52" rx="4"/>
<text class="dg-fs-sm" x="536" y="150.6" text-anchor="middle">broker-2</text>
<text class="dg-fs-sm" x="536" y="166.6" text-anchor="middle">브로커 롤</text>
</g>
<g>
<rect class="dg-node" x="596" y="128" width="96" height="52" rx="4"/>
<text class="dg-fs-sm" x="644" y="150.6" text-anchor="middle">broker-3</text>
<text class="dg-fs-sm" x="644" y="166.6" text-anchor="middle">브로커 롤</text>
</g>
<text class="dg-fs-sm" x="380" y="202">프로세스 1종 — 롤만 다른 같은 실행 파일입니다.</text>
<text class="dg-fs-sm" x="380" y="220">컨트롤러는 별도 롤이며 Raft 로 합의합니다.</text>
<text class="dg-fs-sm" x="380" y="238">--zookeeper 옵션은 제거되었습니다.</text>
<text class="dg-fs-sm dg-muted" x="380" y="256">브로커는 메타데이터 로그를 복제해 캐시합니다.</text>
<g>
<rect class="dg-node dg-node--danger" x="8" y="290" width="704" height="60" rx="4"/>
<text class="dg-fs-sm" x="22" y="308.6" text-anchor="start">ZooKeeper 지원은 Kafka 4.0 에서 제거되었습니다.</text>
<text class="dg-fs-sm" x="22" y="324.6" text-anchor="start">마지막 브리지 릴리스는 3.9 이므로, ZooKeeper 를 쓰는 클러스터는 3.9 에서</text>
<text class="dg-fs-sm" x="22" y="340.6" text-anchor="start">KRaft 로 먼저 마이그레이션한 뒤에야 4.x 로 올릴 수 있습니다.</text>
</g>
<text class="dg-fs-sm dg-muted" x="8" y="368">이 사이트의 본문은 4.3 기준이며, 2.x 의 ZooKeeper 서술은 레거시 부록에서만 다룹니다.</text>
</svg>
