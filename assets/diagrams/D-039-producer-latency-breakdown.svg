<svg viewBox="0 0 720 336" role="img" class="kg-diagram"
     aria-labelledby="d039-title d039-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d039-title">프로듀서 지연 분해 — send() 부터 콜백까지 시간이 어디서 쓰이는가</title>
  <desc id="d039-desc">send() 호출부터 onCompletion 콜백까지의 시간을 다섯 구간으로 나눈 가로 막대입니다.
    첫 구간은 배치 대기로 linger.ms 만료나 batch.size 도달을 기다리는 시간이며 record-queue-time-avg 로 관측합니다.
    두 번째는 요청을 브로커로 보내는 네트워크 상행, 세 번째는 브로커가 로그에 append 하고 acks 설정만큼 ISR 복제를 기다리는 시간,
    네 번째는 응답이 돌아오는 네트워크 하행입니다. 이 세 구간을 묶어 request-latency-avg 가 관측합니다.
    마지막 구간은 Sender 스레드에서 실행되는 콜백이며 별도 메트릭이 없고 애플리케이션 코드가 소요 시간을 정합니다.
    acks 가 all 이면 브로커 처리 구간에 ISR 복제 대기가 들어가므로 전체 지연의 큰 부분을 차지할 수 있습니다.
    막대의 길이 비율은 설명을 위한 예시이며 실제 비율은 환경에 따라 달라집니다.</desc>

  <defs>
    <marker id="d039-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-marker" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
  </defs>

  <text x="8" y="20" class="dg-fs-md dg-bold">지연을 줄이려면 먼저 어느 구간이 긴지 봐야 합니다</text>

  <text x="8" y="46" class="dg-fs-sm dg-bold"><tspan class="dg-mono">send()</tspan> → 콜백 전체 시간</text>
  <text x="712" y="46" class="dg-fs-sm dg-muted" text-anchor="end">막대 비율은 예시입니다</text>

  <!-- 구간 막대 -->
  <rect class="dg-node dg-node--accent" x="8" y="56" width="204" height="46" rx="4"/>
  <text x="18" y="76" class="dg-fs-sm dg-bold">① 배치 대기</text>
  <text x="18" y="94" class="dg-fs-sm"><tspan class="dg-mono">linger.ms</tspan> / <tspan class="dg-mono">batch.size</tspan></text>

  <rect class="dg-node dg-node--alt" x="216" y="56" width="86" height="46" rx="4"/>
  <text x="224" y="76" class="dg-fs-sm dg-bold">② 상행</text>
  <text x="224" y="94" class="dg-fs-sm">네트워크</text>

  <rect class="dg-node dg-node--warn" x="306" y="56" width="204" height="46" rx="4"/>
  <text x="316" y="76" class="dg-fs-sm dg-bold">③ 브로커 처리</text>
  <text x="316" y="94" class="dg-fs-sm">append + ISR 복제 대기</text>

  <rect class="dg-node dg-node--alt" x="514" y="56" width="86" height="46" rx="4"/>
  <text x="522" y="76" class="dg-fs-sm dg-bold">④ 하행</text>
  <text x="522" y="94" class="dg-fs-sm">네트워크</text>

  <rect class="dg-node" x="604" y="56" width="108" height="46" rx="4"/>
  <text x="612" y="76" class="dg-fs-sm dg-bold">⑤ 콜백</text>
  <text x="612" y="94" class="dg-fs-sm dg-muted">Sender 스레드</text>

  <!-- 메트릭 브래킷 -->
  <line class="dg-edge dg-edge--accent" x1="8" y1="116" x2="212" y2="116"/>
  <line class="dg-edge dg-edge--accent" x1="8" y1="112" x2="8" y2="120"/>
  <line class="dg-edge dg-edge--accent" x1="212" y1="112" x2="212" y2="120"/>
  <text x="8" y="136" class="dg-fs-sm dg-bold dg-mono">record-queue-time-avg</text>
  <text x="8" y="152" class="dg-fs-sm dg-muted">①만 측정합니다</text>

  <line class="dg-edge dg-edge--accent" x1="216" y1="116" x2="600" y2="116"/>
  <line class="dg-edge dg-edge--accent" x1="216" y1="112" x2="216" y2="120"/>
  <line class="dg-edge dg-edge--accent" x1="600" y1="112" x2="600" y2="120"/>
  <text x="224" y="136" class="dg-fs-sm dg-bold dg-mono">request-latency-avg</text>
  <text x="224" y="152" class="dg-fs-sm dg-muted">② + ③ + ④ 를 한 값으로 묶어 측정합니다</text>

  <line class="dg-edge dg-edge--muted" x1="604" y1="116" x2="712" y2="116"/>
  <line class="dg-edge dg-edge--muted" x1="604" y1="112" x2="604" y2="120"/>
  <line class="dg-edge dg-edge--muted" x1="712" y1="112" x2="712" y2="120"/>
  <text x="712" y="136" class="dg-fs-sm dg-bold" text-anchor="end">전용 메트릭 없음</text>
  <text x="712" y="152" class="dg-fs-sm dg-muted" text-anchor="end">내 코드가 결정</text>

  <!-- 조치 표 -->
  <line class="dg-grid" x1="8" y1="170" x2="712" y2="170"/>
  <text x="8" y="190" class="dg-fs-sm dg-bold">긴 구간별 조치</text>

  <rect class="dg-node dg-node--accent" x="8" y="200" width="228" height="76" rx="4"/>
  <text x="18" y="220" class="dg-fs-sm dg-bold">① 이 길다</text>
  <text x="18" y="240" class="dg-fs-sm"><tspan class="dg-mono">linger.ms</tspan> 를 낮추거나</text>
  <text x="18" y="258" class="dg-fs-sm">트래픽이 적은지 확인</text>
  <text x="18" y="272" class="dg-fs-sm dg-muted">지연 ↔ 처리량 교환입니다</text>

  <rect class="dg-node dg-node--warn" x="246" y="200" width="228" height="76" rx="4"/>
  <text x="256" y="220" class="dg-fs-sm dg-bold">③ 이 길다</text>
  <text x="256" y="240" class="dg-fs-sm"><tspan class="dg-mono">acks</tspan>·ISR 상태·디스크 확인</text>
  <text x="256" y="258" class="dg-fs-sm">느린 팔로워가 있는지 봅니다</text>
  <text x="256" y="272" class="dg-fs-sm dg-muted">복제 대기가 여기 포함됩니다</text>

  <rect class="dg-node" x="484" y="200" width="228" height="76" rx="4"/>
  <text x="494" y="220" class="dg-fs-sm dg-bold">⑤ 가 길다</text>
  <text x="494" y="240" class="dg-fs-sm">콜백에서 무거운 작업 제거</text>
  <text x="494" y="258" class="dg-fs-sm">별도 Executor 로 넘기기</text>
  <text x="494" y="272" class="dg-fs-sm dg-muted">Sender 전체가 막힙니다</text>

  <!-- 정리 -->
  <line class="dg-grid" x1="8" y1="292" x2="712" y2="292"/>
  <text x="8" y="310" class="dg-fs-sm">종단 지연은 여기에 컨슈머 쪽 대기가 더해집니다 — <tspan class="dg-mono">fetch.max.wait.ms=500</tspan>, <tspan class="dg-mono">fetch.min.bytes=1</tspan>.</text>
  <text x="8" y="328" class="dg-fs-sm dg-muted">컨슈머는 high watermark 까지만 읽으므로 ③의 복제 대기는 읽기 가능 시점에도 영향을 줍니다.</text>
</svg>
