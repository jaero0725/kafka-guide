<svg viewBox="0 0 720 328" role="img" class="kg-diagram"
     aria-labelledby="d001-title d001-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d001-title">메시지 큐와 분산 커밋 로그의 차이 — 소비 후 삭제 대 로그 유지와 오프셋</title>
  <desc id="d001-desc">왼쪽은 전통적 메시지 큐입니다. 프로듀서가 m1, m2, m3 를 넣고 컨슈머 A 가 m1 을 꺼내면 큐에서 m1 이 삭제되어 컨슈머 B 는 그 메시지를 다시 볼 수 없고 재처리도 불가능합니다. 오른쪽은 Kafka 의 분산 커밋 로그입니다. 레코드는 로그 끝에 덧붙여지고 오프셋 0부터 7까지 그대로 남습니다. 그룹 A 는 오프셋 3, 그룹 B 는 오프셋 6 처럼 그룹마다 읽은 위치를 따로 가지므로 여러 소비자가 같은 로그를 각자의 속도로 읽을 수 있고, 오프셋을 0으로 되돌리면 처음부터 다시 처리할 수 있습니다. 삭제 시점은 소비 여부가 아니라 retention 설정이 결정합니다.</desc>

<defs>
<marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--accent" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--danger" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--ok" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--warn" d="M0,1 L10,5 L0,9 Z"/></marker>
<marker id="mk-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-marker dg-marker--muted" d="M0,1 L10,5 L0,9 Z"/></marker>
</defs>
<text class="dg-fs-md dg-bold" x="8" y="20">메시지 큐 vs 분산 커밋 로그 — 읽은 뒤에 남는지가 갈린다</text>
<rect class="dg-panel" x="8" y="32" width="348" height="262" rx="4"/>
<text class="dg-fs-sm dg-bold" x="18" y="49">전통적 메시지 큐 — 꺼내면 사라집니다</text>
<rect class="dg-panel" x="364" y="32" width="348" height="262" rx="4"/>
<text class="dg-fs-sm dg-bold" x="374" y="49">Kafka 분산 커밋 로그 — 읽어도 남습니다</text>
<text class="dg-fs-sm" x="20" y="73">1) 프로듀서가 3건 전송</text>
<rect class="dg-node" x="210" y="56" width="44" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="232" y="73.5" text-anchor="middle">m1</text>
<rect class="dg-node" x="254" y="56" width="44" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="276" y="73.5" text-anchor="middle">m2</text>
<rect class="dg-node" x="298" y="56" width="44" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="320" y="73.5" text-anchor="middle">m3</text>
<text class="dg-fs-sm" x="20" y="121">2) 컨슈머 A 가 m1 을 꺼냄</text>
<rect class="dg-node dg-node--danger" x="210" y="104" width="44" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="232" y="121.5" text-anchor="middle">m1</text>
<rect class="dg-node" x="254" y="104" width="44" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="276" y="121.5" text-anchor="middle">m2</text>
<rect class="dg-node" x="298" y="104" width="44" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="320" y="121.5" text-anchor="middle">m3</text>
<g class="dg-x"><line x1="225" y1="110" x2="239" y2="124"/><line x1="239" y1="110" x2="225" y2="124"/></g>
<text class="dg-fs-sm" x="20" y="169">3) 큐에서 m1 은 삭제</text>
<rect class="dg-node--empty" x="210" y="152" width="44" height="26" rx="2"/>
<rect class="dg-node" x="254" y="152" width="44" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="276" y="169.5" text-anchor="middle">m2</text>
<rect class="dg-node" x="298" y="152" width="44" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="320" y="169.5" text-anchor="middle">m3</text>
<g>
<rect class="dg-node dg-node--danger" x="20" y="190" width="324" height="76" rx="4"/>
<text class="dg-fs-sm" x="32" y="208.6" text-anchor="start">컨슈머 B 는 m1 을 볼 수 없습니다.</text>
<text class="dg-fs-sm" x="32" y="224.6" text-anchor="start">같은 메시지를 다른 용도로 한 번 더 쓰거나</text>
<text class="dg-fs-sm" x="32" y="240.6" text-anchor="start">어제 데이터를 다시 처리하는 것이</text>
<text class="dg-fs-sm" x="32" y="256.6" text-anchor="start">구조적으로 불가능합니다.</text>
</g>
<text class="dg-fs-sm" x="376" y="73">1) 로그 끝에 append</text>
<rect class="dg-node" x="548" y="56" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="558" y="73.5" text-anchor="middle">0</text>
<rect class="dg-node" x="568" y="56" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="578" y="73.5" text-anchor="middle">1</text>
<rect class="dg-node" x="588" y="56" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="598" y="73.5" text-anchor="middle">2</text>
<rect class="dg-node" x="608" y="56" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="618" y="73.5" text-anchor="middle">3</text>
<rect class="dg-node" x="628" y="56" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="638" y="73.5" text-anchor="middle">4</text>
<rect class="dg-node" x="648" y="56" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="658" y="73.5" text-anchor="middle">5</text>
<rect class="dg-node" x="668" y="56" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="678" y="73.5" text-anchor="middle">6</text>
<rect class="dg-node" x="688" y="56" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="698" y="73.5" text-anchor="middle">7</text>
<text class="dg-fs-sm" x="376" y="121">2) 그룹 A 는 오프셋 3</text>
<rect class="dg-node dg-node--done" x="548" y="104" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="558" y="121.5" text-anchor="middle">0</text>
<rect class="dg-node dg-node--done" x="568" y="104" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="578" y="121.5" text-anchor="middle">1</text>
<rect class="dg-node dg-node--done" x="588" y="104" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="598" y="121.5" text-anchor="middle">2</text>
<rect class="dg-node" x="608" y="104" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="618" y="121.5" text-anchor="middle">3</text>
<rect class="dg-node" x="628" y="104" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="638" y="121.5" text-anchor="middle">4</text>
<rect class="dg-node" x="648" y="104" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="658" y="121.5" text-anchor="middle">5</text>
<rect class="dg-node" x="668" y="104" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="678" y="121.5" text-anchor="middle">6</text>
<rect class="dg-node" x="688" y="104" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="698" y="121.5" text-anchor="middle">7</text>
<text class="dg-fs-sm" x="376" y="169">3) 그룹 B 는 오프셋 6</text>
<rect class="dg-node dg-node--done" x="548" y="152" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="558" y="169.5" text-anchor="middle">0</text>
<rect class="dg-node dg-node--done" x="568" y="152" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="578" y="169.5" text-anchor="middle">1</text>
<rect class="dg-node dg-node--done" x="588" y="152" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="598" y="169.5" text-anchor="middle">2</text>
<rect class="dg-node dg-node--done" x="608" y="152" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="618" y="169.5" text-anchor="middle">3</text>
<rect class="dg-node dg-node--done" x="628" y="152" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="638" y="169.5" text-anchor="middle">4</text>
<rect class="dg-node dg-node--done" x="648" y="152" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="658" y="169.5" text-anchor="middle">5</text>
<rect class="dg-node" x="668" y="152" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="678" y="169.5" text-anchor="middle">6</text>
<rect class="dg-node" x="688" y="152" width="20" height="26" rx="2"/>
<text class="dg-fs-sm dg-num" x="698" y="169.5" text-anchor="middle">7</text>
<g>
<rect class="dg-node dg-node--ok" x="376" y="190" width="324" height="76" rx="4"/>
<text class="dg-fs-sm" x="388" y="208.6" text-anchor="start">같은 로그를 그룹마다 다른 위치에서 읽습니다.</text>
<text class="dg-fs-sm" x="388" y="224.6" text-anchor="start">오프셋을 0 으로 되돌리면 처음부터 재처리하고,</text>
<text class="dg-fs-sm" x="388" y="240.6" text-anchor="start">삭제 시점은 소비 여부가 아니라</text>
<text class="dg-fs-sm" x="388" y="256.6" text-anchor="start">retention 설정이 정합니다.</text>
</g>
<rect class="dg-node dg-node--ok" x="376" y="272" width="16" height="12" rx="3"/>
<text class="dg-fs-sm" x="398" y="283">진한 칸 = 그 그룹이 이미 읽고 커밋한 구간</text>
<text class="dg-fs-sm dg-bold" x="8" y="314">핵심: 큐는 "전달하고 지우는" 모델, Kafka 는 "쌓아 두고 각자 위치를 기억하는" 모델입니다.</text>
</svg>
