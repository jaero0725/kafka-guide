  <text x="8" y="400" class="dg-fs-sm"><tspan class="dg-bold">CooperativeSticky 의 최종 할당은 Sticky 와 같습니다.</tspan> 다른 것은 리밸런스 프로토콜입니다.</text>
  <text x="8" y="418" class="dg-fs-sm dg-muted">컨슈머가 파티션 수보다 많으면 남는 컨슈머는 아무 파티션도 받지 못합니다 — 파티션 수가 병렬성의 상한입니다.</text>
