<svg viewBox="0 0 720 442" role="img" class="kg-diagram"
     aria-labelledby="d040-title d040-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d040-title">리밸런스 시뮬레이터 — 전략에 따라 파티션 할당이 어떻게 달라지는가</title>
  <desc id="d040-desc">파티션 8개를 컨슈머 최대 5명에게 나누는 격자입니다.
    가로는 파티션 p0 부터 p7, 세로는 컨슈머 C1 부터 C5 이고, 각 칸은 그 컨슈머가 그 파티션을 담당하는지 나타냅니다.
    칸의 상태는 네 가지입니다. 유지는 리밸런스 전과 소유자가 같은 파티션, 신규는 이번에 새로 받은 파티션,
    회수는 cooperative 프로토콜의 1차 리밸런스에서 이전 소유자에게서 떨어진 파티션, 빈 칸은 담당하지 않는 파티션입니다.
    버튼으로 컨슈머를 추가하거나 정상 종료시키거나 크래시시킬 수 있고, 셀렉트로 할당 전략을 바꿀 수 있습니다.
    RangeAssignor 는 토픽별로 파티션을 앞에서부터 잘라 나누므로 연속된 번호가 한 컨슈머에게 뭉칩니다.
    RoundRobinAssignor 는 정렬된 파티션을 순환 배정하므로 번호가 흩어집니다.
    StickyAssignor 는 균형을 먼저 맞추되 가능한 만큼 이전 할당을 유지합니다.
    CooperativeStickyAssignor 는 최종 할당이 StickyAssignor 와 같지만, 옮겨 갈 파티션만 1차 리밸런스에서 회수하고
    2차 리밸런스에서 새 소유자에게 넘기므로 나머지 파티션은 처리가 끊기지 않습니다.
    초기 상태는 RangeAssignor 로 컨슈머 3명에게 배정한 결과이며 C1 이 p0 부터 p2, C2 가 p3 부터 p5, C3 가 p6 과 p7 을 담당합니다.</desc>

  <text x="8" y="20" class="dg-fs-md dg-bold">컨슈머를 추가·제거하며 전략별 할당 변화를 비교해 보세요</text>
