<svg viewBox="0 0 720 492" role="img" class="kg-diagram"
     aria-labelledby="d046-title d046-desc" preserveAspectRatio="xMidYMid meet">
  <title id="d046-title">파티션 할당 전략 4종 비교 — 같은 조건에서 결과가 어떻게 갈리는가</title>
  <desc id="d046-desc">같은 컨슈머 수, 토픽 수, 파티션 수에 대해 네 가지 할당 전략의 결과를 2행 2열로 나란히 보여 주는 인터랙티브 그림입니다.
    RangeAssignor 는 토픽별로 파티션을 앞에서부터 잘라 나누므로 연속된 번호가 한 컨슈머에게 뭉칩니다.
    RoundRobinAssignor 는 모든 토픽의 파티션을 이름 순으로 정렬한 뒤 컨슈머에게 순환 배정하므로 번호가 흩어집니다.
    StickyAssignor 는 균형을 먼저 맞추고 그 안에서 이전 할당을 최대한 유지합니다.
    이전 할당이 없는 첫 배정에서는 결과가 RoundRobinAssignor 와 같아지고, 차이는 재할당할 때 드러납니다.
    CooperativeStickyAssignor 의 최종 할당은 StickyAssignor 와 완전히 같습니다.
    다른 점은 리밸런스 프로토콜이며, 옮겨 갈 파티션만 회수하고 두 번의 리밸런스로 나눠 처리합니다.
    직전에 컨슈머 1명이 이탈한 상황 토글을 켜면 이탈 전 할당을 기준으로 다시 배정하므로
    Sticky 계열이 유지하는 파티션 수와 Range, RoundRobin 이 이동시키는 파티션 수의 차이가 드러납니다.
    초기 상태는 컨슈머 3명, 토픽 1개, 파티션 8개의 첫 배정입니다.</desc>

  <text x="8" y="20" class="dg-fs-md dg-bold">같은 조건, 네 전략 — 슬라이더와 토글로 조건을 바꿔 보세요</text>
  <text data-dg="cond" x="8" y="44" class="dg-fs-sm dg-bold">조건: 컨슈머 3명 · 토픽 1개 × 파티션 8개 = 총 8개 · 첫 배정</text>
